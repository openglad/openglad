# core:orc — split from classpack.yaml (families load in sorted filename order)
families:
  living:
    - id: core:orc
      wire_id: 14
      name: "ORC"
      short_name: ~
      base_stats: [18, 8, 16, 5, 11, 1]
      hiring_cost: 300
      derived_bonuses: [140, 0, 23, 0, 0, 0, 3, 7]
      stat_costs: [6, 15, 5, 40, 50, 200]
      special_costs: [5000, 25, 20, 5000, 5000, 5000]
      weapon_cost: 2
      default_weapon: core:rock
      init_bit_flags: [NO_RANGED]
      init_ani_type: 0
      init_max_magicpoints: 0
      special_names: ["NONE", "HOWL", "EAT CORPSE", "NONE", "NONE", "NONE"]
      alternate_names: ["NONE", "NONE", "NONE", "NONE", "NONE", "NONE"]
      leaves_bloodspot: true
      magic_damage_modifier: 1
      is_stationary: false
      has_returning_weapon: false
      is_undead: false
      promotes_to: core:orc_captain
      promotion_level_req: 5
      death_message: "ORC DIED"
      sprite: "orc.png"
      animation: standard
      ai_line_of_sight: 20
      description: "Orcs are a basic 'grunt'; \nstrong and hard to hurt,  \nthey don't do much more   \nthan inflict pain. Orcs   \ncan't attack at range.    \n\nSpecial: Howl"
      names: ["Grom", "Thrull", "Vernix", "Lanugo", "Grok", "Horde", "Grog", "Krosh"]
      playable: true
      playable_order: 9
      glyph: "o"
      glyph_ascii: "o"
      glyph_color: default
      glyph_bold: false
      glyph_transparent: false
      radar_color: none
      radar_jitter: 0
      tuning:
        # Yell stun: og.max(0, stun_base + rand0(level*level_roll_mult)
        #                       - rand0(con*con_roll_mult))
        yell_stun_base: 10
        yell_level_roll_mult: 10
        yell_con_roll_mult: 10
        # Corpse eating: reach gate (px) and heal per corpse level
        corpse_eat_range: 24
        corpse_heal_per_level: 5
