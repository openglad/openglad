# core:thief — split from classpack.yaml (families load in sorted filename order)
families:
  living:
    - id: core:thief
      wire_id: 11
      name: "THIEF"
      short_name: ~
      base_stats: [9, 12, 12, 10, 5, 1]
      hiring_cost: 400
      derived_bonuses: [75, 0, 12, 0, 0, 0, 5, 5]
      stat_costs: [15, 6, 9, 10, 50, 200]
      special_costs: [5000, 35, 125, 100, 150, 5000]
      weapon_cost: 1
      default_weapon: core:knife
      init_bit_flags: []
      init_ani_type: 0
      init_max_magicpoints: 0
      special_names: ["NONE", "DROP BOMB", "CLOAK", "TAUNT ENEMY", "POISON CLOUD", "NONE"]
      alternate_names: ["NONE", "NONE", "NONE", "CHARM OPPONENT", "NONE", "NONE"]
      leaves_bloodspot: true
      magic_damage_modifier: 1
      is_stationary: false
      has_returning_weapon: false
      is_undead: false
      promotes_to: ~
      promotion_level_req: 0
      death_message: "THIEF KILLED"
      sprite: "thief.png"
      animation: standard
      ai_line_of_sight: 10
      description: "Thieves are fast, though  \nnot so potent as the      \nsoldier. Thieves can throw\nsmall blades rapidly and  \ndamage whole groups of    \nenemies with their bombs. \n\nSpecial: Drop Bomb"
      names: ["Shinobi", "Dismas", "Shadow", "Stabby", "Swiftstrike", "Scourge", "Rogue"]
      playable: true
      playable_order: 7
      glyph: "t"
      glyph_ascii: "t"
      glyph_color: default
      glyph_bold: false
      glyph_transparent: false
      radar_color: none
      radar_jitter: 0
      tuning:
        # Taunt / charm reach (px): base + per-level
        taunt_range_base: 80
        taunt_range_per_level: 4
        charm_range_base: 16
        charm_range_per_level: 4
        # Cloak: invisibility gain = base + rand(roll_span)*level
        cloak_base: 20
        cloak_roll_span: 20
        # Charm duration fed to the engine soft-knee: base + per level-diff
        charm_duration_base: 75
        charm_duration_per_diff: 25
        # Poison cloud: lifetime base + per-level, starting invisibility
        cloud_lifetime_base: 40
        cloud_lifetime_per_level: 3
        cloud_invisibility: 10
