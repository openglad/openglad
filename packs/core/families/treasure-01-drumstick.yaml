# core:drumstick — split from classpack.yaml (families load in sorted filename order)
families:
  treasure:
    - id: core:drumstick
      wire_id: 1
      name: "DRUMSTICK"
      init_ignore: false
      init_frame: -1
      sprite: ~
      animation: ~
      glyph: "%"
      glyph_ascii: "%"
      glyph_color: yellow
      glyph_bold: false
      glyph_transparent: false
      radar_color: 136
      radar_jitter: 2
      tuning:
        # on_eat heal: base = heal_per_level * level, plus a rand0(base) roll
        heal_per_level: 10
