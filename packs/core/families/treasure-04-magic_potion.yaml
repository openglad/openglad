# core:magic_potion — split from classpack.yaml (families load in sorted filename order)
families:
  treasure:
    - id: core:magic_potion
      wire_id: 4
      name: "MAGIC_POTION"
      init_ignore: false
      init_frame: 0
      sprite: ~
      animation: ~
      glyph: "!"
      glyph_ascii: "!"
      glyph_color: magenta
      glyph_bold: true
      glyph_transparent: false
      radar_color: 72
      radar_jitter: 5
      tuning:
        # on_eat: fill the pool, then overfill by this much per level
        mana_overfill_per_level: 50
