# core:archer — split from classpack.yaml (families load in sorted filename order)
families:
  living:
    - id: core:archer
      wire_id: 2
      name: "ARCHER"
      short_name: ~
      stats:
        strength: 6
        dexterity: 12
        constitution: 6
        intelligence: 10
        armor: 5
        level: 1
      combat:
        hp: 90
        melee_damage: 8
        stepsize: 4
        fire_delay: 5
        fire_mp_cost: 1
      costs:
        hire: 350
        train:
          strength: 15
          dexterity: 6
          constitution: 9
          intelligence: 10
          armor: 50
          level: 200
      specials:
        - id: fire_arrows
          name: "FIRE ARROWS"
          mp_cost: 20
        - id: barrage
          name: "BARRAGE"
          mp_cost: 60
        - id: exploding_bolt
          name: "EXPLODING BOLT"
          mp_cost: 70
      default_weapon: core:arrow
      init_bit_flags: []
      init_ani_type: 0
      init_max_magicpoints: 0
      leaves_bloodspot: true
      magic_damage_modifier: 1
      is_stationary: false
      has_returning_weapon: false
      is_undead: false
      promotes_to: ~
      promotion_level_req: 0
      death_message: "ARCHER DIED"
      sprite: "archer.png"
      animation: standard
      ai_line_of_sight: 12
      description: "Archers are fleet of foot,\nand their arrows have a   \nlong range. Although      \nthey're not as strong as  \nother fighters, they can  \nbe a good squad backbone. \n\nSpecial: Fire Arrows"
      names: ["Robin", "Green Arrow", "Legolas", "Yeoman", "Strider", "Longshot", "Bowyer", "Hunter", "Archy"]
      playable: true
      playable_order: 3
      glyph: "a"
      glyph_ascii: "a"
      glyph_color: default
      glyph_bold: false
      glyph_transparent: false
      radar_color: none
      radar_jitter: 0
      tuning:
        # Exploding shot: arrow durability and damage multiplier
        exploding_shot_hp: 500
        exploding_shot_damage_mult: 2.0
        # Melee backpedal trigger distance (px)
        melee_backpedal_range: 64
