# core:gold_bar — split from classpack.yaml (families load in sorted filename order)
families:
  treasure:
    - id: core:gold_bar
      wire_id: 2
      name: "GOLD_BAR"
      init_ignore: false
      init_frame: 0
      sprite: ~
      animation: ~
      glyph: "$"
      glyph_ascii: "$"
      glyph_color: yellow
      glyph_bold: true
      glyph_transparent: false
      radar_color: 88
      radar_jitter: 5
      tuning:
        # on_eat: score banked per bar level
        score_per_level: 200
