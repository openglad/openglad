# core:mage — split from classpack.yaml (families load in sorted filename order)
families:
  living:
    - id: core:mage
      wire_id: 3
      name: "MAGE"
      short_name: ~
      base_stats: [4, 6, 4, 16, 5, 1]
      hiring_cost: 450
      derived_bonuses: [90, 0, 4, 0, 0, 0, 2, 4]
      stat_costs: [20, 15, 16, 6, 50, 200]
      special_costs: [5000, 15, 60, 500, 70, 100]
      weapon_cost: 5
      default_weapon: core:fireball
      init_bit_flags: []
      init_ani_type: 0
      init_max_magicpoints: 0
      special_names: ["NONE", "TELEPORT", "WARP SPACE", "FREEZE TIME", "ENERGY WAVE", "HEARTBURST"]
      alternate_names: ["NONE", "TELEPORT MARKER", "NONE", "NONE", "NONE", "NONE"]
      leaves_bloodspot: true
      magic_damage_modifier: 1
      is_stationary: false
      has_returning_weapon: false
      is_undead: false
      promotes_to: core:archmage
      promotion_level_req: 6
      death_message: "MAGE DIED"
      sprite: "mage.png"
      animation: mage
      ai_line_of_sight: 7
      description: "Mages are slow, can't     \nstand much damage, and are\nhorrible at hand-to-hand  \ncombat, but their magical \nfireballs pack a big      \npunch.                    \n\nSpecial: Teleport"
      names: ["Gandalf", "Saruman", "Radagast", "Alatar", "Pallando", "Raistlin", "Fizban", "Mordenkainen", "Merlin", "Harry", "Manannan", "Mordack", "Jace"]
      playable: true
      playable_order: 4
      glyph: "m"
      glyph_ascii: "m"
      glyph_color: default
      glyph_bold: false
      glyph_transparent: false
      radar_color: none
      radar_jitter: 0
      tuning:
        # Teleport marker: myguy Intelligence requirement
        marker_int_req: 75
        # Freeze time on the player's team: enemy_freeze += base + per_level*level
        freeze_base: 20
        freeze_per_level: 11
        # Freeze time elsewhere: bonus rounds = min(base + per_level*level, cap)
        bonus_rounds_base: 5
        bonus_rounds_per_level: 2
        bonus_rounds_cap: 50
        # Heartburst acquisition radius (px): base + per-level
        heartburst_range_base: 80
        heartburst_range_per_level: 2
