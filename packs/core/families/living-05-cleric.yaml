# core:cleric — split from classpack.yaml (families load in sorted filename order)
families:
  living:
    - id: core:cleric
      wire_id: 5
      name: "CLERIC"
      short_name: ~
      base_stats: [6, 7, 6, 14, 7, 1]
      hiring_cost: 400
      derived_bonuses: [120, 0, 12, 0, 0, 0, 2, 7.5]
      stat_costs: [15, 15, 9, 6, 50, 200]
      special_costs: [5000, 2, 20, 50, 150, 5000]
      weapon_cost: 8
      default_weapon: core:glow
      init_bit_flags: []
      init_ani_type: 0
      init_max_magicpoints: 0
      special_names: ["NONE", "HEAL", "RAISE UNDEAD", "RAISE GHOST", "RESURRECT", "NONE"]
      alternate_names: ["NONE", "MYSTIC MACE", "TURN UNDEAD", "TURN UNDEAD", "NONE", "NONE"]
      leaves_bloodspot: true
      magic_damage_modifier: 1
      is_stationary: false
      has_returning_weapon: false
      is_undead: false
      promotes_to: ~
      promotion_level_req: 0
      death_message: "CLERIC DIED"
      sprite: "cleric.png"
      animation: standard
      ai_line_of_sight: 4
      description: "Clerics, like mages, are  \nslow, but have a stronger \nhand-to-hand attack.      \nClerics possess abilities \nrelated to healing and    \ninteraction with the dead.\n\nSpecial: Heal"
      names: ["Tuck", "Brother", "Pater", "Drake", "Friar", "Francis", "John Paul", "Medic"]
      playable: true
      playable_order: 5
      glyph: "c"
      glyph_ascii: "c"
      glyph_color: default
      glyph_bold: false
      glyph_transparent: false
      radar_color: none
      radar_jitter: 0
      tuning:
        # Heal: ally acquisition radius (px), shared by the special and its AI gate
        heal_range: 60
        # Turn undead: range = per_level * level (px); myguy Int requirement
        turn_undead_range_per_level: 4
        turn_undead_int_req: 60
        # Mystic mace: myguy Int requirement; lifetime base under the engine cap
        mace_int_req: 50
        mace_life_base: 100
        # Corpse-raise reach (px) and the hostile-resurrect ghost lifetime
        raise_skeleton_range: 60
        raise_ghost_range: 30
        resurrect_range: 30
        resurrect_ghost_lifetime: 200
