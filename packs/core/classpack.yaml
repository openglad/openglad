# Core class-pack header (docs/lua-classpacks-design.md §4).
#
# The 73 family descriptor entries live one-per-file under families/
# (<order>-<NN>-<slug>.yaml, NN = the pinned wire id). The loader parses
# this header first, then every families/*.yaml in sorted filename order,
# into one pack (src/resources/packs.cpp install_classpacks). Descriptor
# fields were originally generated by tools/pack_export from the retired
# C++ registries; the YAML is the authoritative source now, and the
# hand-maintained `tuning:` blocks (read by scripts via og.tuning) are
# data pack_export never knew about — edit the families/ files directly.
#
# The core pack ships no `anims:` section: every core family uses a
# built-in animation table (animation: standard|mage|skeleton|
# giant_skeleton|slime|small_slime|static for livings, the gloader
# EntityDef row for the other orders). A mod pack declares its own
# frame sets under a top-level `anims:` mapping and names them from a
# family's `animation:` key — see docs/lua-classpacks-design.md §4.
pack: core
version: 1
title: "OpenGlad Core Families"
authors: "FSGames / the OpenGlad project"
