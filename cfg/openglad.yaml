---
version: 1
effects:
  attack_lunge: on
  damage_numbers: off
  depth_fx: fog
  dust: on
  fire_glow: on
  heal_numbers: on
  hit_anim: on
  hit_flash: on
  hit_recoil: off
  mini_hp_bar: on
  gore: on
  reflections: on
  ripples: on
  screen_shake: on
  weather: on
  shadows: on
  trails: on
graphics:
  fullscreen: on
  width: 640
  height: 400
  # Preserve the logical Windowed client size while width/height describe an
  # Exclusive physical mode. Older configs fall back to width/height outside
  # Exclusive and to 640x400 when they first add these keys.
  windowed_width: 640
  windowed_height: 400
  overscan_percentage: 0
  # World zoom: 1.0 is the classic 320x200 view; lower values zoom out in
  # 0.1 steps down to 0.1. The world canvas is 320x200 / zoom and does not
  # change with the window size. This setting also works in browser builds.
  zoom: 1.0
  # World smoothing: off (nearest), sai, or eagle. SAI/Eagle filter only the
  # scenery canvas; fixed menus and gameplay HUD/radar UI stay nearest.
  # At zoom 0.2/0.1 the renderer falls back to nearest to bound frame cost.
  smoothing: off
  target_fps: 72
sound:
  sound: on
