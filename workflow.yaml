  - id: 05-recapture-and-reconcile
    type: implement
    prompt: |
      # Phase 05 — Recapture and reconcile every golden

      ## Goal context

      {{ GOAL }}

      You are the implementer for Phase 05 of parity-finish-2. Run the
      pinned master companion against every scenario (old + new) and commit
      the canonical golden set. Predicates are NOT widened to accommodate a
      fresh golden — a predicate failing on a fresh golden is a Phase 3
      work item, and the verifier failure bounces back to Phase 5.

      ## Preexisting Inputs (consume in place; do not regenerate)

      - `.plan/parity-recapture-diff.md` (identifies divergent goldens)
      - `tests/parity/scenario_table.h` (Phase 4-extended)
      - `../openglad-master/tools/parity_scenario_table.h` (mirror; SHA-equal)
      - `../openglad-master/build/ci-test/parity_dump_master`
      - `tests/parity/golden/*.json` (existing 39 files)
      - `scripts/parity/capture_master_golden.sh`
      - `scripts/parity/validate_schema.py`
      - `scripts/parity/diff_dumps.py`

      ## New Outputs

      - Refreshed `tests/parity/golden/*.json` — every scenario in
        `kScenarios` with `is_branch_internal == false` has a canonical
        golden at `tests/parity/golden/<id>.json`. Phase-4 new scenarios are
        added; Phase-2 divergent goldens are replaced in place; byte-equal
        goldens are left unchanged.
      - `.plan/parity-second-divergence-report.md` — per-golden recapture &
        predicate-evaluation report (replaces the empty-world report as
        current authority). Required sections:
        - **Header**: pinned companion SHA, branch HEAD SHA, total golden
          count, golden-replace count.
        - **Per-golden replacement log**: one row per replaced golden;
          columns
          `scenario_id | bytes_before | bytes_after | reason (recapture-diff / new-scenario)`.
        - **Predicate-evaluation table**: per scenario, each
          `expected_facts[]` entry and its branch / master evaluation on
          the new golden. Rows where one side passes and the other fails
          are `regression` candidates for Phase 6.
        - **Classified divergences**: every dump field where semantic
          evaluation differs. One of:
          - `regression` (Phase 6 fixes; cite suspect branch commit range
            via `git log origin/master..HEAD -- src/...`).
          - `intended_diff` (cited branch commit explicitly authorising).
          - `rng_drift` (RNG draws differ but every predicate still holds).
      - Updated `.plan/parity-coverage-manifest.md` "Phase X sign-off
        snapshot" section reflecting full coverage outcome.

      ## Commands to run

      ```
      COMPANION_SHA=$(git -C ../openglad-master rev-parse HEAD)
      diff <(sha1sum tests/parity/scenario_table.h | awk '{print $1}') \
           <(sha1sum ../openglad-master/tools/parity_scenario_table.h | awk '{print $1}')
      mkdir -p /tmp/golden_capture
      for id in $(../openglad-master/build/ci-test/parity_dump_master --list); do
          ../openglad-master/build/ci-test/parity_dump_master \
              --scenario "$id" --out "/tmp/golden_capture/$id.json"
          python3 scripts/parity/validate_schema.py "/tmp/golden_capture/$id.json"
      done
      for f in /tmp/golden_capture/*.json; do
          id=$(basename "$f" .json)
          target="tests/parity/golden/$id.json"
          if [ ! -f "$target" ] || ! cmp -s "$f" "$target"; then
              cp "$f" "$target"
          fi
      done
      cmake --build --preset ci-test --target og_test_parity
      build/ci-test/og_test_parity
      ```

      ## Git commit requirement (MUST happen before yielding)

      `git add` the new/replaced goldens, the new divergence report, and
      the manifest update, then `git commit` with message:

      `parity-finish-2: phase 05 — recapture goldens against companion <sha>; <N> replaced, <M> added`

      The next check phases assert HEAD contains those file changes via
      `git log -1 --name-status`.

