        - D: Add a dead predicate → guard `lint_scenario_facts.py::dead_predicate`.
        - E: Widen `WalkerFamilyCount(FAMILY_X, 1, 1)` to `(0, 999)` without `rng_drift` comment → guard `lint_scenario_facts.py::unjustified_widening`.
        - F: Delete a golden to make a row skip → flip `test_parity_scenarios.cpp:108` so the SemanticParity-missing-golden branch (message `"master golden missing for "`) becomes `ADD_FAILURE` instead of `GTEST_SKIP`. Leave the other two `GTEST_SKIP` sites intact (`:118` ByteEqual missing-golden with `"golden not yet captured for "`, and `:144` `OG_PARITY_TEST(NAME)` missing-scenario SKIP with `"scenario \"" #NAME "\" is not present in kScenarios; "`).
        - G: Stage a branch-side `scenario_table.h` change without mirroring → guard new `scripts/parity/check_mirror_sha.sh` that `cmp`s the two files and exits non-zero on mismatch.
        - H: Add a row but never register `OG_PARITY_TEST(id)` → guard new `scripts/parity/check_test_registration.py` greps for every row id in `test_parity_scenarios.cpp`.
