        - A: Skip a treasure row via `compare_mode = ByteEqual` → guard `scripts/parity/check_coverage_manifest.py --require-semantic-parity-for-required-rows`.
        - B: Remove all RNG-insensitive predicates → guard `lint_scenario_facts.py::requires_rng_insensitive_predicate`.
