      - `scripts/parity/capture_master_golden.sh`.
      - `../openglad-master/` worktree + mirror `../openglad-master/tools/parity_scenario_table.h` + `parity_dump_master`.
      - `src/gameplay/families/family_elf.cpp:62-74` (slot 2 BOUNCING ROCKS — two-fire loop).
      - `src/gameplay/families/family_soldier.cpp:45-52` (slot 2 BOOMERANG).
      - `src/gameplay/families/effect_family_shield.cpp:63-134` (boomerang FX; 133-134 registers FAMILY_BOOMERANG).
      - `src/gameplay/families/family_barbarian.cpp:23-65` (slot 2 EXPLODING BOULDER; line 59 `set_skip_exit(5000)`).
      - `src/gameplay/families/weapon_family_projectiles.cpp:14-31` (`projectile_explode_on_death`).
      - Reuses `kInputsSpecialSlot2` (existing input constant — reuse by name).

      ## New Outputs

      3 `ScenarioSpec` rows, 3 `OG_PARITY_TEST(...)` macros, 3 `kMut_*`, 3 goldens,
      mirror update, rebuilt master dump:
      - `weapon_rock_slot2_emit_scen99`
      - `weapon_boomerang_return_scen99`
      - `weapon_exploding_boulder_scen99`

      ## Implementation Details

      First check whether this phase's deliverable already exists and passes (all 3
      scenarios in `kScenarios[]`, macros present, goldens on disk, named tests
      green, mirror in sync). If all hold, ensure the two commits landed and yield
      immediately — do not redo work. Otherwise implement only the missing pieces.

      - **`weapon_rock_slot2_emit_scen99`**: spawns
        `{FAMILY_ELF,0,kOrderLiving,120,120,0,0,4,300}`,
        `{FAMILY_SOLDIER,1,kOrderLiving,200,120,0,0}`; reuse `kInputsSpecialSlot2`;
        tick 30. Facts: `TickReached(30)`, `WalkerFamilyCount(FAMILY_ELF,1,1)`,
        `WeaponFamilyEmitted(FAMILY_ROCK, "consequence: elf slot 2 BOUNCING ROCKS emits FAMILY_ROCK projectiles; mutation aborts the first fire() so no rock ever spawns")`,
        `WalkerOfTeamAlive(0,1,1)`, `WalkerFamilyCount(FAMILY_SOLDIER,1,1)`.
        Mutation `family_elf.cpp:66` (16-space indent):
        `                fireob = static_cast<weap*>(self->fire());` → `                return false;`.
      - **`weapon_boomerang_return_scen99`**: spawns
        `{FAMILY_SOLDIER,0,kOrderLiving,120,120,0,0,4,300}`,
        `{FAMILY_ARCHER,1,kOrderLiving,200,200,0,0}`; reuse `kInputsSpecialSlot2`;
        tick 80. Facts: `TickReached(80)`, `WalkerFamilyCount(FAMILY_SOLDIER,1,1)`,
        `EffectFamilyCount(FAMILY_BOOMERANG, 1, 2, -1, /*window_marker*/0, "consequence: BOOMERANG slot 2 spawns one FAMILY_BOOMERANG FX walker; default window_marker=0 counts every alive FAMILY_BOOMERANG effect in dump.effects[]")`,
        `EventKindAtLeast(/*play_sound*/1, 2)`,
        `WalkerHpRangeAtFinalTick(FAMILY_SOLDIER, 8000, 14000, "rng_drift: soldier HP at tick 80 varies with archer engagement RNG; widened 6000-cent span carries a gate-recognised label")`.
        Mutation `family_soldier.cpp:46` (**12-space indent** — byte-match; the source
