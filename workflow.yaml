  - id: 07b-check-no-bypass-known-tricks
    type: check
    bounce_target: 07-anti-cheating-locks
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 07's anti-cheating bypass coverage.
      Prove that each anti-cheating lock fires on a concrete tampering. Run
      every bypass in a throwaway worktree and restore between bypasses.

      ## Preexisting Inputs

      - `tests/parity/scenario_table.h`
      - `tests/parity/golden/*.json`
      - `scripts/parity/lint_scenario_facts.py`
      - `scripts/parity/validate_schema.py`
      - `tests/parity/test_parity_coverage_gate.cpp`

      ## Things to verify (run these exact commands)

      - `git worktree add /tmp/parity-bypass HEAD`.
      - **Bypass 1 (widening lint)**:
        ```
        cd /tmp/parity-bypass
        sed -i -E 's/WalkerFamilyCount\(FAMILY_SOLDIER,\s*[0-9]+,\s*[0-9]+\)/WalkerFamilyCount(FAMILY_SOLDIER, 0, 99)/' tests/parity/scenario_table.h
        python3 scripts/parity/lint_scenario_facts.py tests/parity/scenario_table.h
        ```
        MUST exit non-zero with `unjustified_widening` on stderr.
        Restore: `git -C /tmp/parity-bypass checkout -- .`.
      - **Bypass 2 (behavioural coverage)**: remove the
        `WeaponFamilyEmitted(FAMILY_KNIFE, ...)` predicate from
        `tests/parity/scenario_table.h` via `sed -i`, then build and run
        `build/ci-test/og_test_parity --gtest_filter='Parity.behavioural_coverage_gate_weapons'`.
        The test MUST FAIL, naming `FAMILY_KNIFE`.
        Restore: `git -C /tmp/parity-bypass checkout -- .`.
      - **Bypass 3 (golden tampering)**:
        `printf 'X' > tests/parity/golden/<first id>.json`. Then
        `python3 scripts/parity/validate_schema.py tests/parity/golden/<id>.json`
        MUST exit non-zero, AND
        `build/ci-test/og_test_parity --gtest_filter='Parity.<id>'` MUST
        FAIL.
      - Cleanup: `git worktree remove --force /tmp/parity-bypass`.

      All three guards must trigger. If any bypass passes silently, fail.

      ## Verdict

      End with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

