        Facts: `TickReached(60)`, `WalkerFamilyCount(FAMILY_BARBARIAN,1,1)`,
        `WeaponFamilyEmitted(FAMILY_BOULDER)`,
        `EffectFamilyCount(FAMILY_EXPLOSION, 1, 4, -1, /*window_marker*/0, "consequence: EXPLODING BOULDER triggers projectile_explode_on_death adding ≥1 FAMILY_EXPLOSION FX walker; default window_marker=0 counts every alive FAMILY_EXPLOSION; upper bound covers chained explosions")`,
