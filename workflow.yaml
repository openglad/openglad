vars:
  GOAL: "Actually deploy the gameplay parity comparison framework against origin/master across a wide variety of scenarios. Cumulative coverage must include every walker family, special ability, attack/weapon, effect, treasure, generator, and event kind. Tear down the fraudulent prior signoff and replace it with honest, reproducible evidence."

phases:
  - id: 01-audit-and-teardown
    type: implement
    bounce_target: null
    prompt: |
      You are the implementer for Phase 01 of the parity-redo workflow.

      Project goal: {{ GOAL }}

      Phase Name: Audit prior fraud and remove poisoned artifacts.

      Branch: `wip/networking`. You MUST create one git commit on this branch before yielding.

      ## Preexisting Inputs (consume in place — do NOT regenerate, recollect, rediscover, or re-derive)

      Treat these as authoritative artifacts of prior phases. Do NOT rebuild them.

      - `.plan/goal.md`
      - `.plan/parity-risk-inventory.md`
      - `.plan/parity-harness-design.md`
      - `.plan/parity-signoff.md` (the fraudulent signoff to be retired)
      - `.plan/parity-divergence-report.md`
      - `.plan/parity-fixes.md`
      - `tests/parity/parity_runner.cpp`
      - `tests/parity/test_parity_scenarios.cpp`
      - `tests/parity/scenario_table.h`
      - `tests/parity/golden/` (15 byte-identical empty-world JSON files)
      - `../openglad-master/tools/parity_dump_master.cpp` (the broken master companion)

      ## New Outputs

      - `.plan/parity-redo-audit.md` — fraud inventory. Required sections:
        (a) the byte-identical `{"effects":[],"events":[],...,"tick":1,"walkers":[]}` pattern shared by all 15 goldens (with one literal sample);
        (b) line-numbered citations from `parity_runner.cpp` and `../openglad-master/tools/parity_dump_master.cpp` for the scenario-not-loaded no-op;
        (c) line-numbered citation from `parity_runner.cpp::apply_inputs_at_tick` for the empty body;
        (d) explanation of the `level_done`-on-empty-world short-circuit that keeps every golden at `tick: 1`;
        (e) note that `.plan/parity-signoff.md` is being renamed to `.plan/parity-signoff-fraudulent.md` in this same commit.
      - `.plan/parity-signoff-fraudulent.md` — original signoff renamed in place via `git mv` so it remains in history but is no longer authoritative.

      The audit document must include literal command outputs (e.g. `wc -c tests/parity/golden/*.json` showing every file ≤ 200 bytes before deletion) and explicitly state that future phases will reconstruct goldens from a fixed master companion, not the current broken one.

      ## File Changes

      - Delete `tests/parity/golden/*.json` (all 15 files).
      - `git mv .plan/parity-signoff.md .plan/parity-signoff-fraudulent.md`.
      - Create `.plan/parity-redo-audit.md`.
      - No source code is modified in this phase.

      ## Git Commit Requirement (BLOCKING)

      Before yielding, `git add` the 15 deletions, the rename, and `.plan/parity-redo-audit.md`, and create one commit on `wip/networking` (suggested subject: `parity-redo: phase 01 — tear down fraudulent golden set and rename signoff`). The next check phase expects HEAD to contain these changes.

  - id: 01a-check-audit-document
    type: check
    bounce_target: 01-audit-and-teardown
    prompt: |
      You are the verifier for Phase 01 (`01-audit-and-teardown`). Your role is to confirm the audit document exists, lists every deleted golden by path, and that the deletions and rename are committed at HEAD.

      Run each of the following and check the result:

      1. `test -f .plan/parity-redo-audit.md` — must succeed.
      2. `test -f .plan/parity-signoff-fraudulent.md` — must succeed.
      3. `test ! -f .plan/parity-signoff.md` — must succeed (the old file is gone).
      4. `[ "$(ls tests/parity/golden/*.json 2>/dev/null | wc -l)" -eq 0 ]` — zero JSON goldens remain.
      5. `grep -c '"walkers":\[\]' .plan/parity-redo-audit.md` — must return ≥ 1 (the document cites the empty-world golden pattern).
      6. `[ "$(git log -1 --name-status | grep -c '^D')" -ge 15 ]` — HEAD commit shows ≥ 15 deletions.
      7. Open `.plan/parity-redo-audit.md` and confirm it contains all five required sections (empty-world sample, line-numbered runner citation, line-numbered master companion citation, `apply_inputs_at_tick` empty-body citation, explanation of the `level_done` short-circuit, mention of the signoff rename).

      If every check passes, emit on the final line exactly:
      `VERDICT: PASS`

      Otherwise emit on the final line exactly:
      `VERDICT: FAIL: <concise reason>`

  - id: 02-real-runner-and-companion
    type: implement
    bounce_target: null
    prompt: |
      You are the implementer for Phase 02 of the parity-redo workflow.

      Project goal: {{ GOAL }}

      Phase Name: Real branch runner + real master companion.

      Branches: primary repo on `wip/networking`; master companion worktree at `../openglad-master` on its own `parity-companion` branch. You MUST create TWO commits before yielding (one in each worktree).

      ## Preexisting Inputs (consume in place — do NOT regenerate, rediscover, or re-derive)

      Treat the Phase 01 audit and the Phase 03 harness design as authoritative. Reuse the existing schema-v1 emitter; do not rewrite the schema.

      - `.plan/parity-redo-audit.md` (Phase 01 output — authoritative)
      - `.plan/parity-harness-design.md` (schema reused unchanged)
      - `tests/parity/parity_runner.{h,cpp}` (to be rewritten)
      - `tests/parity/parity_test_main.cpp` (PhysFS init lands here or in a runner setup helper)
      - `tests/parity/scenario_table.h` (extended with a smoke scenario plus the new `SpawnSpec`/`Exercises`/`fresh_arena`/`player_team`/`is_intentionally_empty` fields)
      - `tests/parity/test_parity_scenarios.cpp` (extended with one smoke test entry)
      - `tests/parity/state_dump.{h,cpp}` (schema unchanged; emitter reused; extend v1 with `level_done`, `level_tick_count` fields — v1 tolerates unknown keys)
      - `tests/test_network_fixture.h:495-535` (reference for headless `LevelRuntimeData` setup)
      - `src/platform/text/platform_headless.cpp:340-385` (reference for PhysFS + campaign bootstrap)
      - `src/interface/level_runtime_data.cpp:831-883` (reference for scenario-file resolution)
      - `../openglad-master/tools/parity_dump_master.cpp` (to be rewritten against master's real surface)
      - `../openglad-master/tools/parity_dump_master_stubs.cpp`
      - `CMakeLists.txt` (parity-test wiring at line 1807)
      - `../openglad-master/CMakeLists.txt`

      ## New Outputs

      - `tests/parity/parity_bootstrap.{h,cpp}` — PhysFS + campaign + search-path setup that:
        1. Calls `og::resources::init(argv0)`.
        2. Sets writable scratch directory under `${CMAKE_BINARY_DIR}/parity-write/`.
        3. Calls `restore_default_campaigns()` then `mount_campaign_package_with_error("org.openglad.gladiator")`.
        4. Adds `temp/scen/` and `scen/` to the PhysFS search path so scenario files at either root resolve as `scen{id}.fss`.
        5. Installs `sdl_level_data_hooks()` unchanged.
        6. Provides teardown that unmounts and `og::resources::deinit`s.
        Includes a `BootstrapScope` RAII struct. Mirrored byte-for-byte at `../openglad-master/tools/parity_bootstrap.{h,cpp}`.
      - `tests/parity/scenario_runtime.{h,cpp}`:
        - `int scenario_level_id(string_view scenario_file)` parses the integer between `scen` and `.fss`.
        - `void apply_post_load_spawns(GameWorld&, const ScenarioSpec&)` iterates `spec.spawns[]` and calls `world.add_ob(static_cast<Order>(spawn.order), spawn.family, /*atstart=*/true)`, sets position via `set_xpos`/`set_ypos`, team via `set_team_num`/`set_real_team_num`, and `set_default_weapon`/`set_current_weapon` when non-zero.
        - `void apply_inputs_at_tick(GameWorld&, const ScenarioSpec&, uint32_t tick)` finds matching entries, identifies the first walker with `team_num() == spec.player_team`, and calls `walker->set_keys(entry.key_mask)`.
        - `void clear_world_entities(GameWorld&)` for `fresh_arena` scenarios.
      - Extensions of `ScenarioSpec` in `tests/parity/scenario_table.h`:
        - `const SpawnSpec* spawns; std::size_t spawn_count;`
        - `struct SpawnSpec { std::int32_t family; std::uint8_t team; std::uint8_t order; std::int32_t x; std::int32_t y; std::uint16_t default_weapon; std::uint16_t current_weapon; };`
        - Wrapper helpers `kOrderLiving`, `kOrderWeapon`, `kOrderTreasure`, `kOrderGenerator`, `kOrderFX`.
        - `std::uint8_t player_team = 0;`, `bool is_intentionally_empty = false;`, `bool fresh_arena = false;`, `std::uint64_t exercises = 0;` plus a new `enum class Exercises : std::uint64_t { None = 0 };` (extended in Phase 03).
        - Existing 16 scenarios initialised with `spawns = nullptr; spawn_count = 0;`.
        - Input constants `K_NONE`, `K_FIRE`, `K_SPECIAL`, `K_SPECIAL_SWITCH`, plus directional variants.
      - New smoke scenarios `smoke_nonempty_scen99` (populated arena, no inputs) and `smoke_nonempty_scen99_inputs` (scripted `{1, 0, K_FIRE}, {3, 0, K_NONE}`); both must produce non-empty walker dumps with differing position/keys fields.
      - Rewrite of `parity_runner.cpp::run_scenario` to use `LevelRuntimeData(level_id, /*headless=*/true, &sdl_level_data_hooks())`, install a `ScopedGameplayContext`, call `level.load()`, re-seed `world.rng_.state_ = spec.rng_seed` AFTER `load()`, optionally `clear_world_entities(world)` when `fresh_arena`, apply spawns, then run the full `tick_budget` ticks applying inputs each tick WITHOUT breaking on `level_done`. The schema-v1 dump records `world.level_done` and `world.level_tick_count()`. References `extern cfg_store cfg;` from `include/openglad/resources/gparser.h:38` — does not default-construct a local `cfg_store`.
      - Mirror rewrite of `../openglad-master/tools/parity_dump_master.cpp::run` against master's actual surface, including additional headless stubs in `parity_dump_master_stubs.cpp`. `tools/parity_scenario_table.h` on master is byte-for-byte synchronised.
      - `parity_runner_smoke` — small CMake executable target linking bootstrap + runner; emits JSON for a named scenario to stdout (extended in Phase 07 to support `--list`).
      - Append to `.plan/parity-harness-design.md` a "Phase 02 redo: load path" section documenting the real load/tick/inject pipeline and the new `spawns[]` schema field. Schema-v1 JSON unchanged.

      ## Implementation Details

      - PhysFS init happens exactly once per process in `parity_test_main.cpp` SetUp.
      - `LevelRuntimeData::load()` reads RNG state during decoration; re-apply `rng_seed` AFTER `load()` so the tick loop starts from the canonical seed.
      - Do NOT `break` on `level_done`; run the full `tick_budget`.
      - Mirror bootstrap/scenario-runtime files between branch and `../openglad-master/tools/` are kept byte-for-byte synchronised.

      ## Git Commit Requirement (BLOCKING)

      Two commits before yielding, one in each worktree:
      1. `git add` branch-side files and `git commit -m "parity-redo: phase 02 — real runner and schema-v1 fields"`.
      2. `git -C ../openglad-master add` companion files and `git -C ../openglad-master commit -m "parity-companion: phase 02 — real load/tick/inject pipeline"`.

      The check phases assert both commits exist and that both working trees are clean (`git status --porcelain` empty).

  - id: 02a-check-build-clean
    type: check
    bounce_target: 02-real-runner-and-companion
    prompt: |
      You are the verifier for Phase 02 (`02-real-runner-and-companion`). Your role is to confirm both branch and master companion build cleanly and that both worktrees have the phase commit at HEAD with a clean working tree.

      Run each of the following and check the result:

      1. `cmake --preset ci-test` — must succeed.
      2. `cmake --build --preset ci-test --target og_test_parity parity_runner_smoke` — must succeed.
      3. `(cd ../openglad-master && cmake --preset ci-test && cmake --build --preset ci-test --target parity_dump_master)` — must succeed.
      4. `git log -1 --stat` — branch commit visible, touching the new parity sources and CMakeLists.txt.
      5. `git -C ../openglad-master log -1 --name-status` — master-side commit visible; `name-status` must list `tools/parity_dump_master.cpp`, `tools/parity_bootstrap.cpp`, and `tools/parity_scenario_runtime.cpp`.
      6. `[ -z "$(git -C ../openglad-master status --porcelain)" ]` — master worktree clean.
      7. `[ -z "$(git status --porcelain)" ]` — branch worktree clean.

      If every check passes, emit on the final line exactly:
      `VERDICT: PASS`

      Otherwise emit on the final line exactly:
      `VERDICT: FAIL: <concise reason>`

  - id: 02b-check-smoke-nonempty
    type: check
    bounce_target: 02-real-runner-and-companion
    prompt: |
      You are the verifier for Phase 02 (`02-real-runner-and-companion`). Your role is to confirm the rewritten runner actually loads a scenario, runs ≥ 50 ticks, and emits a non-empty walker dump on BOTH branch and master, and that scripted inputs produce observably-different state.

      Run each of the following and check the result:

      1. `./build/ci-test/og_test_parity --gtest_filter=Parity.smoke_nonempty_scen99` — must exit 0 with a passing test line.
      2. `../openglad-master/build/ci-test/parity_dump_master --scenario smoke_nonempty_scen99 --out /tmp/smoke.json` — must exit 0 and produce `/tmp/smoke.json`.
      3. `python3 -c "import json; d=json.load(open('/tmp/smoke.json')); assert len(d['walkers'])>0 and d['tick']>=50, d"` — must exit 0.
      4. Run `smoke_nonempty_scen99` and `smoke_nonempty_scen99_inputs` and confirm their dumps differ in at least one walker position or `keys` field (the inputs scenario must show observable input-driven divergence).

      If every check passes, emit on the final line exactly:
      `VERDICT: PASS`

      Otherwise emit on the final line exactly:
      `VERDICT: FAIL: <concise reason>`

  - id: 03-coverage-manifest-and-gate
    type: implement
    bounce_target: null
    prompt: |
      You are the implementer for Phase 03 of the parity-redo workflow.

      Project goal: {{ GOAL }}

      Phase Name: Define and enforce coverage taxonomy.

      Branches: primary repo on `wip/networking`; master companion at `../openglad-master` on `parity-companion`. You MUST create one commit on each branch before yielding.

      ## Preexisting Inputs (consume in place — do NOT rediscover families or rebuild Phase 02 artifacts)

      Treat the Phase 02 runner/companion and the extended `scenario_table.h` as authoritative. Read `constants.h` and `event.h` once to enumerate the required-coverage targets; do not invent or rename them.

      - `tests/parity/scenario_table.h` (extended in Phase 02 with `SpawnSpec`, `spawns`, `exercises`, `fresh_arena`, `player_team`, `is_intentionally_empty`)
      - `../openglad-master/tools/parity_scenario_table.h` (mirror — must remain byte-for-byte synchronised after the `Exercises` widening)
      - `include/openglad/core/constants.h` (`FAMILY_*` constants and `MAX_TREASURE`)
      - `include/openglad/gameplay/event.h` (`enum class EventKind`)
      - `src/gameplay/effect_family_registry.cpp` (effect family registration)
      - `src/gameplay/families/family_*.cpp` (family descriptors with `set_do_special(...)` bindings)
      - `tests/parity/state_dump.cpp::kind_string` (canonical symbolic names for `EventKind`, lines 134-147)
      - The `og_test_parity` binary from Phase 02 (builds cleanly)

      ## New Outputs

      - `.plan/parity-coverage-manifest.md` — long-form table of every coverage target with a `covering_scenario_id` column (initially most rows say `(none yet)`). Frontmatter includes `master_companion_sha:` (recorded from Phase 02's master commit) so Phases 04-07 diff against a fixed master.
      - `tests/parity/coverage_targets.h` declaring:
        - `inline constexpr std::int32_t kRequiredWalkerFamilies[]` — all 21 from `FAMILY_SOLDIER..FAMILY_TOWER1`.
        - `inline constexpr std::int32_t kRequiredEffectFamilies[]` — all 13.
        - `inline constexpr std::int32_t kRequiredWeaponFamilies[]` — all 20 from `FAMILY_KNIFE..FAMILY_BOULDER`.
        - `inline constexpr std::int32_t kRequiredTreasureFamilies[]` — `FAMILY_STAIN..FAMILY_SPEED_POTION`.
        - `inline constexpr std::pair<std::int32_t, std::uint8_t> kRequiredSpecials[]` enumerating every `(family, special_index)` pair with a non-null `do_special`.
        - `inline constexpr std::string_view kRequiredEventKinds[]` — the nine non-`None` `EventKind` symbols matching `state_dump.cpp::kind_string`.
      - `tests/parity/test_parity_coverage_gate.cpp` — added to the existing `og_add_test_group(parity ...)` source list (no new executable target). Cases under the `Parity` GoogleTest suite, selectable via `--gtest_filter='Parity.coverage_gate*'`:
        - `Parity.coverage_gate_walker_families`
        - `Parity.coverage_gate_specials`
        - `Parity.coverage_gate_effect_families`
        - `Parity.coverage_gate_weapon_families`
        - `Parity.coverage_gate_treasure_families`
        - `Parity.coverage_gate_event_kinds`
        - `Parity.coverage_gate` (umbrella requiring all above)
        Each case runs every scenario in `kScenarios` once via `run_scenario`, collects the union of `walker.family`, `effect.family`, `event.kind`, and per-scenario `spec.exercises` bits, asserts the corresponding required array is a subset of the observed union. The fixture builds the union once in `SetUpTestSuite()` and caches it. Failures print a structured list of every uncovered target.
      - `scripts/parity/check_coverage_manifest.py` — pre-build static check. Parses `include/openglad/core/constants.h` for every `inline constexpr int FAMILY_*` and `include/openglad/gameplay/event.h` for `EventKind`. Asserts `tests/parity/coverage_targets.h` is a superset of the parsed entities. Exits non-zero with named missing entries.
      - Widen `enum class Exercises : std::uint64_t` in `tests/parity/scenario_table.h` with one bit per coverage target not structurally observable (e.g. `Special_Archmage_1 = 1ULL<<0`, ...). Mirror the widening byte-for-byte in `../openglad-master/tools/parity_scenario_table.h`.
      - Register `tests/parity/test_parity_coverage_gate.cpp` in the existing `og_add_test_group(parity ...)` source list in `CMakeLists.txt` (line 1807). No new `add_executable(...)`.
      - Append a "Phase 03 redo: coverage gate" section to `.plan/parity-harness-design.md` pointing to the manifest and gate test.

      ## Implementation Details

      - The manifest is the single source of truth for "what must be tested". Adding a family without updating the manifest fails the static check; adding a manifest entry without a covering scenario fails the runtime gate.
      - `kRequiredSpecials[]` is populated by inspecting each `src/gameplay/families/family_*.cpp` for `set_do_special(...)` bindings; or per-family `special_count` with `(family, 1..special_count)`.
      - At Phase 03 completion the coverage gate is expected to FAIL at runtime — Phases 04-06 will fill it in. That is intended and is what verifier `03b` confirms.

      ## Git Commit Requirement (BLOCKING)

      One commit per worktree before yielding:
      1. Branch-side: `git add` new files and edits, `git commit -m "parity-redo: phase 03 — coverage manifest and runtime gate"`.
      2. Master-side: `git -C ../openglad-master add tools/parity_scenario_table.h`, `git -C ../openglad-master commit -m "parity-companion: phase 03 — Exercises mirror"`.

  - id: 03a-check-manifest-completeness
    type: check
    bounce_target: 03-coverage-manifest-and-gate
    prompt: |
      You are the verifier for Phase 03 (`03-coverage-manifest-and-gate`). Your role is to confirm the static coverage manifest enumerates every family, weapon, effect, treasure, generator, special-ability index, and `EventKind` declared in headers and family descriptors.

      Run each of the following and check the result:

      1. `python3 scripts/parity/check_coverage_manifest.py` — must exit 0.
      2. `cmake --build --preset ci-test --target og_test_parity` — must succeed.
      3. `test -s .plan/parity-coverage-manifest.md` — must succeed.
      4. `test -s tests/parity/coverage_targets.h` — must succeed.
      5. `grep -q 'master_companion_sha:' .plan/parity-coverage-manifest.md` — must succeed.
      6. `git log -1 --pretty=%s` — branch commit subject must mention phase 03.
      7. `git -C ../openglad-master log -1 --pretty=%s` — master-side commit subject must mention phase 03.

      If every check passes, emit on the final line exactly:
      `VERDICT: PASS`

      Otherwise emit on the final line exactly:
      `VERDICT: FAIL: <concise reason>`

  - id: 03b-check-gate-fails-on-omission
    type: check
    bounce_target: 03-coverage-manifest-and-gate
    prompt: |
      You are the verifier for Phase 03 (`03-coverage-manifest-and-gate`). Your role is to confirm the coverage gate is a real runtime gate that fails when a covering scenario is removed. Build failure is NOT an acceptable substitute — fail this check if the binary cannot be built.

      Run each of the following and check the result:

      1. `git stash push -m phase03b -- tests/parity/scenario_table.h` — must succeed (working tree clean before; gives you a safe slot to edit).
      2. Edit `tests/parity/scenario_table.h` in place to remove the lone covering scenario for one target recorded by Phase 03 in `.plan/parity-coverage-manifest.md`.
      3. `cmake --build --preset ci-test --target og_test_parity` — must succeed (the gate is runtime, not compile-time).
      4. `./build/ci-test/og_test_parity --gtest_filter='Parity.coverage_gate*'` — must exit non-zero. Its failure output must name the now-uncovered target.
      5. `git checkout -- tests/parity/scenario_table.h && git stash pop` — restore the file.
      6. `cmake --build --preset ci-test --target og_test_parity` — must succeed after restoration (validates the test environment is reproducible).

      If every check passes, emit on the final line exactly:
      `VERDICT: PASS`

      Otherwise emit on the final line exactly:
      `VERDICT: FAIL: <concise reason>`

  - id: 04-walker-family-scenarios
    type: implement
    bounce_target: null
    prompt: |
      You are the implementer for Phase 04 of the parity-redo workflow.

      Project goal: {{ GOAL }}

      Phase Name: One byte-equal scenario per walker family (21 families).

      Branches: primary repo on `wip/networking`; master companion at `../openglad-master` on `parity-companion`. You MUST create one commit on each branch before yielding.

      ## Preexisting Inputs (consume in place — do NOT regenerate, recapture, or re-derive)

      Treat the Phase 03 manifest, coverage_targets, scenario_table, and the master companion binary as authoritative. Reuse the existing master companion built at the SHA recorded in the manifest frontmatter — do not rebuild master from scratch.

      - `tests/parity/scenario_table.h` (extended through Phase 03)
      - `tests/parity/coverage_targets.h::kRequiredWalkerFamilies[]`
      - `tests/parity/scenario_runtime.{h,cpp}` (provides `apply_post_load_spawns`, `clear_world_entities`)
      - `../openglad-master/tools/parity_scenario_table.h` (mirror — keep byte-for-byte synchronised)
      - `scen/scen99.fss`, `scen/scen9301.fss` (base maps)
      - `scripts/parity/capture_master_golden.sh` (callable here with `tests/parity/golden/` as destination)
      - `scripts/parity/validate_schema.py`
      - `../openglad-master/build/ci-test/parity_dump_master` (built in Phase 02 at the SHA in `.plan/parity-coverage-manifest.md` frontmatter)
      - `.plan/parity-coverage-manifest.md`

      ## New Outputs

      - 21 new `ScenarioSpec` entries in `kScenarios`, one per family `FAMILY_SOLDIER..FAMILY_TOWER1`. Naming: `family_<symbolic_lowercase>_scen99` or `_scen9301`. Each spec uses:
        - `tick_budget = 150`.
        - `fresh_arena = true` (runner clears pre-existing walkers via `clear_world_entities(world)` between `level.load()` and `apply_post_load_spawns`).
        - `spawns[]`: target family on team 0 at `(120, 120)` and `FAMILY_SOLDIER` on team 1 at `(180, 120)` as a sparring partner; generators get an additional spawn entry of the corresponding generator family.
        - `inputs[]`: `{ {5, 0, K_FIRE}, {64, 0, K_NONE} }` — attack at tick 5, stop at tick 64. Non-combatant generators have empty `inputs`.
        - `exercises`: appropriate bit flag from Phase 03's `Exercises` enum.
      - Mirror entries in `../openglad-master/tools/parity_scenario_table.h` (byte-for-byte synchronised), committed on `parity-companion`.
      - 21 golden files in `tests/parity/golden/family_*.json` captured in this phase by the rebuilt master companion via `scripts/parity/capture_master_golden.sh tests/parity/golden/` filtered to the new ids; schema-validated; committed. Canonical — not regenerated by later phases except Phase 07's audit.
      - `tests/parity/test_parity_scenarios.cpp` — add `OG_PARITY_TEST(N, family_<name>_scen99)` lines.
      - `.plan/parity-coverage-manifest.md` updated with `covering_scenario_id` populated for all 21 walker families.

      ## Implementation Details

      - `fresh_arena = true` is required so families that depend on RNG consumption during `load()` do not accumulate pre-existing walkers.
      - Family-specific gotchas: slime splits on death (dump captures split products); `FAMILY_GHOST` fires ghost-scare effect on enemy contact; `FAMILY_TOWER1` is static but fires weapons.
      - Capture sequence:
        1. Confirm `../openglad-master/build/ci-test/parity_dump_master` is built from the SHA recorded in the manifest frontmatter.
        2. `scripts/parity/capture_master_golden.sh tests/parity/golden/` filtered to the 21 new ids.
