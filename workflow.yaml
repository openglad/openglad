        `run_mutation_canary.sh --all` →
        `capture_master_golden.sh --all --out-dir /tmp/recap --no-write` +
        `cmp -s` loop → `anti_cheat_selftest.sh`. `set -e`; each step's exit
        code logged to stderr.
