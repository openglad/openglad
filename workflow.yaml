      carry an `rng_drift:` label.

      ## Mirror + Capture (standard per-implement sequence)

      1. Append table rows + macros (byte-match each mutation `from`/`to` to the cited source line incl. tabs vs spaces).
      2. `cp tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h`.
