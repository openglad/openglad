vars:
  GOAL: "Drive openglad parity coverage from baseline to honest sign-off: every required walker/weapon/effect/treasure/generator/special/event-kind bound by RNG-insensitive predicates, mass golden recapture, mutation canary green, and anti-cheat self-test passing."

phases:
  - id: 01-baseline-and-inventory
    type: implement
    prompt: |
      You are the implementing engineer for Phase 01 — Baseline test counts and per-target coverage gap inventory.

      Goal: {{ GOAL }}

      Preexisting Inputs (do NOT recollect or rediscover; read and consume them as-is):
      - `.plan/goal.md`
      - `.plan/parity-coverage-manifest.md`
      - `.plan/parity-honest-audit.md`
      - `tests/parity/coverage_targets.h`
      - `tests/parity/scenario_table.h`
      - `tests/parity/golden/*.json` (39 files)
      - `../openglad-master/` worktree at HEAD `de702ef0...`
      - `scripts/parity/check_coverage_manifest.py` (no argparse yet)

      New Outputs:
      - `.plan/parity-present-state.md` (≤200 lines) containing:
        - Test count snapshot: lines `Passed: P`, `Skipped: S`, `Failing: F` derived from `og_test_parity --gtest_brief=1`. `--gtest_brief=1` does not emit a `[  FAILED  ] N tests.` summary line; failure count is `grep -cE "^\[  FAILED  \] Parity\." /tmp/p01.out`.
        - Failing tests: one bullet per `[  FAILED  ] Parity.<id>` line.
        - Skipped tests: one bullet per `master golden missing for <id>` line.
        - Master companion SHA pinned this phase: one line `Master companion SHA: <40-hex>` equal to `git -C ../openglad-master rev-parse HEAD`.
        - Mirror SHA delta: literal `sha1sum tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h` output. If unequal, state "BRANCH ≠ COMPANION — phase 02 resyncs."
        - Per-target coverage gap inventory: seven tables, one per category, each with columns `target | observed_in_any_row | covering_scenario_id | golden_present`:
          - 21 walker families
          - 20 weapon families
          - 13 treasure families
          - 4 generator families
          - 13 effect families
          - 42 (family, special_slot) pairs as literal tokens `FAMILY_<name>:slot<N>` (`kRequiredSpecials` is `std::pair<std::int32_t, std::uint8_t>`; `.first` reverse-mapped via the bare `family_symbol` table in `state_dump.cpp`, `.second` rendered decimal)
          - 9 event kinds
        - Broken-state authorisation: quote bounds from plan §1 verbatim.
      - `.plan/parity-coverage-manifest.md` updated in place: `master_companion_sha` frontmatter equals the live companion SHA; `(none yet)` cells reflect current `kScenarios` observations.
      - Extend `scripts/parity/check_coverage_manifest.py` with `argparse` + two subcommands:
        - `--emit-gap-table`: parses `tests/parity/coverage_targets.h` and `tests/parity/scenario_table.h`, writes seven gap tables as pipe-tables to stdout.
        - `--emit-scenario-list`: writes one tab-separated line per `kScenarios` row: `<id>\t<compare_mode>\t<is_branch_internal>` (`compare_mode` is enum identifier verbatim with no `CompareMode::` prefix; `is_branch_internal` is lowercase `true`/`false`). Single trailing newline.
        - Both subcommands stdout-only, exit 0 on success, ≠0 on parse failure. Default behaviour unchanged.

      Implementation Steps:
      1. `cmake --build --preset ci-test --target og_test_parity && build/ci-test/og_test_parity --gtest_brief=1 2>&1 | tee /tmp/p01.out`.
      2. Extract counts:
         - `PASSED=$(grep -oE '^\[  PASSED  \] [0-9]+' /tmp/p01.out | head -1 | awk '{print $3}')`
         - `SKIPPED=$(grep -oE '^\[  SKIPPED \] [0-9]+' /tmp/p01.out | head -1 | awk '{print $3}')`
         - `FAILED=$(grep -cE '^\[  FAILED  \] Parity\.' /tmp/p01.out)`
      3. Implement the new argparse subcommands.
      4. `python3 scripts/parity/check_coverage_manifest.py --emit-gap-table > /tmp/gap.md` and embed verbatim in `.plan/parity-present-state.md`.
      5. For each target row, `golden_present` is `yes` iff `tests/parity/golden/<covering_scenario_id>.json` exists.

      Do NOT regenerate or rediscover the manifest or honest audit from scratch — read and update them in place.

      Git Commit Requirement (MUST run before yielding):
      ```
      git add .plan/parity-present-state.md \
              .plan/parity-coverage-manifest.md \
              scripts/parity/check_coverage_manifest.py
      git commit -m "parity-cov: phase 01 — baseline and per-target gap inventory"
      ```
      No companion-side commit this phase.

  - id: 01a-check-tree-clean-and-counts
    type: check
    bounce_target: 01-baseline-and-inventory
    prompt: |
      You are the reviewer for verification phase 01a.

      Purpose: Confirm clean working tree, present-state doc exists, recorded counts re-derive from a fresh test run.

      Verify ALL of the following:
      1. `git status --porcelain | grep -v '^?? .plan/.juvenal-state.json$' | grep -v '^?? scripts/parity/__pycache__' | wc -l` equals `0`.
      2. `test -f .plan/parity-present-state.md` succeeds.
      3. Re-run `cmake --build --preset ci-test --target og_test_parity && build/ci-test/og_test_parity --gtest_brief=1`, re-derive `PASSED/SKIPPED/FAILED`, and `grep -F` each integer in `.plan/parity-present-state.md` under "Test count snapshot".
      4. `git log -1 --name-status` lists `.plan/parity-present-state.md` and `.plan/parity-coverage-manifest.md`.

      End your response with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 01b-check-companion-sha-pinned
    type: check
    bounce_target: 01-baseline-and-inventory
    prompt: |
      You are the reviewer for verification phase 01b.

      Purpose: Companion SHA is pinned consistently across present-state and manifest.

      Verify ALL of the following:
      1. `SHA=$(git -C ../openglad-master rev-parse HEAD)`.
      2. `grep -F "Master companion SHA: $SHA" .plan/parity-present-state.md` exits 0.
      3. `grep -F "master_companion_sha: $SHA" .plan/parity-coverage-manifest.md` exits 0.

      End your response with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 01c-check-gap-inventory-shape
    type: check
    bounce_target: 01-baseline-and-inventory
    prompt: |
      You are the reviewer for verification phase 01c.

      Purpose: Every walker/weapon/treasure/generator/effect family, special-slot pair, and event kind appears literally in the gap inventory.

      Verify ALL of the following:
      1. Loop over each `grep -oE '"FAMILY_[A-Z0-9_]+"' tests/parity/coverage_targets.h` token and `grep -F` each in `.plan/parity-present-state.md`.
      2. For the 9 event kinds in `kRequiredEventKinds`, `grep -F` each in `.plan/parity-present-state.md`.
      3. For each `(family, slot)` in `kRequiredSpecials` (`std::pair<std::int32_t, std::uint8_t>`), construct the canonical token `FAMILY_<name>:slot<N>` and `grep -F` each in `.plan/parity-present-state.md`.

      End your response with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 02-mirror-resync
    type: implement
    prompt: |
      You are the implementing engineer for Phase 02 — Make `../openglad-master/tools/parity_scenario_table.h` byte-equal with branch; rebuild master companion.

      Goal: {{ GOAL }}

      Preexisting Inputs (consume in place; do NOT regenerate from scratch):
      - `tests/parity/scenario_table.h` (branch, current).
      - `tests/parity/state_dump.{h,cpp}` (branch).
      - `../openglad-master/tools/parity_scenario_table.h` (possibly stale).
      - `../openglad-master/tools/parity_dump_state.{cpp,h}`.
      - `../openglad-master/build/` directory.
      - `.plan/parity-present-state.md` (from phase 01).
      - `.plan/parity-coverage-manifest.md` (from phase 01).
      - `.plan/master-companion.md`.
      - `scripts/parity/capture_master_golden.sh`.
      - `scripts/parity/validate_schema.py`.

      New Outputs:
      - `../openglad-master/tools/parity_scenario_table.h` byte-equal to branch.
      - `../openglad-master/build/ci-test/parity_dump_master` rebuilt.
      - `.plan/master-companion.md` updated with the new pin (post-commit SHA of `../openglad-master`).
      - `.plan/parity-coverage-manifest.md` `master_companion_sha:` updated to the new SHA.

      Implementation Steps:
      1. Confirm no uncommitted branch state (`git status --porcelain` clean modulo permitted ignores).
      2. `cp -f tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h`.
      3. Build companion: `cmake --build ../openglad-master/build/ci-test --target parity_dump_master` (rerun configure on `../openglad-master/` if necessary).
      4. Companion-side commit:
         - `git -C ../openglad-master add tools/parity_scenario_table.h`
         - `git -C ../openglad-master commit -m "parity-companion: phase 02 — mirror scenario_table.h to <branch-sha>"` where `<branch-sha>` is branch HEAD just prior to this phase's branch commit.
      5. `SHA=$(git -C ../openglad-master rev-parse HEAD)`.
      6. Edit `.plan/master-companion.md` and `.plan/parity-coverage-manifest.md` to use the new SHA.
      7. Branch-side commit (below).

      Git Commit Requirement (BOTH worktrees, MUST run before yielding):

      Companion (in `../openglad-master`):
      ```
      git -C ../openglad-master add tools/parity_scenario_table.h
      git -C ../openglad-master commit -m "parity-companion: phase 02 — mirror scenario_table.h to <branch-sha>"
      ```

      Branch (in `/home/yans/code/openglad`):
      ```
      git add .plan/master-companion.md .plan/parity-coverage-manifest.md
      git commit -m "parity-cov: phase 02 — resync companion mirror"
      ```

  - id: 02a-check-mirror-sha-equal
    type: check
    bounce_target: 02-mirror-resync
    prompt: |
      You are the reviewer for verification phase 02a.

      Purpose: Branch and companion `parity_scenario_table.h` are byte-identical.

      Verify ALL of the following:
      1. `sha1sum tests/parity/scenario_table.h | awk '{print $1}'` equals `sha1sum ../openglad-master/tools/parity_scenario_table.h | awk '{print $1}'`.
      2. `cmp tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h` exits 0.

      End with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 02b-check-companion-binary-fresh
    type: check
    bounce_target: 02-mirror-resync
    prompt: |
      You are the reviewer for verification phase 02b.

      Purpose: Companion binary exists, is executable, and emits schema-valid JSON for a known small scenario.

      Verify ALL of the following:
      1. `test -x ../openglad-master/build/ci-test/parity_dump_master`.
      2. `../openglad-master/build/ci-test/parity_dump_master smoke_empty_scen99 > /tmp/p02-dump.json` exits 0.
      3. `python3 scripts/parity/validate_schema.py /tmp/p02-dump.json` exits 0.

      End with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 02c-check-sha-pin-doc-consistent
    type: check
    bounce_target: 02-mirror-resync
    prompt: |
      You are the reviewer for verification phase 02c.

      Purpose: Documentation pins match the live companion SHA, and the companion commit lists the mirror file.

      Verify ALL of the following:
      1. `SHA=$(git -C ../openglad-master rev-parse HEAD)`.
      2. `grep -F "$SHA" .plan/master-companion.md` exits 0.
      3. `grep -F "master_companion_sha: $SHA" .plan/parity-coverage-manifest.md` exits 0.
      4. `git -C ../openglad-master log -1 --name-status` contains `tools/parity_scenario_table.h`.

      End with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 03-fix-treasure-aliasing
    type: implement
    prompt: |
      You are the implementing engineer for Phase 03 — Producer-side per-Order family resolution; 17th FactKind; treasure cohort and behavioural gates green.

      Goal: {{ GOAL }}

      Preexisting Inputs (consume in place; do NOT regenerate from scratch):
      - `tests/parity/state_dump.{h,cpp}`.
      - `tests/parity/fact_predicate.{h,cpp}`.
      - `tests/parity/scenario_table.h` (with 11 treasure pickup rows currently failing).
      - `tests/parity/test_parity_coverage_gate.cpp` (`behavioural_coverage_gate*`).
      - `tests/parity/scenario_facts_generated.json`.
      - `tests/parity/golden/*.json`.
      - `../openglad-master/tools/parity_scenario_table.h`.
      - `../openglad-master/tools/parity_dump_state.{cpp,h}`.
      - `../openglad-master/build/ci-test/parity_dump_master` (rebuilt in phase 02; will be rebuilt again here).
      - `.plan/parity-harness-design.md`.
      - `scripts/parity/capture_master_golden.sh`.

      New Outputs:
      - Per-Order family resolution in `state_dump.cpp`:
        - Introduce free function `family_symbol_by_order(int32_t order, int32_t family_id)` backed by 5 small static `std::string_view` tables — one per `Order::Living`, `Order::Weapon`, `Order::Treasure`, `Order::Generator`, `Order::Effect`.
        - Rewrite `collect_walkers`, `collect_weapons`, `collect_effects` to call `family_symbol_by_order(static_cast<int32_t>(w->query_order()), static_cast<int32_t>(w->family()))`.
        - DELETE the legacy `family_symbol` free function outright (no thin-wrapper); migrate every other call site in the same commit.
        - Mirror byte-for-byte to `../openglad-master/tools/parity_dump_state.cpp`.
      - New `FactKind::TreasureFamilyOfOrderRemovedFromOblist` appended at the end of the enum. Factory signature `TreasureFamilyOfOrderRemovedFromOblist(int32_t family, int32_t order, std::string label)`. Evaluator walks `dump.walkers[]` and compares each entry's `family` string against the table-resolved symbol for `(family, order)` — predicate satisfied iff no remaining walker matches. Existing `TreasureFamilyRemovedFromOblist(family, label)` factory left intact.
      - Updated `tests/parity/scenario_table.h`: every `treasure_*_pickup_scen99` row's `TreasureFamilyRemovedFromOblist(arg0)` replaced by `TreasureFamilyOfOrderRemovedFromOblist(arg0, kOrderTreasure)`. `kInputsTreasurePickup` and spawn lists unchanged.
      - Updated `tests/parity/test_parity_coverage_gate.cpp`: BOTH `behavioural_coverage_gate_treasures` (cpp:323-334) AND `behavioural_coverage_gate`'s treasure-family branch (cpp:421-424) accept either kind. Introduce free helper `any_treasure_binding(int32_t family_id)` returning true iff any predicate of either kind binds `arg0 == family_id` (with `arg1 == kOrderTreasure` for the new kind). Both gate sites use this helper.
      - `tests/parity/scenario_facts_generated.json` regenerated by the existing tool (not hand-edited).
      - Mirror updates on companion side: `../openglad-master/tools/parity_scenario_table.h`, `tools/parity_dump_state.{cpp,h}` (legacy `family_symbol` deleted there too).
      - New goldens for every treasure row: `tests/parity/golden/treasure_*_pickup_scen99.json` (12 files), captured via `scripts/parity/capture_master_golden.sh <id>` against the resynced + patched companion.
      - Existing goldens regenerated where the new dumper produces a different `walkers[].family` string. Use this loop:
        ```
        mkdir -p /tmp/p03-staging
        for g in tests/parity/golden/*.json; do
            id=$(basename "$g" .json)
            ../openglad-master/build/ci-test/parity_dump_master "$id" > "/tmp/p03-staging/$id.json"
            if ! diff -q "$g" "/tmp/p03-staging/$id.json" > /dev/null; then
                cp "/tmp/p03-staging/$id.json" "$g"
            fi
        done
        ```
      - `.plan/parity-harness-design.md` appended with a short section documenting the new FactKind and per-Order resolution.

      Implementation Notes:
      - Dump JSON schema is unchanged; only `walkers[].family` string content changes for non-Living oblist entries.
      - New enum value is appended (not inserted) so serialised ordinals never shift.
      - Rebuild companion `parity_dump_master` after mirror updates.

      Git Commit Requirement (BOTH worktrees, MUST run before yielding):

      Companion:
      ```
      git -C ../openglad-master add tools/parity_scenario_table.h \
                                     tools/parity_dump_state.cpp \
                                     tools/parity_dump_state.h
      git -C ../openglad-master commit -m "parity-companion: phase 03 — mirror per-Order family resolution"
      ```

      Branch:
      ```
      git add tests/parity/state_dump.cpp \
              tests/parity/fact_predicate.h \
              tests/parity/fact_predicate.cpp \
              tests/parity/scenario_table.h \
              tests/parity/test_parity_coverage_gate.cpp \
              tests/parity/scenario_facts_generated.json \
              tests/parity/golden/ \
              .plan/parity-harness-design.md
      git commit -m "parity-cov: phase 03 — per-Order family resolution and TreasureFamilyOfOrderRemovedFromOblist"
      ```

  - id: 03a-check-build-and-treasure-green
    type: check
    bounce_target: 03-fix-treasure-aliasing
    prompt: |
      You are the reviewer for verification phase 03a.

      Purpose: Build succeeds; treasure cohort and both behavioural gates pass with no skips.

      Run and verify:
      1. `cmake --build --preset ci-test --target og_test_parity` exits 0.
      2. `build/ci-test/og_test_parity --gtest_filter='Parity.treasure_*_pickup_scen99:Parity.behavioural_coverage_gate*' 2>&1 | tee /tmp/p03a.out`.
      3. `grep -cE '^\[  FAILED  \]' /tmp/p03a.out` equals `0`.
      4. `grep -cE '^\[  SKIPPED \]' /tmp/p03a.out` equals `0`.

      End with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 03b-check-schema-and-mirror-equal
    type: check
    bounce_target: 03-fix-treasure-aliasing
    prompt: |
      You are the reviewer for verification phase 03b.

      Purpose: Mirror byte-equal; schema unchanged; legacy `family_symbol` gone on branch and companion; companion binary fresh.

      Verify ALL of the following:
      1. `cmp tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h` exits 0.
      2. Extract every JSON top-level key from `tests/parity/golden/smoke_nonempty_scen99.json` and confirm the set matches the frozen schema-v1 list declared in `.plan/parity-harness-design.md`.
      3. `git -C ../openglad-master log -1 --name-status` lists `tools/parity_scenario_table.h`, `tools/parity_dump_state.cpp`, AND `tools/parity_dump_state.h`.
      4. Re-run `cmake --build ../openglad-master/build/ci-test --target parity_dump_master` (idempotent; exits 0).
      5. `test ../openglad-master/build/ci-test/parity_dump_master -nt ../openglad-master/tools/parity_dump_state.cpp` exits 0.
      6. `test ../openglad-master/build/ci-test/parity_dump_master -nt ../openglad-master/tools/parity_dump_state.h` exits 0.
      7. `grep -c '^std::string family_symbol(' tests/parity/state_dump.cpp` equals `0`.
      8. `grep -c '^std::string family_symbol(' ../openglad-master/tools/parity_dump_state.cpp` equals `0`.
      9. `python3 -c "import re,sys; src=open('tests/parity/state_dump.cpp').read(); bad=re.findall(r'\\bfamily_symbol\\s*\\((?!_by_order)', src); sys.exit(1 if bad else 0)"` exits 0.
      10. Same regex check against `../openglad-master/tools/parity_dump_state.cpp` exits 0.

      End with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 03c-check-no-new-non-treasure-regressions
    type: check
    bounce_target: 03-fix-treasure-aliasing
    prompt: |
      You are the reviewer for verification phase 03c.

      Purpose: No prior-passing tests now fail; phase closes exactly the treasure + gate failures and no others.

      Run and verify:
      1. `build/ci-test/og_test_parity --gtest_brief=1 2>&1 | tee /tmp/p03c.out`.
      2. `FAILED=$(grep -cE '^\[  FAILED  \] Parity\.' /tmp/p03c.out)`.
      3. Re-derive the prior failing set from `.plan/parity-present-state.md` (bulleted `Parity.<id>` lines under "Failing tests") and the closing set `{Parity.treasure_*_pickup_scen99, Parity.behavioural_coverage_gate, Parity.behavioural_coverage_gate_treasures}`. Assert (a) every prior failing id NOT in the closing set still appears in `/tmp/p03c.out`'s `[  FAILED  ]` lines (no regression), AND (b) every id in the closing set is NOT in `/tmp/p03c.out`'s `[  FAILED  ]` lines (closed by this phase).
      4. `grep -cE '^\[  FAILED  \] Parity\.treasure_' /tmp/p03c.out` equals `0`.
      5. `grep -cE '^\[  FAILED  \] Parity\.behavioural_coverage_gate' /tmp/p03c.out` equals `0`.

      End with exactly one verdict line:
      - `VERDICT: PASS` if all checks succeed.
      - `VERDICT: FAIL: <reason>` otherwise.

  - id: 04-mass-golden-recapture
    type: implement
    prompt: |
      You are the implementing engineer for Phase 04 — Capture every missing master golden; refresh existing ones under the resynced companion.

      Goal: {{ GOAL }}

      Preexisting Inputs (consume in place; do NOT regenerate from scratch):
      - `scripts/parity/capture_master_golden.sh` (extended in this phase).
      - `tests/parity/scenario_table.h` (final treasure-fixed version from phase 03).
      - `../openglad-master/build/ci-test/parity_dump_master` (rebuilt in phase 03 with mirror patch).
      - `tests/parity/golden/*.json` (39+ existing).
      - `scripts/parity/validate_schema.py`.
      - `scripts/parity/check_coverage_manifest.py` (with `--emit-scenario-list` added in phase 01).

      New Outputs:
      - `scripts/parity/capture_master_golden.sh` accepts:
        - `--all` (iterate every `SemanticParity` row in `kScenarios` whose `is_branch_internal == false`).
        - `--out-dir <path>` (default `tests/parity/golden`).
        - `--no-write --diff` (emit JSON to tmp dir and `diff -ru tests/parity/golden tmpdir` instead of overwriting; used by verifier).
      - Up to 93 new + replacement golden files under `tests/parity/golden/` so every `SemanticParity` master-comparable row has a fresh golden.
      - `.plan/parity-recapture-diff.md` listing every file added/replaced, one line per change formatted `<+|M> <sha1-prefix> <id>.json`.
      - `tests/parity/scenario_facts_generated.json` regenerated.

      Implementation Steps:
      1. Implement `--all` by reading `kScenarios` from `tests/parity/scenario_table.h` via companion enumeration (pass each `id` to `parity_dump_master`; write `<out-dir>/<id>.json` if `compare_mode == SemanticParity && is_branch_internal == false`). Reuse existing invocation pattern; do not rewrite the companion binary.
      2. Run `scripts/parity/capture_master_golden.sh --all`.
      3. Regenerate `tests/parity/scenario_facts_generated.json` via the existing tool.
      4. After bulk capture, run `git status tests/parity/golden/ | wc -l` and write the count plus per-file change list into `.plan/parity-recapture-diff.md`.

      Git Commit Requirement (branch-only, MUST run before yielding):
      ```
      git add scripts/parity/capture_master_golden.sh \
              tests/parity/golden/ \
              tests/parity/scenario_facts_generated.json \
              .plan/parity-recapture-diff.md
      git commit -m "parity-cov: phase 04 — mass golden recapture (N goldens)"
      ```
      No companion-side commit this phase.

  - id: 04a-check-zero-skipped-and-pass-grows
    type: check
    bounce_target: 04-mass-golden-recapture
    prompt: |
      You are the reviewer for verification phase 04a.

      Purpose: No more skipped parity tests; total passed equals prior P + F + S (no rows silently dropped).

      Run and verify:
