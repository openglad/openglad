vars:
  GOAL: |
    The last bunch of commits implemented a gameplay parity comparison framework
    against master but failed to fix divergences. The responsible agent has been
    killed. Avoid its fate. Use gameplay parity comparison against master in a
    wide variety of scenarios, ensuring that cumulative coverage includes every
    single entity type, special ability effect, attack type, and occurrence in
    the game. Everything must be tested with no exceptions. Continue iterating
    until everything is fully tested, with copious checking in place to ensure
    agents don't cut corners. The reality of RNG differences will mean that
    things might not be byte-identical, but they should be checked for
    verifiable certainty that they are semantically equivalent.

phases:
  - id: 01-honest-audit
    type: implement
    prompt: |
      # Phase 01 — Honest audit and stale-artefact rename

      ## Goal context

      {{ GOAL }}

      You are the implementer for Phase 01 of the parity-finish-2 plan.
      Produce a present-day honest audit of the parity harness and rename the
      stale empty-world divergence/fixes reports so their history is preserved.
      No source code is modified in this phase.

      ## Preexisting Inputs (DO NOT regenerate; consume in place)

      - `.plan/goal.md`
      - `.plan/parity-risk-inventory.md`
      - `.plan/parity-harness-design.md`
      - `.plan/parity-coverage-manifest.md`
      - `.plan/parity-divergence-report.md` (stale empty-world era)
      - `.plan/parity-fixes.md` (stale empty-world era)
      - `.plan/parity-signoff-fraudulent.md`
      - `.plan/master-companion.md`
      - `tests/parity/scenario_table.h`
      - `tests/parity/golden/*.json` (39 files)
      - `tests/parity/test_parity_scenarios.cpp`
      - `tests/parity/test_parity_coverage_gate.cpp`
      - `tests/parity/fact_predicate.h`
      - `scripts/parity/lint_scenario_facts.py`
      - `scripts/parity/run_mutation_canary.sh`

      Read these files. Do not re-derive their contents from scratch.

      ## New Outputs to produce

      - `.plan/parity-honest-audit.md` — authoritative present-day audit with
        sections (a)–(g):
        - (a) **Current test surface**: every `Parity.*` test name and current
          pass/fail from `build/ci-test/og_test_parity --gtest_list_tests` and
          `build/ci-test/og_test_parity --gtest_brief=1`. Today: 50 pass / 0 fail.
        - (b) **Widened-predicate inventory**: per scenario, every
          `FactPredicate` where `(min, max)` exceeds exact-value semantics
          (`mn != mx` for counts, `max - min > 200` for HP). Cite line
          numbers in `tests/parity/scenario_table.h`. Tag each row
          `widening_justification: present | absent` (an `(a)` inline comment
          counts as present; otherwise absent → Phase 3 work item). Include
          a literal line of the form `Widened predicates: <N>` matching the
          live count exactly (the verifier byte-compares this integer).
        - (c) **Structural-only coverage entries**: every `(FAMILY_*, order)`
          pair only reachable via `kFamilySpawns_golem_with_nonliving_targets`,
          not referenced by any `expected_facts[]` predicate's `arg0`.
        - (d) **Master-companion SHA reconciliation**: list both current SHAs
          (`c9f18a7b...` in manifest frontmatter, `ce70d2328...` in
          `.plan/master-companion.md`); name the reconciliation target
          (`git -C ../openglad-master rev-parse HEAD`); state that Phase 5
          re-captures every golden from that SHA.
        - (e) **Stale-document rename log**: list both renamed files and the
          reason (empty-world era preserved for history; not deleted).
        - (f) **Coverage-gap inventory by axis**:
          - Walker families with no behavioural predicate beyond
            `WalkerFamilyCount(family, 0, 0)`. Per family list first missing
            behavioural axis (HP, position, event, damage).
          - Weapon families in `kRequiredWeaponFamilies` with no
            `WeaponFamilyEmitted(arg0=family)` predicate.
          - Treasure families in `kRequiredTreasureFamilies` with no
            `TreasureFamilyRemovedFromOblist` or `StatDeltaOnPickup` predicate.
          - Effect families in `kRequiredEffectFamilies` with no
            `EffectFamilyCount(arg0=family)` predicate.
          - Specials in `kRequiredSpecials` only claimed by `Exercises::Special_*`.
          - Event kinds in `kRequiredEventKinds` not appearing in any
            `EventKindAtLeast` / `EventKindExactly` predicate.
        - (g) **Mutation-canary delta**: every row whose
          `discriminating_mutation` doc admits "the parity runner does not
          invoke the subject" (today `save_roundtrip_scen99`,
          `rng_seed_stable_scen99`).
        Use at least 25 markdown table rows total (the verifier counts
        `^| ` lines and requires ≥ 25).
      - `.plan/parity-divergence-report-empty-world.md` — produced by
        `git mv .plan/parity-divergence-report.md .plan/parity-divergence-report-empty-world.md`
      - `.plan/parity-fixes-empty-world.md` — produced by
        `git mv .plan/parity-fixes.md .plan/parity-fixes-empty-world.md`

      ## Commands to run

      Populate the audit from live output of these commands; cite real
      stdout, do not invent numbers.

      ```
      cmake --build --preset ci-test --target og_test_parity
      build/ci-test/og_test_parity --gtest_list_tests > /tmp/parity_tests.txt
      build/ci-test/og_test_parity --gtest_brief=1     > /tmp/parity_run.txt
      python3 -  <<'PY' > /tmp/widened.txt
      import re, pathlib
      text = pathlib.Path('tests/parity/scenario_table.h').read_text()
      # Enumerate every WalkerFamilyCount, WalkerOfTeamAlive, WalkerHpRangeAtFinalTick
      # and report cases where mn != mx (or hp range > 200 cents).
      # Print line:scenario:predicate for each.
      PY
      git -C ../openglad-master rev-parse HEAD > /tmp/companion_sha.txt
      sha1sum tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h
      ```

      ## File changes

      - `git mv .plan/parity-divergence-report.md .plan/parity-divergence-report-empty-world.md`
      - `git mv .plan/parity-fixes.md .plan/parity-fixes-empty-world.md`
      - Create `.plan/parity-honest-audit.md`.

      ## Git commit requirement (MUST happen before yielding)

      `git add` the renamed files and the new audit doc and `git commit` with
      message:

      `parity-finish-2: phase 01 — honest audit; rename empty-world reports`

      The next check phase asserts HEAD contains those file changes via
      `git log -1 --name-status`.

  - id: 01a-check-audit-content
    type: check
    bounce_target: 01-honest-audit
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 01's audit content. Confirm the rename
      happened, the new audit exists, and the widened-predicate count in the
      audit byte-equals the live count.

      ## Preexisting Inputs (already produced by Phase 01)

      - `.plan/parity-honest-audit.md`
      - `.plan/parity-divergence-report-empty-world.md`
      - `.plan/parity-fixes-empty-world.md`
      - `tests/parity/scenario_table.h`

      Read existing artefacts; do not regenerate them.

      ## Things to verify (run these exact commands)

      - `test -f .plan/parity-honest-audit.md`
      - `test -f .plan/parity-divergence-report-empty-world.md`
      - `test -f .plan/parity-fixes-empty-world.md`
      - `test ! -f .plan/parity-divergence-report.md`
      - `test ! -f .plan/parity-fixes.md`
      - Count widened predicates with:
        ```
        python3 - <<'PY'
        import re, pathlib
        text = pathlib.Path('tests/parity/scenario_table.h').read_text()
        # Count every WalkerFamilyCount(..., mn, mx) with mn != mx,
        # every WalkerOfTeamAlive(..., mn, mx) with mn != mx,
        # every WalkerHpRangeAtFinalTick(..., mn, mx) with mx - mn > 200.
        # Print WIDENED_COUNT=<N>.
        PY
        ```
        Then extract `^Widened predicates: <N>$` from
        `.plan/parity-honest-audit.md`. The two integers MUST be equal —
        `diff` them.
      - `grep -c '^| ' .plan/parity-honest-audit.md` returns ≥ 25.
      - `git log -1 --name-status` lists both renames and the new audit doc.

      ## Verdict

      End your response with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 01b-check-history-preserved
    type: check
    bounce_target: 01-honest-audit
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 01's git-history preservation. Prove
      `git mv` was used (history follows) for both renamed documents.

      ## Preexisting Inputs

      - `.plan/parity-divergence-report-empty-world.md`
      - `.plan/parity-fixes-empty-world.md`

      ## Things to verify (run these exact commands)

      - `git log --follow --oneline .plan/parity-divergence-report-empty-world.md | wc -l` returns ≥ 2.
      - `git log --follow --oneline .plan/parity-fixes-empty-world.md | wc -l` returns ≥ 2.
      - `git log -1 --diff-filter=R --name-status HEAD` output matches both:
        - regex `R[0-9]+\s+\.plan/parity-divergence-report\.md`
        - regex `R[0-9]+\s+\.plan/parity-fixes\.md`

      ## Verdict

      End your response with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 02-companion-revalidation
    type: implement
    prompt: |
      # Phase 02 — Master companion re-validation and SHA pinning

      ## Goal context

      {{ GOAL }}

      You are the implementer for Phase 02 of parity-finish-2. Rebuild the
      master companion at a fresh SHA, pin that SHA in docs, and produce a
      recapture-vs-existing diff log across all 39 goldens. Goldens are NOT
      modified in this phase — Phase 5 replaces them. This phase emits only
      the diff log plus the SHA-pinning doc updates.

      ## Preexisting Inputs (consume in place; do not regenerate)

      - `.plan/parity-honest-audit.md` (from Phase 1)
      - `.plan/parity-coverage-manifest.md` (frontmatter SHA to reconcile)
      - `.plan/master-companion.md` (SHA reference to reconcile)
      - `tests/parity/scenario_table.h`
      - `tests/parity/golden/*.json` (39 files; not deleted)
      - `../openglad-master/tools/parity_scenario_table.h`
      - `../openglad-master/tools/parity_dump_master.cpp`
      - `../openglad-master/tools/parity_dump_state.h`
      - `../openglad-master/tools/parity_dump_state.cpp`
      - `../openglad-master/tools/parity_bootstrap.h`
      - `../openglad-master/tools/parity_bootstrap.cpp`
      - `scripts/parity/capture_master_golden.sh`
      - `scripts/parity/validate_schema.py`
      - `scripts/parity/diff_dumps.py`

      ## New Outputs

      - `.plan/parity-recapture-diff.md` — per-golden recapture result.
        Required sections:
        - **Header**: pinned companion SHA (current HEAD of
          `parity-companion`), branch HEAD SHA, branch-side
          `tests/parity/scenario_table.h` SHA-1, companion-side
          `tools/parity_scenario_table.h` SHA-1. The two table SHA-1s MUST
          be equal.
        - **Per-golden recapture diff** table — one row per master-comparable
          scenario (38 rows). Columns:
          `scenario_id | bytes_before | bytes_after | result (byte-equal/diff) | notes`.
          Rows where `result == diff` include a one-line summary of which
          fields changed (RNG state, events count, walker count).
        - **Outcome summary**: count of byte-equal vs diff vs schema-invalid
          rows.
      - Update `.plan/parity-coverage-manifest.md` frontmatter
        `master_companion_sha:` to actual companion HEAD
        (`git -C ../openglad-master rev-parse HEAD`).
      - Update `.plan/master-companion.md` — refresh SHA tables and the
        "Drift-detection SHA-1s" section to current values.
      - If `tests/parity/scenario_table.h` SHA differs from the companion
        mirror, copy branch → master and commit on master. This is the ONLY
        write under `tests/parity/` Phase 2 may perform.

      ## Commands to run

      ```
      cd /home/yans/code/openglad-master
      git checkout parity-companion
      cmake --preset ci-test
      cmake --build --preset ci-test --target parity_dump_master
      COMPANION_SHA=$(git rev-parse HEAD)
      cd /home/yans/code/openglad
      mkdir -p /tmp/recapture
      for id in $(../openglad-master/build/ci-test/parity_dump_master --list); do
          ../openglad-master/build/ci-test/parity_dump_master \
              --scenario "$id" --out "/tmp/recapture/$id.json"
          python3 scripts/parity/validate_schema.py "/tmp/recapture/$id.json"
      done
      for f in tests/parity/golden/*.json; do
          id=$(basename "$f" .json)
          if [ -f "/tmp/recapture/$id.json" ]; then
              if cmp -s "$f" "/tmp/recapture/$id.json"; then
                  echo "$id byte-equal"
              else
                  echo "$id diff:"
                  diff <(python3 -m json.tool "$f") <(python3 -m json.tool "/tmp/recapture/$id.json") | head
              fi
          fi
      done
      ```

      The two table SHA-1s on branch/companion sides MUST match before
      recapture starts. If they do not, first mirror the branch table to the
      companion with
      `cp tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h`
      and commit on the master worktree (`parity-companion` branch) with
      message
      `parity-companion: phase 02 — mirror scenario_table.h SHA-1 from branch <hash>`.

      ## Git commit requirement (MUST happen before yielding)

      Two-worktree phase.

      - Branch worktree: `git add` the modified docs
        (`.plan/parity-coverage-manifest.md`, `.plan/master-companion.md`,
        `.plan/parity-recapture-diff.md`) and `git commit` with message
        `parity-finish-2: phase 02 — companion revalidation; pinned SHA <hash>; <N> goldens diverge from recapture`.
        The commit message MUST contain the literal current companion SHA.
      - Master worktree (only if the companion mirror was updated):
        `git -C ../openglad-master add tools/parity_scenario_table.h` and
        `git -C ../openglad-master commit -m "parity-companion: phase 02 — mirror scenario_table.h SHA-1 from branch <hash>"`.

  - id: 02a-check-companion-build
    type: check
    bounce_target: 02-companion-revalidation
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 02's companion build. Verify the
      companion build artefact exists and that the branch/companion
      `scenario_table.h` SHA-1s match.

      ## Preexisting Inputs

      - `../openglad-master/build/ci-test/parity_dump_master`
      - `tests/parity/scenario_table.h`
      - `../openglad-master/tools/parity_scenario_table.h`

      ## Things to verify (run these exact commands)

      - `cd ../openglad-master && cmake --build --preset ci-test --target parity_dump_master`
        exits 0.
      - `test -x ../openglad-master/build/ci-test/parity_dump_master`.
      - `sha1sum tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h`
        — both SHA-1s MUST match.

      ## Verdict

      End with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 02b-check-companion-list-matches
    type: check
    bounce_target: 02-companion-revalidation
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 02's companion scenario set. Ensure the
      companion exposes every non-internal scenario id from the branch.

      ## Preexisting Inputs

      - `../openglad-master/build/ci-test/parity_dump_master`
      - `tests/parity/scenario_table.h`

      ## Things to verify (run these exact commands)

      - `../openglad-master/build/ci-test/parity_dump_master --list > /tmp/cmaster_ids.txt`
      - Run:
        ```
        python3 - <<'PY'
        # Parse tests/parity/scenario_table.h and extract every kScenarios[].id
        # where is_branch_internal == false. Print one id per line.
        PY
        ```
      - Diff the two sets (ordering free). They MUST be equal.

      ## Verdict

      End with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 02c-check-recapture-diff-log
    type: check
    bounce_target: 02-companion-revalidation
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 02's recapture diff log. Assert it is
      non-trivial and the commit message embeds the pinned companion SHA.

      ## Preexisting Inputs

      - `.plan/parity-recapture-diff.md`
      - `.plan/parity-coverage-manifest.md`

      ## Things to verify (run these exact commands)

      - `test -f .plan/parity-recapture-diff.md`.
      - `grep -q '^## Per-golden recapture diff' .plan/parity-recapture-diff.md`.
      - Row count equals `kMasterComparableScenarioCount` (currently 38).
      - `grep -c '^| ' .plan/parity-recapture-diff.md` returns ≥ 38.
      - `grep -E '^\| [a-z_0-9]+_scen[0-9]+ +\| (byte-equal|diff)' .plan/parity-recapture-diff.md | wc -l`
        equals the row count.
      - Phase 2 commit message contains the current companion SHA:
        `git log -1 --pretty=%B` matches the value of
        `git -C ../openglad-master rev-parse HEAD`.
      - `grep -q "master_companion_sha: $(git -C ../openglad-master rev-parse HEAD)" .plan/parity-coverage-manifest.md`.

      ## Verdict

      End with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 03-tighten-predicates
    type: implement
    prompt: |
      # Phase 03 — Tighten widened predicates and add the "no-widening" lint

      ## Goal context

      {{ GOAL }}

      You are the implementer for Phase 03 of parity-finish-2. Strengthen the
      predicate surface in `tests/parity/scenario_table.h` and add a lint rule
      that refuses unjustified range widening.

      ## Preexisting Inputs (consume in place; do not regenerate)

      - `.plan/parity-honest-audit.md` (widened-predicate inventory drives the work list)
      - `.plan/parity-recapture-diff.md` (if a golden was replaced, predicate must match new golden)
      - `tests/parity/scenario_table.h`
      - `tests/parity/fact_predicate.h`
      - `tests/parity/fact_predicate.cpp`
      - `scripts/parity/lint_scenario_facts.py`

      Use the Phase 01 audit's widened-predicate inventory as the work list.

      ## New Outputs

      - Updated `tests/parity/scenario_table.h`:
        - Every `WalkerFamilyCount(family, mn, mx)` with `mn != mx` is either:
          (a) narrowed to `(mx, mx)` or `(mn, mn)` if recapture confirms
              master value is stable;
          (b) replaced by `EffectFamilyCount`, `WalkerDiedByFinal`, or
              `WeaponFamilyEmitted` capturing the actual behavioural diff
              with exact count; or
          (c) accompanied by an inline
              `// intended_diff: <reason>; cited commit <sha>` comment
              recognised by the new lint rule, with a corresponding entry in
              `.plan/parity-honest-audit.md` "Reclassified rows" section.
        - Same treatment for `WalkerOfTeamAlive(team, mn, mx)` widened ranges.
        - `WalkerHpRangeAtFinalTick` ranges wider than 200 cents either narrow
          to ≤ 200 OR cite `// rng_drift: <reason>` linked to a new
          `intended_diff` row.
      - Updated `scripts/parity/lint_scenario_facts.py` with an
        `unjustified_widening` rule that walks `kFacts_<id>[]`, identifies
        widened predicates, and requires per-predicate justification. Reuse
        the existing C++ table parser.
      - Updated `.plan/parity-honest-audit.md` — append a "Reclassified rows"
        subsection listing every narrowed / widened-with-citation / deleted
        row in a markdown table with columns
        `scenario_id | predicate | before | after | citation`.

      Lint rule grammar: an `intended_diff` citation is an inline C++
      comment matching `// intended_diff: .{20,}; commit [0-9a-f]{7,40}`
      placed immediately after the predicate in `kFacts_<id>[]`. An
      `rng_drift` citation has the same shape with the leading keyword
      `rng_drift`.

      ## Commands to run during work

      - Re-run `build/ci-test/og_test_parity` after each tightening. Revert
        to the `intended_diff` citation path (with an audit doc entry) if a
        row regresses.

      ## Git commit requirement (MUST happen before yielding)

      `git add` the modified `tests/parity/scenario_table.h`,
      `scripts/parity/lint_scenario_facts.py`, and
      `.plan/parity-honest-audit.md`, then `git commit` with message:

      `parity-finish-2: phase 03 — tighten predicates and add no-unjustified-widening lint`

      The next check phase asserts HEAD contains those file changes.

  - id: 03a-check-lint-passes
    type: check
    bounce_target: 03-tighten-predicates
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 03's lint rule. Confirm the new
      `unjustified_widening` lint rule is wired and trips on tampered input.

      ## Preexisting Inputs

      - `tests/parity/scenario_table.h`
      - `scripts/parity/lint_scenario_facts.py`

      ## Things to verify (run these exact commands)

      - `python3 scripts/parity/lint_scenario_facts.py tests/parity/scenario_table.h`
        exits 0 with no diagnostics.
      - Construct a tampered copy:
        `sed -E 's/WalkerFamilyCount\(([^,]+),\s*([0-9]+),\s*\2/WalkerFamilyCount(\1, \2, 99/' tests/parity/scenario_table.h > /tmp/tampered.h`
      - `LINT_SCENARIO_TABLE=/tmp/tampered.h python3 scripts/parity/lint_scenario_facts.py`
        MUST exit non-zero with an `unjustified_widening` diagnostic.

      ## Verdict

      End with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 03b-check-tests-still-green
    type: check
    bounce_target: 03-tighten-predicates
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 03's regression safety. Ensure
      predicate tightening did not regress any parity test.

      ## Preexisting Inputs

      - `tests/parity/scenario_table.h`
      - `tests/parity/golden/*.json`

      ## Things to verify (run these exact commands)

      - `cmake --build --preset ci-test --target og_test_parity` exits 0.
      - `build/ci-test/og_test_parity` — every `Parity.*` case still passes.

      ## Verdict

      End with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 03c-check-widening-justified
    type: check
    bounce_target: 03-tighten-predicates
    prompt: |
      # Reviewer role

      You are the reviewer for Phase 03's widening justifications. Assert
      every remaining widened predicate has a paired justification.

      ## Preexisting Inputs

      - `tests/parity/scenario_table.h`
      - `scripts/parity/lint_scenario_facts.py`
      - `.plan/parity-honest-audit.md`

      ## Things to verify (run these exact commands)

      - Run:
        ```
        python3 - <<'PY'
        # Scan tests/parity/scenario_table.h for every widened predicate.
        # Assert either:
        #   (i) the line is followed (within 3 lines) by an inline comment
        #       matching // .*(branch|master|widen|intended_diff|parity-fix|rng_drift)
        #  OR (ii) the row's discriminating_mutation rationale references
        #       the same FactKind.
        # Print offending (scenario_id, line, predicate) and exit non-zero
        # on failure.
        PY
        ```
      - `python3 scripts/parity/lint_scenario_facts.py tests/parity/scenario_table.h`
        exits 0 (the new rule is wired and currently passes).

      ## Verdict

      End with EXACTLY one of:

      - `VERDICT: PASS`
      - `VERDICT: FAIL: <reason>`

  - id: 04-behavioural-coverage
    type: implement
    prompt: |
      # Phase 04 — Behavioural coverage scenarios

      ## Goal context

      {{ GOAL }}

      You are the implementer for Phase 04 of parity-finish-2. Replace
      blob-spawn structural coverage with per-entity behavioural scenarios
      that bind every required weapon family, treasure family, effect family,
      generator family, event kind, and special slot to at least one
      `expected_facts[]` predicate.

      ## Preexisting Inputs (consume in place; do not regenerate)

      - `.plan/parity-honest-audit.md` (coverage-gap inventory in §(f))
      - `.plan/parity-coverage-manifest.md`
      - `tests/parity/coverage_targets.h`
      - `tests/parity/scenario_table.h`
      - `tests/parity/parity_runner.cpp` (extend only if a new input pattern is required)
      - `tests/parity/scenario_runtime.cpp` (per-spawn `stats_level`/`magicpoints` already supported)
      - `tests/parity/fact_predicate.h`
      - `tests/parity/fact_predicate.cpp` (no new predicate kinds; existing 16 suffice)
      - `tests/parity/test_parity_coverage_gate.cpp`
