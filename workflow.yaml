  - id: 06c-check-no-widening-without-citation
    type: check
    bounce_target: 06-specials-and-events-coverage
    prompt: |
      You are the verifier for Phase 06 — `06c-check-no-widening-without-citation`.

      Confirm lint passes and every widened `WalkerHpRangeAtFinalTick` carries
      an `intended_diff` / `rng_drift` citation within 3 lines.

      Run:

      ```
      python3 scripts/parity/lint_scenario_facts.py tests/parity/scenario_table.h
      python3 - <<'PY'
      from pathlib import Path
      import re
      src = Path('tests/parity/scenario_table.h').read_text().splitlines()
      bad = []
      for i, line in enumerate(src):
          m = re.search(r'WalkerHpRangeAtFinalTick\(\s*[A-Za-z0-9_]+\s*,\s*(-?\d+)\s*,\s*(-?\d+)', line)
          if not m: continue
          mn, mx = int(m.group(1)), int(m.group(2))
          if mx - mn == 0: continue
          window = '\n'.join(src[i:i+4])
          if 'intended_diff' not in window and 'rng_drift' not in window:
              bad.append((i+1, line.strip()))
      assert not bad, bad
      PY
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

