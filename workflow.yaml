vars:
  GOAL: "Drive the parity harness to honest, zero-skip / zero-fail end-to-end coverage."

phases:
  - id: 01-triage-and-resync
    type: implement
    prompt: |
      You are the implement agent for Phase 01 — Triage and resync uncommitted state.

      ## Goal
      Commit the current WIP edits to the parity harness as-is, then snapshot a
      present-day failure inventory pinned to the current `../openglad-master`
      companion HEAD. This phase does not change behaviour; it just captures the
      starting line for the rest of the workflow.

      ## Preexisting Inputs (consume; do not regenerate)
      - `.plan/goal.md`
      - `.plan/parity-honest-audit.md`
      - `.plan/parity-coverage-manifest.md`
      - `.plan/master-companion.md`
      - `tests/parity/scenario_table.h` (with uncommitted edits)
      - `tests/parity/scenario_facts_generated.json` (uncommitted)
      - `tests/parity/test_parity_scenarios.cpp` (uncommitted rename)
      - `tests/parity/golden/*.json` (39 existing files)
      - `../openglad-master/` worktree on `parity-companion`

      These artifacts already exist. Read them; do not refetch, recollect, or
      rebuild them from scratch.

      ## New Outputs
      - `.plan/parity-present-state.md` (≤200 lines) with sections:
        - **Test count snapshot** — three lines: `Passed: <P>`, `Skipped: <S>`,
          `Failing tests: <F>`. Also `Skipped scenarios after this phase: <S>`.
        - **Failing tests** — bulleted list, one per `[  FAILED  ]` line.
        - **Skipped tests** — bulleted list of every `master golden missing for ...`
          skip cited verbatim.
        - **Master companion SHA (pinned this phase)** — one line
          `Master companion SHA: <sha>`.
        - **Mirror SHA delta** — literal `sha1sum` output for
          `tests/parity/scenario_table.h` and
          `../openglad-master/tools/parity_scenario_table.h`. If unequal, line
          `BRANCH ≠ COMPANION — Phase 02 resyncs.`
        - **Phase plan acknowledgement** — quote verbatim the broken-state
          authorisation section of the plan; state explicitly that the user's
          verbatim goal is the override for the global "all tests pass" rule for
          the Phase 1–6 window only; treasure cohort + behavioural gates green at
          end of Phase 4 (verifier 04a); full `og_test_parity` zero FAIL zero
          SKIP at end of Phase 6 (verifier 06a); entire repository test suite
          green at end of Phase 8 (verifier 08b). Deferred weapon / effect /
          generator / event / special cohorts authorised to remain red across
          Phases 3, 4, 5 and only close in Phase 6.
      - One commit staging the uncommitted WIP plus the new doc.

      ## Implementation Details
      The uncommitted edits rewrite every treasure pickup row to put a soldier at
      `(96, 120)` plus a treasure of the target family at `(160, 120)` plus
      `kInputsTreasurePickup`. They are required by Phase 04's bring-up but
      currently cause ~12 test failures due to family-id walker/treasure
      aliasing. Phase 1's job is to commit what's there, not fix it.

      Derive PASS / SKIP / FAIL counts from a clean build:

      ```
      cmake --build --preset ci-test --target og_test_parity
      build/ci-test/og_test_parity --gtest_brief=1 2>&1 | tee /tmp/p01.out
      PASSED=$(grep -oE '^\[  PASSED  \] [0-9]+ tests?\.' /tmp/p01.out | awk '{print $3}' | head -1)
      SKIPPED=$(grep -oE '^\[  SKIPPED \] [0-9]+ tests?\.' /tmp/p01.out | awk '{print $3}' | head -1)
      FAILED=$(grep -cE '^\[  FAILED  \] Parity\.' /tmp/p01.out)
      ```

      `og_test_parity --gtest_brief=1` does NOT emit a `[  FAILED  ] N tests.`
      summary line — only PASSED + SKIPPED summaries appear; FAILED is counted
      from per-test `[  FAILED  ] Parity.<id>` lines.

      ## Git Commit Requirement (mandatory before yielding)
      Stage the uncommitted WIP files plus the new doc and commit:

      ```
      git add tests/parity/scenario_table.h \
              tests/parity/scenario_facts_generated.json \
              tests/parity/test_parity_scenarios.cpp \
              .plan/parity-present-state.md
      git commit -m "parity-finish-3: phase 01 — commit treasure-row WIP and snapshot present-day failures"
      ```

      Do NOT yield with a dirty working tree (except `.plan/.juvenal-state.json`,
      which is ignored by verifier 01a's grep filter).

  - id: 01a-check-tree-clean-and-inventory
    type: check
    bounce_target: 01-triage-and-resync
    prompt: |
      You are the verifier for Phase 01 — `01a-check-tree-clean-and-inventory`.

      Confirm the WIP commit landed, `.plan/parity-present-state.md` exists with
      the right integers derived from a fresh `og_test_parity --gtest_brief=1`
      run, and `git log -1` lists the expected files.

      Run these commands and inspect their output:

      ```
      git status --porcelain | grep -v '^?? .plan/.juvenal-state.json$' | wc -l    # expect 0
      test -f .plan/parity-present-state.md
      cmake --build --preset ci-test --target og_test_parity 2>&1 | tail -5
      build/ci-test/og_test_parity --gtest_brief=1 2>&1 | tee /tmp/p01.out | tail -3
      PASSED=$(grep -oE '^\[  PASSED  \] [0-9]+ tests?\.' /tmp/p01.out | awk '{print $3}' | head -1)
      SKIPPED=$(grep -oE '^\[  SKIPPED \] [0-9]+ tests?\.' /tmp/p01.out | awk '{print $3}' | head -1)
      FAILED=$(grep -cE '^\[  FAILED  \] Parity\.' /tmp/p01.out)
      grep -F "Passed: ${PASSED}"          .plan/parity-present-state.md
      grep -F "Skipped: ${SKIPPED}"        .plan/parity-present-state.md
      grep -F "Failing tests: ${FAILED}"   .plan/parity-present-state.md
      git log -1 --name-status | grep -F tests/parity/scenario_table.h
      git log -1 --name-status | grep -F tests/parity/scenario_facts_generated.json
      git log -1 --name-status | grep -F tests/parity/test_parity_scenarios.cpp
      git log -1 --name-status | grep -F .plan/parity-present-state.md
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 01b-check-companion-sha-pinned
    type: check
    bounce_target: 01-triage-and-resync
    prompt: |
      You are the verifier for Phase 01 — `01b-check-companion-sha-pinned`.

      Confirm `## Master companion SHA (pinned this phase)` in
      `.plan/parity-present-state.md` names the current `../openglad-master`
      HEAD.

      Run:

      ```
      grep -E '^Master companion SHA: [0-9a-f]{40}$' .plan/parity-present-state.md | head -1
      test "$(grep -oE '[0-9a-f]{40}' .plan/parity-present-state.md | head -1)" \
         = "$(git -C ../openglad-master rev-parse HEAD)"
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 02-companion-resync
    type: implement
    prompt: |
      You are the implement agent for Phase 02 — Re-sync the master companion
      mirror.

      ## Goal
      Bring `../openglad-master/tools/parity_scenario_table.h` byte-equal to
      branch, rebuild `parity_dump_master`, and reconcile SHAs in
      `.plan/parity-coverage-manifest.md` + `.plan/master-companion.md`.

      ## Preexisting Inputs (consume; do not regenerate)
      - `.plan/parity-present-state.md` (Phase 1 output)
      - `.plan/parity-coverage-manifest.md` (out-of-date `master_companion_sha`)
      - `.plan/master-companion.md` (out-of-date SHA tables)
      - `tests/parity/scenario_table.h` (committed at end of Phase 1)
      - `../openglad-master/tools/parity_scenario_table.h` (stale mirror)
      - `../openglad-master/build/ci-test/parity_dump_master` (stale binary)
      - `scripts/parity/capture_master_golden.sh`
      - `scripts/parity/validate_schema.py`

      Update these in place; do not rediscover them.

      ## New Outputs
      - Updated `../openglad-master/tools/parity_scenario_table.h` (byte-equal to
        branch).
      - Rebuilt `../openglad-master/build/ci-test/parity_dump_master`.
      - Updated `.plan/parity-coverage-manifest.md` frontmatter
        `master_companion_sha:` line.
      - Updated `.plan/master-companion.md` body `## Drift-detection SHA-1s`
        section.
      - Branch commit: `parity-finish-3: phase 02 — resync companion mirror; pinned <sha>`.
      - Companion commit: `parity-companion: phase 02 — mirror scenario_table.h SHA <branch-sha>`.

      ## Implementation Details
      The branch file at this point includes the WIP treasure-row rewrite
      committed in Phase 1. Both `.plan/` docs must be updated to the
      post-rebuild companion HEAD.

      Master-side commit sequence (run literally):

      ```
      BRANCH_SHA=$(git rev-parse HEAD)
      cp tests/parity/scenario_table.h \
         ../openglad-master/tools/parity_scenario_table.h
      git -C ../openglad-master add tools/parity_scenario_table.h
      git -C ../openglad-master commit -m \
        "parity-companion: phase 02 — mirror scenario_table.h SHA ${BRANCH_SHA}"
      cd /home/yans/code/openglad-master && \
        cmake --build --preset ci-test --target parity_dump_master && \
        cd /home/yans/code/openglad
      ```

      The companion commit message literally embeds the branch HEAD SHA captured
      before the `cp`. Verifier 02c re-derives the SHA and grep-matches the
      companion's `git log -1 --pretty=%B`.

      Then edit `.plan/parity-coverage-manifest.md`'s `master_companion_sha:`
      line and `.plan/master-companion.md`'s `## Drift-detection SHA-1s`
      section to cite the new companion HEAD.

      ## Git Commit Requirement (mandatory before yielding)
      Create BOTH commits before yielding:

      1. Companion commit `parity-companion: phase 02 — mirror scenario_table.h SHA <branch-sha>`
         on `../openglad-master`.
      2. Branch commit `parity-finish-3: phase 02 — resync companion mirror; pinned <sha>`
         on the current worktree, after editing both `.plan/` docs and
         `git add`-ing them.

      The companion commit must literally embed the branch-side HEAD SHA captured
      before the `cp`. The companion binary must be rebuilt after the companion
      commit lands.

  - id: 02a-check-mirror-sha-equal
    type: check
    bounce_target: 02-companion-resync
    prompt: |
      You are the verifier for Phase 02 — `02a-check-mirror-sha-equal`.

      Confirm branch and companion `scenario_table.h` are byte-identical.

      Run:

      ```
      sha1sum tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h \
        | awk '{print $1}' | sort -u | wc -l                                # expect 1
      diff -q tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h    # exit 0
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 02b-check-companion-binary-fresh
    type: check
    bounce_target: 02-companion-resync
    prompt: |
      You are the verifier for Phase 02 — `02b-check-companion-binary-fresh`.

      Confirm the companion dumper rebuilt successfully and lists the same
      **master-comparable** scenarios as the branch table. Rows marked
      `is_branch_internal=true` (currently just `snapshot_dirty_bits_scen9301`,
      which has no master dirty-bits infrastructure) are filtered out of
      `--list` by `list_scenarios()` in
      `../openglad-master/tools/parity_dump_master.cpp` — by design — so the
      branch-side count must apply the same filter before comparing.

      Run:

      ```
      cd /home/yans/code/openglad-master && cmake --build --preset ci-test --target parity_dump_master
      test -x ../openglad-master/build/ci-test/parity_dump_master
      BRANCH_COUNT=$(python3 -c "
      from pathlib import Path
      from scripts.parity.lint_scenario_facts import _load_table, parse_scenarios
      rows = parse_scenarios(_load_table(Path('tests/parity/scenario_table.h')))
      # Mirror list_scenarios()'s 'if (s.is_branch_internal) continue;' filter.
      # is_branch_internal is the bool positional field after compare_mode;
      # only branch-internal rows use 'CompareMode::Invariant, true,' verbatim.
      master_listable = [r for r in rows if 'CompareMode::Invariant, true,' not in r['raw']]
      print(len(master_listable))
      ")
      COMPANION_COUNT=$(../openglad-master/build/ci-test/parity_dump_master --list | wc -l)
      test "$BRANCH_COUNT" = "$COMPANION_COUNT"
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 02c-check-doc-sha-reconciled
    type: check
    bounce_target: 02-companion-resync
    prompt: |
      You are the verifier for Phase 02 — `02c-check-doc-sha-reconciled`.

      Confirm `.plan/parity-coverage-manifest.md` and `.plan/master-companion.md`
      cite the current companion HEAD, and both worktrees have a commit on top.

      The phase contract is: the companion commit message embeds the branch HEAD
      *captured before the `cp`*, which is necessarily the parent of the branch
      commit that lands afterward (manifest update + master-companion.md table
      refresh both happen in that branch commit). So the SHA quoted in the
      companion message equals `git rev-parse HEAD~1` on the branch, not
      `git rev-parse HEAD`. (The two-sided cycle — manifest cites companion
      HEAD, companion msg embeds branch HEAD — has no fixed point under
      collision-resistant hashing, so the contract is parent-of-HEAD by
      design.)

      Run:

      ```
      grep '^master_companion_sha: ' .plan/parity-coverage-manifest.md | wc -l           # expect 1
      test "$(grep '^master_companion_sha: ' .plan/parity-coverage-manifest.md | awk '{print $2}')" \
         = "$(git -C ../openglad-master rev-parse HEAD)"
      grep -c "$(git -C ../openglad-master rev-parse HEAD)" .plan/master-companion.md     # >= 1
      git log -1 --name-status | grep -F .plan/parity-coverage-manifest.md
      git log -1 --name-status | grep -F .plan/master-companion.md
      git -C ../openglad-master log -1 --name-status | grep -F tools/parity_scenario_table.h
      git -C ../openglad-master log -1 --pretty=%B | grep -F "$(git rev-parse HEAD~1)"
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 03-mass-golden-capture
    type: implement
    prompt: |
      You are the implement agent for Phase 03 — Mass golden capture.

      ## Goal
      Capture a fresh master golden for every master-comparable scenario in
      `kScenarios`. Commit replacements and additions. Extend
      `scripts/parity/capture_master_golden.sh` to support `--all` (write into
      `tests/parity/golden/`) and `--no-write --out-dir <dir>` (capture
      elsewhere, no in-tree mutation).

      ## Preexisting Inputs (consume; do not regenerate)
      - `tests/parity/scenario_table.h` (Phase 1 committed, Phase 2 mirrored)
      - `../openglad-master/tools/parity_scenario_table.h` (mirror, SHA-equal)
      - `../openglad-master/build/ci-test/parity_dump_master`
      - `tests/parity/golden/*.json` (39 files)
      - `scripts/parity/capture_master_golden.sh`
      - `scripts/parity/validate_schema.py`
      - `.plan/parity-present-state.md` (Phase 1 sections)

      Use the existing companion binary; do not rebuild from scratch unless
      missing.

      ## New Outputs
      - Extended `scripts/parity/capture_master_golden.sh`:
        - `--all` iterates every id from `parity_dump_master --list`, captures
          into `tests/parity/golden/<id>.json`. Each golden passes
          `validate_schema.py` before being written; first validation failure
          aborts the sweep with non-zero exit naming the offending id.
        - `--no-write --out-dir <dir>` captures to `<dir>` instead of
          `tests/parity/golden/`, no in-tree mutation.
        - Writes via temp file + `mv` so re-runs are byte-stable.
        - Output ordering is `sort -u` over `--list`.
        - Recapture does NOT modify `kScenarios`.
      - ~91 new / replaced JSON files under `tests/parity/golden/`.
      - Append-only update to `.plan/parity-present-state.md` adding
        `## After Phase 03 — mass golden capture` section with PASS / SKIP /
        FAIL integers and `### Newly-FAILing (deferred to Phase 4/5/6)`
        subsection listing each newly-failing id.

      ## Implementation Details
      The script today calls `parity_dump_master --scenario <id> --out <path>`.
      The `--all` extension is a thin shell loop over `parity_dump_master --list`.
      Validator is mandatory per-id: malformed JSON dumps must NOT be committed.

      ## Git Commit Requirement (mandatory before yielding)
      ```
      git add scripts/parity/capture_master_golden.sh \
              tests/parity/golden/*.json \
              .plan/parity-present-state.md
      git commit -m "parity-finish-3: phase 03 — recapture every golden against companion <sha>; <N> new, <M> replaced"
      ```

      Use a directory-wide `git add tests/parity/golden/*.json` so stale
      replacements cannot drift out of the commit.

  - id: 03a-check-no-skips-on-master-side
    type: check
    bounce_target: 03-mass-golden-capture
    prompt: |
      You are the verifier for Phase 03 — `03a-check-no-skips-on-master-side`.

      Confirm every scenario the companion knows has a committed golden, and
      every committed golden is schema-v1 valid.

      Run:

      ```
      ls tests/parity/golden/*.json | wc -l
      COMPANION_LIST_COUNT=$(../openglad-master/build/ci-test/parity_dump_master --list | wc -l)
      test "$(ls tests/parity/golden/*.json | wc -l)" -ge "$COMPANION_LIST_COUNT"
      while IFS= read -r id; do
        test -f tests/parity/golden/$id.json || { echo "missing: $id"; exit 1; }
      done < <(../openglad-master/build/ci-test/parity_dump_master --list)
      for f in tests/parity/golden/*.json; do
        python3 scripts/parity/validate_schema.py "$f" || { echo "invalid: $f"; exit 1; }
      done
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 03b-check-recapture-is-stable
    type: check
    bounce_target: 03-mass-golden-capture
    prompt: |
      You are the verifier for Phase 03 — `03b-check-recapture-is-stable`.

      Confirm a fresh recapture is byte-identical to the committed goldens
      (dumper determinism).

      Run:

      ```
      rm -rf /tmp/recapture && mkdir -p /tmp/recapture
      scripts/parity/capture_master_golden.sh --all --out-dir /tmp/recapture --no-write
      for f in tests/parity/golden/*.json; do
        id=$(basename "$f" .json)
        cmp -s "$f" "/tmp/recapture/$id.json" || { echo "DIFF: $id"; exit 1; }
      done
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 03c-check-parity-tests-master-side-ok
    type: check
    bounce_target: 03-mass-golden-capture
    prompt: |
      You are the verifier for Phase 03 — `03c-check-parity-tests-master-side-ok`.

      Confirm SKIP count strictly drops from the Phase 1 baseline, FAIL growth
      is bounded to the deferred cohort (`weapon|effect|generator|event|special`
      emissions, special `<family>_<idx>`, or `coverage_catchall_scen99`), no
      non-deferred regression occurred, and the present-state doc records the
      new counts.

      Run:

      ```
      cmake --build --preset ci-test --target og_test_parity
      build/ci-test/og_test_parity --gtest_brief=1 2>&1 | tee /tmp/parity-phase03.out

      PRE_SKIP=$(grep -oE '^Skipped: [0-9]+$' .plan/parity-present-state.md | awk '{print $2}' | head -1)
      POST_SKIP=$(grep -oE '^\[  SKIPPED \] [0-9]+ tests?\.' /tmp/parity-phase03.out | awk '{print $3}' | head -1)
      test -n "$POST_SKIP" || POST_SKIP=0
      test "$POST_SKIP" -lt "$PRE_SKIP"

      OLD_FAILS=$(awk '/^## Failing tests/,/^## /' .plan/parity-present-state.md \
                  | grep -oE 'Parity\.[a-z_0-9]+' | sort -u)
      NEW_FAILS=$(grep -oE '^\[  FAILED  \] Parity\.[a-z_0-9]+' /tmp/parity-phase03.out \
                  | awk '{print $NF}' | sort -u)
      ALLOWED='^Parity\.(weapon|effect|generator|event|special)_[a-z_0-9]+_emission_scen99$|^Parity\.special_[a-z_0-9]+_scen99$|^Parity\.coverage_catchall_scen99$'
      REGRESSED=$(comm -23 <(printf '%s\n' "$NEW_FAILS") <(printf '%s\n' "$OLD_FAILS") \
                  | grep -vE "$ALLOWED" || true)
      test -z "$REGRESSED" || { echo "Unauthorised new FAILs:"; echo "$REGRESSED"; exit 1; }
      NON_DEFERRED_FAILS=$(printf '%s\n' "$NEW_FAILS" | grep -vE "$ALLOWED" || true)
      BASELINE_NON_DEFERRED=$(printf '%s\n' "$OLD_FAILS" | grep -vE "$ALLOWED" || true)
      test "$(printf '%s' "$NON_DEFERRED_FAILS" | sort -u)" \
         = "$(printf '%s' "$BASELINE_NON_DEFERRED" | sort -u)"

      grep -F '## After Phase 03 — mass golden capture' .plan/parity-present-state.md
      grep -F '### Newly-FAILing (deferred to Phase 4/5/6)' .plan/parity-present-state.md
      ```

      Emit exactly one verdict line at the end:
      `VERDICT: PASS` or `VERDICT: FAIL: <reason>`.

  - id: 04-fix-treasure-rows
    type: implement
    prompt: |
      You are the implement agent for Phase 04 — Per-Order family-symbol
      resolution + 17th FactKind.

      ## Goal
      Treasure pickup scenarios pass via producer-side per-Order `family_symbol`
      resolution AND a new `TreasureFamilyOfOrderRemovedFromOblist` predicate
      kind. Schema-v1 JSON keys / types / ordering unchanged. Treasure cohort
      and the two behavioural gate tests (`behavioural_coverage_gate`,
      `behavioural_coverage_gate_treasures`) are all green at end of phase. The
      WIP `FAMILY_SOLDIER` player walker at `(96,120)` from Phase 1 stays in
      place; no `FAMILY_DRUID` workaround.

      ## Preexisting Inputs (consume; do not regenerate)
      - `tests/parity/scenario_table.h` (Phase 1 committed WIP)
      - `tests/parity/golden/treasure_*.json` (Phase 3 captured under old dumper)
      - `../openglad-master/tools/parity_scenario_table.h` (Phase 2 byte-equal sync)
      - `../openglad-master/tools/parity_dump_state.cpp`
      - `../openglad-master/tools/fact_predicate.h`
      - `../openglad-master/build/ci-test/parity_dump_master`
      - `tests/parity/fact_predicate.{h,cpp}`
      - `tests/parity/state_dump.{h,cpp}`
      - `tests/parity/test_parity_coverage_gate.cpp`
      - `tests/parity/parity_runner.cpp`, `tests/parity/scenario_runtime.cpp`
      - `include/openglad/core/order.h`
      - `.plan/parity-present-state.md`

      ## New Outputs

      1. Updated `tests/parity/state_dump.cpp`:
         - New helper `std::string family_symbol_for_entity(const walker& w)`
           resolving the family symbol via `w.query_order()`. Table is
           `static constexpr std::array<std::array<const char*, kFamilyMax>, kOrderMax>`
           populated from the same source-of-truth as the existing
           `family_symbol(int)`. Table must contain, at minimum, treasure-order
           names for ids 0–12 and weapon-order names for ids 0–19.
         - `collect_walkers` uses `family_symbol_for_entity(*w)` instead of
           `family_symbol(static_cast<int32_t>(w->family()))`.
         - `collect_effects` and `collect_weapons` keep their existing
           order-specific resolution.
      2. Matching update to `../openglad-master/tools/parity_dump_state.cpp`:
         same helper, same call-site swap, same per-Order table.
      3. Updated `tests/parity/fact_predicate.h`:
         - New enum entry `TreasureFamilyOfOrderRemovedFromOblist` appended
           (17th and last; no ordinals shift).
         - New
           `inline constexpr FactPredicate TreasureFamilyOfOrderRemovedFromOblist(std::int32_t family, std::int32_t order, std::string_view label = {}) noexcept`
           factory with `order` immediately after `family` (positional),
           defaulted `label` last.
         - Existing factory
           `TreasureFamilyRemovedFromOblist(std::int32_t family, std::string_view label = {})`
           preserved verbatim.
      4. Updated `tests/parity/fact_predicate.cpp`:
         - New private helper
