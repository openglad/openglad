name: parity-coverage-pass-2-replan
backend: claude
working_dir: .
max_bounces: 999
vars:
  GOAL: >-
    Confirm the 6 already-landed walker-status-timer and summon-lifecycle parity
    scenarios are intact, then fill the remaining behavioral-coverage gaps in the
    OpenGlad parity test suite by adding 16 new scenarios across the generator,
    weapon-trajectory, effect-emission, effect-timer, input-pipeline,
    multi-team-coordination, level-withdraw, and mid-combat-state categories, and
    refresh the final parity docs to the 156-scenario state. Mirror every
    scenario_table.h change byte-for-byte to the master parity-companion worktree,
    capture master goldens, keep the full suite green, and commit every change in
    both worktrees.
phases:
  - id: impl-confirm-prior-work
    type: implement
    prompt: |
      You are confirming that prior already-landed parity work is intact in the
      OpenGlad parity test suite. There are 6 scenarios that were landed by an
      earlier pass: `enemy_freeze_mage_scen99`, `invisibility_thief_scen99`,
      `speed_potion_movement_scen99`, `invulnerable_potion_scen99`,
      `summon_lifetime_faerie_scen99`, `summon_lifetime_decrement_faerie_scen99`.

      ## Preexisting Inputs

      Consume and verify these existing artifacts as-is — do **not** refetch,
      recollect, rediscover, or regenerate them from scratch. If they are already
      green and committed, there is nothing to do:

      - `tests/parity/scenario_table.h` (contains the 6 already-landed scenarios).
      - `tests/parity/test_parity_scenarios.cpp` (6 paired `OG_PARITY_TEST` macros).
      - The 6 golden files:
        - `tests/parity/golden/enemy_freeze_mage_scen99.json`
        - `tests/parity/golden/invisibility_thief_scen99.json`
        - `tests/parity/golden/speed_potion_movement_scen99.json`
        - `tests/parity/golden/invulnerable_potion_scen99.json`
        - `tests/parity/golden/summon_lifetime_faerie_scen99.json`
        - `tests/parity/golden/summon_lifetime_decrement_faerie_scen99.json`
      - `../openglad-master/tools/parity_scenario_table.h` (the byte-mirror).
      - `../openglad-master/build/ci-test/parity_dump_master` (built master dump).
      - The earlier commits already on the branch and their master-mirror commits.

      ## New Outputs

      None in the normal (already-green) case. Only if drift is detected (a golden
      missing, a named test failing, or `diff -q` showing mirror drift) do you
      produce repair outputs: a re-mirrored
      `../openglad-master/tools/parity_scenario_table.h`, a rebuilt
      `parity_dump_master`, any re-captured missing golden, and the fix commits in
      both worktrees.

      ## Implementation Details

      First check whether this phase's deliverable already exists and passes: the 6
      scenarios present in `kScenarios[]`, their macros present, goldens on disk,
      the named tests green, and the mirror in sync. If all already hold, ensure the
      required commits have landed and **yield immediately — do not redo work**.

      Run the build + tests and the named filters below. If everything is green and
      committed, yield immediately — there is nothing to commit. Only if something
      regressed perform the minimal repair, updating the existing artifacts rather
      than regenerating them from scratch:

      - re-mirror: `cp tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h`
      - rebuild: in `../openglad-master`, `cmake --build --preset ci-test --target parity_dump_master`
      - re-capture any missing golden via `scripts/parity/capture_master_golden.sh <scenario...>`

      Keep the session short.

      ## Commands

      - `cmake --build --preset ci-test && ctest --preset ci-test` → 0 failures.
      - `./build/ci-test/og_test_parity --gtest_filter='Parity.enemy_freeze_mage_scen99:Parity.invisibility_thief_scen99:Parity.speed_potion_movement_scen99:Parity.invulnerable_potion_scen99:Parity.summon_lifetime_faerie_scen99:Parity.summon_lifetime_decrement_faerie_scen99'` → all pass.
      - `diff -q tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h` → 0 (byte-identical).

      ## Success Criteria

      - All six named scenarios pass.
      - All six goldens exist on disk.
      - Mirror table is byte-identical (`diff -q` → 0).
      - All 7 coverage/golden/mutation gates pass.
      - `git status --porcelain tests/parity/` is empty.
      - If any repair was needed, it is committed in both worktrees.

      ## Git Commit Requirement

      In the already-green case there is nothing to commit; yield immediately.
      If — and only if — a regression was repaired, you **must** commit the repair in
      **both** worktrees (branch + master mirror) before yielding, including
      `tests/parity/scenario_facts_generated.json` in the branch commit if the build
      regenerated it. No `--no-verify` or `--amend` unless flagged in the commit
      message as recovery. Do not yield until any needed commits land.
  - id: check-confirm-prior-work
    type: check
    bounce_target: impl-confirm-prior-work
    prompt: |
      You are a **parity-scenario reviewer**. Deterministically confirm the 6
      already-landed scenarios are intact, green, mirrored, and committed.

      ## Preexisting Inputs

      - `tests/parity/scenario_table.h`
      - `tests/parity/test_parity_scenarios.cpp`
      - `tests/parity/golden/enemy_freeze_mage_scen99.json`
      - `tests/parity/golden/invisibility_thief_scen99.json`
      - `tests/parity/golden/speed_potion_movement_scen99.json`
      - `tests/parity/golden/invulnerable_potion_scen99.json`
      - `tests/parity/golden/summon_lifetime_faerie_scen99.json`
      - `tests/parity/golden/summon_lifetime_decrement_faerie_scen99.json`
      - `../openglad-master/tools/parity_scenario_table.h`
      - `../openglad-master/build/ci-test/parity_dump_master`

      ## What to Verify

      Run each command and confirm the stated result:

      - `cmake --build --preset ci-test && ctest --preset ci-test` → 0 failures.
      - `./build/ci-test/og_test_parity --gtest_filter='Parity.enemy_freeze_mage_scen99:Parity.invisibility_thief_scen99:Parity.speed_potion_movement_scen99:Parity.invulnerable_potion_scen99:Parity.summon_lifetime_faerie_scen99:Parity.summon_lifetime_decrement_faerie_scen99'` → all pass.
      - `ls tests/parity/golden/enemy_freeze_mage_scen99.json tests/parity/golden/invisibility_thief_scen99.json tests/parity/golden/speed_potion_movement_scen99.json tests/parity/golden/invulnerable_potion_scen99.json tests/parity/golden/summon_lifetime_faerie_scen99.json tests/parity/golden/summon_lifetime_decrement_faerie_scen99.json` → all exist.
      - `diff -q tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h` → returns 0 (byte-identical).
      - `./build/ci-test/og_test_parity --gtest_filter='*depth_gate*:*golden_evaluation_gate*:*mutation_canary*'` → all pass.
      - `git status --porcelain tests/parity/` → empty (no uncommitted parity-test changes).

      ## Verdict

      If every check above succeeds, emit exactly:
      `VERDICT: PASS`

      Otherwise emit exactly:
      `VERDICT: FAIL: <reason>`
  - id: impl-generator-saturation
    type: implement
    prompt: |
      You are adding 1 generator-saturation scenario (`generator_saturation_scen99`)
      to the OpenGlad parity test suite. It exercises a `FAMILY_TOWER` generator
      saturating `living_count` toward MAXOBS over 2500 ticks.

      ## Preexisting Inputs

      Consume these existing artifacts as-is — do **not** refetch, recollect,
      rediscover, or regenerate them from scratch; append to / update them in place:

      - `tests/parity/scenario_table.h` (append target; 134 existing + earlier-phase additions are untouched).
      - `tests/parity/scenario_runtime.cpp` (already wires `special_names_table` — **do not modify**).
      - `tests/parity/test_parity_scenarios.cpp` (append target).
      - `tests/parity/fact_predicate.h` (predicate vocabulary).
      - `tests/parity/test_parity_coverage_gate.cpp` (gate contracts — **not** modified).
      - `src/gameplay/walker.cpp:1217-1235` (`act_generate`, gates on `living_count < MAXOBS`).
      - `src/gameplay/generator_family_registry.cpp:30-37` (`FAMILY_TOWER → default_weapon = FAMILY_MAGE`).
      - `scripts/parity/capture_master_golden.sh`.
      - `../openglad-master/` worktree (branch `parity-companion`), the mirror file
        `../openglad-master/tools/parity_scenario_table.h`, and the built
        `../openglad-master/build/ci-test/parity_dump_master`.

      ## New Outputs

      - 1 `ScenarioSpec` row `generator_saturation_scen99` appended to `kScenarios[]`.
      - 1 `OG_PARITY_TEST(generator_saturation_scen99)` macro appended.
      - 1 `kMut_generator_saturation_scen99` mutation descriptor (tab-indented).
      - 1 golden `tests/parity/golden/generator_saturation_scen99.json`.
      - Updated `../openglad-master/tools/parity_scenario_table.h` (byte-mirror) + rebuilt `parity_dump_master`.

      ## Implementation Details

      First check whether this phase's deliverable already exists and passes
      (scenario present in `kScenarios[]`, macro present, golden on disk, the named
      test green, mirror in sync). If all already hold, ensure the two required git
      commits have landed and yield immediately — do not redo work. Otherwise
      implement only the missing pieces.

      - Spawns: `{FAMILY_TOWER,1,kOrderGenerator,60,60,0,0,5,0}`,
        `{FAMILY_SOLDIER,0,kOrderLiving,240,240,0,0}` (observer, far enough not to interfere).
      - Inputs: none (idle scenario). Tick budget 2500.
      - Facts: `pred::TickReached(2500)`; `pred::WalkerFamilyCount(FAMILY_TOWER,1,1)`;
        `pred::WalkerFamilyCount(FAMILY_MAGE, 3, 30, "consequence: generator saturates living_count over 2500 ticks; range spans RNG drift")`;
        `pred::EventKindAtLeast(/*play_sound*/1, 4)`;
        `pred::WalkerOfTeamAlive(1, 3, 30, "rng_drift: spawn count varies with per-tick RNG")`.
      - Mutation: `src/gameplay/walker.cpp` line 1219 (tab-indented — preserve the leading tab).
        - from: `\tif ( current_game->world->living_count < MAXOBS &&`
        - to:   `\tif ( false &&`
        - rationale: replacing the `living_count < MAXOBS` half of the `act_generate`
          gate with `false` makes the conjunction always false; the generator never
          fires; zero FAMILY_MAGE spawn; `WalkerFamilyCount(FAMILY_MAGE, 3, 30)` fails
          on its lower bound.

      Empirical numeric values (the `EventKindAtLeast` floor, the count ranges, the
      tick budget) are tunable starting points: adjust to runtime-observed values so
      the unmutated scenario passes on the branch, every `EventKindAtLeast` floor is
      strictly `> 0`, the mutation still flips ≥1 predicate, any widened range carries
      an `intended_diff:`/`rng_drift:`/`consequence:` label, and the scenario keeps
      ≥3 non-`TickReached` predicates including ≥1 whose label begins `consequence:`.

      ## Mirror + Capture (standard per-implement sequence)

      1. Append the spawn/input/fact/mutation/`ScenarioSpec` + macro (byte-match the
         mutation `from`/`to` to the source line including tabs vs spaces).
      2. `cp tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h`.
      3. In the master worktree: `cmake --build --preset ci-test --target parity_dump_master` (run from `../openglad-master`).
      4. From the branch worktree: `scripts/parity/capture_master_golden.sh generator_saturation_scen99`.
      5. `cmake --build --preset ci-test && ctest --preset ci-test` → 0 failures.
         Wrap any branch/master-divergent predicate in `pred::branch_only(...)` /
         `pred::master_only(...)` with an `intended_diff:`/`rng_drift:` label.

      ## Success Criteria

      - `generator_saturation_scen99` passes; golden exists; mirror byte-identical.
      - All coverage/golden/mutation gates pass.
      - ≥3 non-`TickReached` predicates incl. ≥1 with a `consequence:` label.
      - Mutation `from`/`to` preserves tab indentation matching `src/gameplay/walker.cpp:1219`.
      - `git status --porcelain tests/parity/` is empty.

      ## Git Commit Requirement

      You **must** commit work to git in **both** worktrees before yielding:

      - `git -C ../openglad-master add tools/parity_scenario_table.h && git -C ../openglad-master commit -m "parity-companion: mirror scenario_table.h generator"`
      - `git add tests/parity/scenario_table.h tests/parity/test_parity_scenarios.cpp tests/parity/scenario_facts_generated.json tests/parity/golden/generator_saturation_scen99.json && git commit -m "parity-cov: generator-saturation scenario"`

      The branch commit **must include `tests/parity/scenario_facts_generated.json`**
      (regenerated in-source by the build). After committing,
      `git status --porcelain tests/parity/` must be empty. No `--no-verify`/`--amend`
      unless flagged as recovery. Do not yield until both commits land.
  - id: check-generator-saturation
    type: check
    bounce_target: impl-generator-saturation
    prompt: |
      You are a **parity-scenario reviewer**. Deterministically confirm
      `generator_saturation_scen99` is present, green, mirrored, committed, and
      depth/consequence-compliant.

      ## Preexisting Inputs

      - `tests/parity/scenario_table.h`
      - `tests/parity/test_parity_scenarios.cpp`
      - `tests/parity/golden/generator_saturation_scen99.json`
      - `../openglad-master/tools/parity_scenario_table.h`

      ## What to Verify

      Run each command and confirm the stated result:

      - `cmake --build --preset ci-test && ctest --preset ci-test` → 0 failures.
      - `./build/ci-test/og_test_parity --gtest_filter='Parity.generator_saturation_scen99'` → pass.
      - `ls tests/parity/golden/generator_saturation_scen99.json` → exists.
      - `diff -q tests/parity/scenario_table.h ../openglad-master/tools/parity_scenario_table.h` → 0.
      - `./build/ci-test/og_test_parity --gtest_filter='*depth_gate*:*golden_evaluation_gate*:*mutation_canary*'` → pass.
      - Mechanical depth/consequence count for `generator_saturation_scen99` — run:

        ```bash
        block=$(awk '/inline constexpr FactPredicate kFacts_generator_saturation_scen99\[\]/{f=1} f{print} /^};/{if(f)exit}' tests/parity/scenario_table.h)
        total=$(printf '%s\n' "$block" | grep -c 'pred::')
        ticks=$(printf '%s\n' "$block" | grep -c 'pred::TickReached')
        test $((total - ticks)) -ge 3                    # ≥3 non-TickReached predicates
        printf '%s\n' "$block" | grep -q 'consequence:'  # ≥1 consequence predicate
        ```

        FAIL if either assertion fails.
      - Tree-cleanliness: `git status --porcelain tests/parity/` → empty.

      ## Verdict

      If every check above succeeds, emit exactly:
      `VERDICT: PASS`

      Otherwise emit exactly:
      `VERDICT: FAIL: <reason>`
  - id: impl-weapon-trajectories
    type: implement
    prompt: |
      You are adding 3 weapon-trajectory scenarios to the OpenGlad parity test
      suite: `weapon_rock_slot2_emit_scen99`, `weapon_boomerang_return_scen99`,
