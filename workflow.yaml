      openglad jitter elimination work.

      ## Preexisting Inputs (consume in place; do not regenerate)
      - `src/platform/sdl/game_loop.cpp` — `game_frame_with_result()` must use the deadline pacer.
      - `src/platform/sdl/glad_gameplay.cpp` — `glad_main` must call `run_native_game_loop(...)`.
