<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Openglad">
    <link rel="apple-touch-icon" href="hero.png">
    <title>Openglad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #000;
        }

        body {
            /* iOS Safari hardening: pin the page so letterbox-area touches
               cannot rubber-band scroll or shift the layout viewport. */
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background-color: #000;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @supports (height: 100dvh) {
            #game-container {
                height: 100dvh;
            }
        }

        #canvas {
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background-color: #000;
        }

        #canvas:fullscreen {
            object-fit: contain;
        }

        #fullscreen-button {
            position: fixed;
            top: max(8px, env(safe-area-inset-top, 0px));
            right: max(8px, env(safe-area-inset-right, 0px));
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 4px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            cursor: pointer;
        }

        #fullscreen-button:hover {
            background: rgba(40, 40, 40, 0.9);
        }

        #fullscreen-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        #fullscreen-button svg {
            width: 22px;
            height: 22px;
            pointer-events: none;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 16px;
        }

        #loading-progress {
            width: 200px;
            height: 4px;
            background: #333;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }

        #loading-bar {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 0.2s;
        }

        .hidden {
            display: none !important;
        }

        /* ------------------------------------------------------------------
           Touch controls overlay (runtime-gated: touch devices only).
           Container swallows nothing (pointer-events: none); each control
           re-enables pointer events, so overlay touches never reach SDL's
           canvas handlers. Safe-area insets keep controls off the notch.
           ------------------------------------------------------------------ */
        #touch-controls {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: none;
            pointer-events: none;
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #touch-controls.tc-active {
            display: block;
        }

        #tc-game {
            display: none;
        }

        #tc-game.tc-show {
            display: block;
        }

        .tc-control {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0.35;
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .tc-control.tc-pressed,
        .tc-control.tc-latched {
            opacity: 0.65;
            background: rgba(110, 110, 110, 0.6);
        }

        .tc-control.tc-latched {
            border-color: #ff0;
            color: #ff0;
        }

        #tc-stick-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 45%;
            height: 70%;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #tc-stick-base {
            position: fixed;
            width: 120px;
            height: 120px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.25);
            opacity: 0.5;
            pointer-events: none;
        }

        #tc-stick-thumb {
            position: absolute;
            left: 32px;
            top: 32px;
            width: 56px;
            height: 56px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            background: rgba(160, 160, 160, 0.55);
        }

        #tc-fire {
            width: 72px;
            height: 72px;
            right: max(12px, env(safe-area-inset-right, 0px));
            bottom: max(12px, env(safe-area-inset-bottom, 0px));
        }

        #tc-special {
            width: 60px;
            height: 60px;
            right: calc(max(12px, env(safe-area-inset-right, 0px)) + 84px);
            bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 44px);
        }

        #tc-row {
            position: absolute;
            top: max(12px, env(safe-area-inset-top, 0px));
            right: calc(max(12px, env(safe-area-inset-right, 0px)) + 56px);
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        #tc-row .tc-control {
            position: static;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 10px;
        }

        #tc-back {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            top: max(12px, env(safe-area-inset-top, 0px));
            left: max(12px, env(safe-area-inset-left, 0px));
        }

        #tc-toggle {
            position: fixed;
            top: calc(max(8px, env(safe-area-inset-top, 0px)) + 52px);
            right: max(8px, env(safe-area-inset-right, 0px));
            width: 44px;
            height: 44px;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            font-size: 20px;
            opacity: 0.5;
            cursor: pointer;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Touch text-entry overlay: SDL3's emscripten backend has no screen
           keyboard, so prompts get a real DOM input on touch devices. */
        #og-text-entry-wrap {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #og-text-entry {
            width: min(280px, 60vw);
            height: 40px;
            padding: 0 10px;
            font-size: 16px; /* >=16px stops iOS auto-zoom on focus */
            font-family: Arial, sans-serif;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 6px;
        }

        #og-text-entry-clear {
            width: 40px;
            height: 40px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        #og-rotate-hint {
            position: fixed;
            left: 50%;
            bottom: max(24px, env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            z-index: 6;
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 14px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        #og-rotate-hint button {
            padding: 6px 12px;
            color: #000;
            background: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="320" height="200" oncontextmenu="event.preventDefault()" tabindex="-1" aria-label="Openglad game canvas"></canvas>
    </div>

    <button id="fullscreen-button" class="hidden" type="button" aria-label="Enter fullscreen" aria-controls="canvas" title="Enter fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
        </svg>
    </button>
    <p id="fullscreen-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <div id="touch-controls">
        <div id="tc-game">
            <div id="tc-stick-zone">
                <div id="tc-stick-base" class="hidden">
                    <div id="tc-stick-thumb"></div>
                </div>
            </div>
            <div id="tc-special" class="tc-control">SPC</div>
            <div id="tc-fire" class="tc-control">FIRE</div>
            <div id="tc-row">
                <div id="tc-look" class="tc-control">LOOK</div>
                <div id="tc-switch" class="tc-control">CHAR</div>
                <div id="tc-yell" class="tc-control">YELL</div>
                <div id="tc-alt" class="tc-control">ALT</div>
                <div id="tc-cycle" class="tc-control">SP+</div>
            </div>
        </div>
        <div id="tc-back" class="tc-control hidden">BACK</div>
    </div>
    <button id="tc-toggle" class="hidden" type="button" aria-label="Toggle touch controls" title="Toggle touch controls">&#127918;</button>

    <div id="og-text-entry-wrap" class="hidden">
        <input id="og-text-entry" type="text" placeholder="TAP TO TYPE"
               autocapitalize="characters" autocomplete="off" autocorrect="off"
               spellcheck="false" enterkeyhint="done" aria-label="Text entry">
        <button id="og-text-entry-clear" type="button" aria-label="Clear text and close">&#10005;</button>
    </div>

    <div id="og-rotate-hint" class="hidden">
        <span>Rotate your phone for the best view</span>
        <button id="og-rotate-dismiss" type="button">OK</button>
    </div>

    <div id="loading">
        <div id="loading-spinner"></div>
        <div id="loading-text">Loading...</div>
        <div id="loading-progress">
            <div id="loading-bar"></div>
        </div>
    </div>

    <script>
        var canvas = document.getElementById('canvas');
        var loadingElement = document.getElementById('loading');
        var loadingText = document.getElementById('loading-text');
        var loadingBar = document.getElementById('loading-bar');
        var fullscreenButton = document.getElementById('fullscreen-button');
        var fullscreenStatus = document.getElementById('fullscreen-status');
        var fullscreenControlReady = false;

        function fullscreenAvailable() {
            return document.fullscreenEnabled &&
                typeof canvas.requestFullscreen === 'function';
        }

        function updateFullscreenButton() {
            var showButton = fullscreenControlReady && fullscreenAvailable() &&
                document.fullscreenElement === null;
            fullscreenButton.classList.toggle('hidden', !showButton);
        }

        // The game never uses Escape on web: Backspace is the universal
        // back/cancel key (remapped in the engine), so browser-reserved
        // Escape exits fullscreen without any in-game side effect. No
        // Keyboard Lock is needed.
        function handleFullscreenControlChange() {
            updateFullscreenButton();
            if (document.fullscreenElement === canvas) {
                fullscreenStatus.textContent =
                    'Fullscreen active. Backspace is the in-game back key; Escape leaves fullscreen.';
            } else {
                fullscreenStatus.textContent = '';
            }
        }

        fullscreenButton.addEventListener('click', function() {
            fullscreenStatus.textContent = '';
            if (!fullscreenAvailable() || document.fullscreenElement !== null) {
                canvas.focus({preventScroll: true});
                return;
            }

            // Keep this call directly in the trusted click handler: browsers
            // reject Fullscreen API requests after user activation expires.
            var request = canvas.requestFullscreen();
            if (request && typeof request.then === 'function') {
                request.then(function() {
                    // Status text is owned by the fullscreenchange handler.
                    canvas.focus({preventScroll: true});
                }).catch(function(error) {
                    console.warn('Unable to enter fullscreen:', error);
                    fullscreenStatus.textContent =
                        'Fullscreen could not be opened. Please try again or use your browser fullscreen control.';
                    fullscreenButton.focus({preventScroll: true});
                });
            }
        });
        // Keep keyboard activation of the DOM control out of SDL's game-key
        // listeners. Do not prevent the native Enter/Space click action.
        fullscreenButton.addEventListener('keydown', function(event) {
            event.stopPropagation();
        });
        fullscreenButton.addEventListener('keyup', function(event) {
            event.stopPropagation();
        });
        document.addEventListener('fullscreenchange', handleFullscreenControlChange);

        // Handle WebGL context loss
        canvas.addEventListener('webglcontextlost', function(e) {
            alert('WebGL context lost. Please reload the page.');
            e.preventDefault();
        }, false);

        // Ensure canvas gets focus on click (important for keyboard input)
        canvas.addEventListener('click', function() {
            canvas.focus();
        });

        // WebKit-only pinch gesture events zoom the page even with
        // touch-action: none on the canvas; suppress them globally.
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // iOS Safari reports toolbar collapse/expand and keyboard geometry
        // through visualViewport, not window 'resize'; prefer it when present.
        function viewportSize() {
            var vv = window.visualViewport;
            if (vv && vv.width > 0 && vv.height > 0) {
                return { width: vv.width, height: vv.height };
            }
            return { width: window.innerWidth, height: window.innerHeight };
        }

        // Scale canvas to fit window while maintaining aspect ratio
        function resizeCanvas() {
            var gameWidth = 320;
            var gameHeight = 200;
            var viewport = viewportSize();
            var windowWidth = viewport.width;
            var windowHeight = viewport.height;

            // Calculate scale to fit window (maximize canvas size)
            var fittedWidth;
            var fittedHeight;
            if (windowWidth / gameWidth <= windowHeight / gameHeight) {
                fittedWidth = Math.max(1, Math.floor(windowWidth));
                fittedHeight = Math.max(1, Math.floor(
                    fittedWidth * gameHeight / gameWidth));
            } else {
                fittedHeight = Math.max(1, Math.floor(windowHeight));
                fittedWidth = Math.max(1, Math.floor(
                    fittedHeight * gameWidth / gameHeight));
            }

            canvas.style.width = fittedWidth + 'px';
            canvas.style.height = fittedHeight + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeCanvas);
        }
        resizeCanvas(); // Initial sizing
        window.__opengladWebBootstrap = {
            runtimeInitialized: false,
            bootFunctionAvailable: false,
            bootCalls: 0
        };
        window.__opengladGameState = null;

        function installPostBootCanvasRecovery() {
            var canvasWasFullscreen = document.fullscreenElement === canvas;
            function recoverCanvasBacking() {
                resizeCanvas();
                if (typeof Module._openglad_web_restore_canvas_backing === 'function') {
                    var rect = canvas.getBoundingClientRect();
                    Module._openglad_web_restore_canvas_backing(
                        Math.max(1, Math.round(rect.width)),
                        Math.max(1, Math.round(rect.height)));
                }
            }

            // Registered after SDL has booted so this runs after SDL3's own
            // resize/fullscreen listeners and repairs its fullscreen-exit race.
            window.addEventListener('resize', recoverCanvasBacking);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', recoverCanvasBacking);
            }
            document.addEventListener('fullscreenchange', function() {
                var canvasIsFullscreen = document.fullscreenElement === canvas;
                var exitedCanvasFullscreen = canvasWasFullscreen && !canvasIsFullscreen;
                canvasWasFullscreen = canvasIsFullscreen;
                recoverCanvasBacking();
                if (exitedCanvasFullscreen) {
                    requestAnimationFrame(function() {
                        canvas.focus({preventScroll: true});
                    });
                }
            });
        }

        var Module = {
            canvas: canvas,

            setStatus: function(text) {
                if (!text) {
                    // Loading complete
                    loadingElement.classList.add('hidden');
                    canvas.focus();
                    return;
                }

                // Parse progress if available
                var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (match) {
                    var progress = (parseInt(match[2]) / parseInt(match[4])) * 100;
                    loadingBar.style.width = progress + '%';
                    loadingText.textContent = match[1].trim() || 'Loading...';
                } else {
                    loadingText.textContent = text;
                }
            },

            totalDependencies: 0,

            monitorRunDependencies: function(remaining) {
                this.totalDependencies = Math.max(this.totalDependencies, remaining);
                if (remaining) {
                    Module.setStatus('Loading... (' + (this.totalDependencies - remaining) + '/' + this.totalDependencies + ')');
                } else {
                    Module.setStatus('');
                }
            },

            onRuntimeInitialized: function() {
                resizeCanvas();
                window.__opengladWebBootstrap.runtimeInitialized = true;
                window.__opengladWebBootstrap.bootFunctionAvailable =
                    typeof Module._openglad_web_boot === 'function';
                if (typeof Module._openglad_web_boot === 'function') {
                    window.__opengladWebBootstrap.bootCalls += 1;
                    Module._openglad_web_boot();
                    installPostBootCanvasRecovery();
                    fullscreenControlReady = true;
                    updateFullscreenButton();
                } else {
                    console.error('OpenGlad web bootstrap export is unavailable');
                }
            }
        };

        Module.setStatus('Loading...');

        // iOS in-gesture audio unlock: SDL3's emscripten backend resumes a
        // suspended AudioContext from a silence-timer poll, i.e. OUTSIDE any
        // user-gesture handler, which iOS Safari rejects. Resume it here from
        // real gestures instead; idempotent and cheap, so the listeners stay
        // installed for the page's lifetime (audio can re-suspend on
        // backgrounding).
        function unlockAudioContext() {
            try {
                var sdl = Module.SDL3 || Module.SDL2;
                var ctx = sdl && sdl.audioContext;
                if (ctx && ctx.state === 'suspended') {
                    var p = ctx.resume();
                    if (p && typeof p.catch === 'function') {
                        p.catch(function () {});
                    }
                }
            } catch (e) {
                // Best-effort: never let audio unlock break input handling.
            }
        }
        document.addEventListener('pointerdown', unlockAudioContext,
            { capture: true, passive: true });
        document.addEventListener('touchend', unlockAudioContext,
            { capture: true, passive: true });

        // SDL's own silence-timer resume() attempts reject in environments
        // with no usable audio device (headless WebKit); they retry
        // internally, so the rejections are pure console noise — filter
        // exactly those, keep everything else loud.
        window.addEventListener('unhandledrejection', function (event) {
            var reason = event && event.reason;
            var text = reason && (reason.message || String(reason));
            if (text && text.indexOf('audio device') !== -1) {
                event.preventDefault();
            }
        });

        // ------------------------------------------------------------------
        // Touch controls overlay.
        //
        // Two injection tiers into the engine (web_touch_bridge.cpp):
        //  - held state: Module._openglad_web_touch_set_key writes the
        //    touch_keystate seam OR-ed into isPlayerHoldingKey (movement,
        //    FIRE/SPECIAL holds, ALT latch, LOOK);
        //  - edges: Module._openglad_web_back_key (Backspace as the universal
        //    web back key; never Escape) and Module._openglad_web_push_key /
        //    _openglad_web_push_char for the text-entry overlay.
        // Menus need no injection: SDL's touch->mouse synthesis already
        // makes taps click buttons.
        // ------------------------------------------------------------------
        (function() {
            var TC_MIN_HOLD_MS = 90; // input sampler must observe the press
            var KEY = {
                UP: 0, UP_RIGHT: 1, RIGHT: 2, DOWN_RIGHT: 3, DOWN: 4,
                DOWN_LEFT: 5, LEFT: 6, UP_LEFT: 7, FIRE: 8, SPECIAL: 9,
                SWITCH: 10, SPECIAL_SWITCH: 11, YELL: 12, SHIFTER: 13,
                LOOKUP: 16
            };
            var SDLK_RETURN = 13;
            var SDLK_BACKSPACE = 8;
            var PREF_KEY = 'openglad.touchControls';

            var overlay = document.getElementById('touch-controls');
            var gameCluster = document.getElementById('tc-game');
            var backButton = document.getElementById('tc-back');
            var toggleButton = document.getElementById('tc-toggle');
            var stickZone = document.getElementById('tc-stick-zone');
            var stickBase = document.getElementById('tc-stick-base');
            var stickThumb = document.getElementById('tc-stick-thumb');

            var active = false;
            var enableAcked = false;
            var wasInGame = false;
            var sawTouchPointer = false;
            var resetVisualFns = [];

            function readPref() {
                try {
                    return localStorage.getItem(PREF_KEY) || 'auto';
                } catch (e) {
                    return 'auto';
                }
            }

            function writePref(value) {
                try {
                    localStorage.setItem(PREF_KEY, value);
                } catch (e) {
                    // Private mode: the toggle still works for this page load.
                }
            }

            function isTouchDevice() {
                if (window.__opengladForceTouchControls === true) {
                    return true;
                }
                // maxTouchPoints OR ontouchstart: WebKit's emulated iPhone
                // contexts report maxTouchPoints 0 while still delivering
                // touch events; real iOS Safari reports both. The coarse
                // check keeps mouse-primary desktops (even with a
                // touchscreen) on the plain UI until a touch is seen.
                var touchCapable = navigator.maxTouchPoints > 0 ||
                    'ontouchstart' in window;
                return touchCapable &&
                    typeof window.matchMedia === 'function' &&
                    window.matchMedia('(pointer: coarse)').matches;
            }

            function shouldEnable() {
                var pref = readPref();
                if (pref === 'on') {
                    return true;
                }
                if (pref === 'off') {
                    return false;
                }
                return isTouchDevice() || sawTouchPointer;
            }

            function bridge(name) {
                var fn = (typeof Module !== 'undefined') && Module['_' + name];
                return (typeof fn === 'function') ? fn : null;
            }

            // Touch taps on the game canvas are owned HERE, not by SDL: the
            // port's touch->mouse synthesis proved unreliable under real
            // engines (a quick tap surfaces as hover motion but never as a
            // click), so touch pointers are swallowed before SDL's listeners
            // run and re-injected as left-mouse events through the bridge.
            // Mouse/pen pointers pass through to SDL untouched. Overlay
            // controls (stick, buttons) capture their own pointers and never
            // reach these canvas listeners.
            (function ownCanvasTouch() {
                var activeTouchId = null;

                function canvasPoint(e) {
                    var rect = canvas.getBoundingClientRect();
                    return {
                        x: Math.round(e.clientX - rect.left),
                        y: Math.round(e.clientY - rect.top),
                        inside:
                            e.clientX >= rect.left && e.clientX < rect.right &&
                            e.clientY >= rect.top && e.clientY < rect.bottom,
                    };
                }

                function pushMouse(down, p) {
                    var fn = bridge('openglad_web_push_mouse');
                    if (fn) {
                        var rect = canvas.getBoundingClientRect();
                        fn(down ? 1 : 0, p.x, p.y,
                           Math.round(rect.width), Math.round(rect.height));
                    }
                }

                function swallow(e) {
                    e.stopImmediatePropagation();
                    if (e.cancelable) {
                        e.preventDefault();
                    }
                }

                canvas.addEventListener('pointerdown', function(e) {
                    if (e.pointerType !== 'touch') {
                        return;
                    }
                    swallow(e);
                    if (activeTouchId !== null || !e.isPrimary) {
                        return;
                    }
                    var p = canvasPoint(e);
                    if (!p.inside) {
                        return;
                    }
                    activeTouchId = e.pointerId;
                    pushMouse(true, p);
                }, { capture: true });

                canvas.addEventListener('pointermove', function(e) {
                    if (e.pointerType === 'touch') {
                        swallow(e);
                    }
                }, { capture: true });

                function endTouch(e) {
                    if (e.pointerType !== 'touch') {
                        return;
                    }
                    swallow(e);
                    if (e.pointerId !== activeTouchId) {
                        return;
                    }
                    activeTouchId = null;
                    pushMouse(false, canvasPoint(e));
                }
                canvas.addEventListener('pointerup', endTouch, { capture: true });
                canvas.addEventListener('pointercancel', endTouch, { capture: true });

                // Kill SDL's raw-touch fallback path and the browser's
                // compatibility mouse events for canvas touches; the pointer
                // handlers above are the single source of truth.
                ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(
                    function(type) {
                        canvas.addEventListener(type, function(e) {
                            e.stopImmediatePropagation();
                            if (e.cancelable) {
                                e.preventDefault();
                            }
                        }, { capture: true });
                    });
            })();

            function tcSetKey(key, down) {
                var fn = bridge('openglad_web_touch_set_key');
                if (fn) {
                    fn(0, key, down ? 1 : 0);
                }
            }

            function tcBack(down) {
                var fn = bridge('openglad_web_back_key');
                if (fn) {
                    fn(down ? 1 : 0);
                }
            }

            function tcPushKey(keycode, down) {
                var fn = bridge('openglad_web_push_key');
                if (fn) {
                    fn(keycode, down ? 1 : 0);
                }
            }

            function tcClear() {
                var fn = bridge('openglad_web_touch_clear');
                if (fn) {
                    fn();
                }
                for (var i = 0; i < resetVisualFns.length; ++i) {
                    resetVisualFns[i]();
                }
            }

            // --- Floating 8-way joystick -------------------------------------
            (function initStick() {
                var STICK_RADIUS = 60;    // base circle radius (px)
                var DEAD_ZONE = 14;       // no direction inside this radius
                var FOLLOW_RADIUS = 90;   // base re-anchors past this drift
                var THUMB_TRAVEL = 46;
                var TAP_MAX_MS = 250;     // dead-zone quick tap => mouse click
                var OCTANT_TO_KEY = [
                    KEY.RIGHT, KEY.DOWN_RIGHT, KEY.DOWN, KEY.DOWN_LEFT,
                    KEY.LEFT, KEY.UP_LEFT, KEY.UP, KEY.UP_RIGHT
                ];

                var pointerId = null;
                var baseX = 0;
                var baseY = 0;
                var currentKey = -1;
                var movedOutOfDeadZone = false;
                var downAtMs = 0;
                var downClientX = 0;
                var downClientY = 0;

                function clearDirectionKeys() {
                    for (var k = 0; k <= 7; ++k) {
                        tcSetKey(k, 0);
                    }
                    currentKey = -1;
                }

                function positionBase() {
                    stickBase.style.left = (baseX - STICK_RADIUS) + 'px';
                    stickBase.style.top = (baseY - STICK_RADIUS) + 'px';
                }

                function positionThumb(dx, dy) {
                    var dist = Math.hypot(dx, dy);
                    var scale = dist > 0 ? Math.min(dist, THUMB_TRAVEL) / dist : 0;
                    stickThumb.style.transform =
                        'translate(' + (dx * scale) + 'px,' + (dy * scale) + 'px)';
                }

                function update(x, y) {
                    var dx = x - baseX;
                    var dy = y - baseY;
                    var dist = Math.hypot(dx, dy);
                    if (dist > FOLLOW_RADIUS) {
                        var pull = (dist - FOLLOW_RADIUS) / dist;
                        baseX += dx * pull;
                        baseY += dy * pull;
                        dx = x - baseX;
                        dy = y - baseY;
                        dist = FOLLOW_RADIUS;
                        positionBase();
                    }
                    positionThumb(dx, dy);
                    if (dist < DEAD_ZONE) {
                        if (currentKey !== -1) {
                            clearDirectionKeys();
                        }
                        return;
                    }
                    movedOutOfDeadZone = true;
                    // 8 sectors of 45 degrees centered on the cardinals;
                    // octant 0 = screen-right, winding clockwise (+y down).
                    var octant = Math.round(Math.atan2(dy, dx) / (Math.PI / 4));
                    octant = ((octant % 8) + 8) % 8;
                    var key = OCTANT_TO_KEY[octant];
                    if (key !== currentKey) {
                        clearDirectionKeys();
                        tcSetKey(key, 1);
                        currentKey = key;
                    }
                }

                stickZone.addEventListener('pointerdown', function(e) {
                    if (pointerId !== null) {
                        return;
                    }
                    pointerId = e.pointerId;
                    baseX = e.clientX;
                    baseY = e.clientY;
                    downAtMs = performance.now();
                    downClientX = e.clientX;
                    downClientY = e.clientY;
                    movedOutOfDeadZone = false;
                    positionBase();
                    positionThumb(0, 0);
                    stickBase.classList.remove('hidden');
                    try {
                        stickZone.setPointerCapture(e.pointerId);
                    } catch (err) {
                        // Synthetic pointers (tests) cannot be captured.
                    }
                    update(e.clientX, e.clientY);
                    e.preventDefault();
                });

                stickZone.addEventListener('pointermove', function(e) {
                    if (e.pointerId === pointerId) {
                        update(e.clientX, e.clientY);
                    }
                });

                function forwardDeadZoneTap() {
                    // A quick tap that never produced a direction is
                    // forwarded to SDL as a left click at canvas-logical
                    // coordinates, keeping in-gameplay dialogs (Abort
                    // Mission YES/NO) tappable under the stick zone.
                    var fn = bridge('openglad_web_push_mouse');
                    if (!fn) {
                        return;
                    }
                    var rect = canvas.getBoundingClientRect();
                    var x = Math.round(downClientX - rect.left);
                    var y = Math.round(downClientY - rect.top);
                    if (x < 0 || y < 0 || x >= rect.width || y >= rect.height) {
                        return;
                    }
                    var cssW = Math.round(rect.width);
                    var cssH = Math.round(rect.height);
                    fn(1, x, y, cssW, cssH);
                    setTimeout(function() {
                        fn(0, x, y, cssW, cssH);
                    }, 60);
                }

                function release(e) {
                    if (e.pointerId !== pointerId) {
                        return;
                    }
                    pointerId = null;
                    clearDirectionKeys();
                    stickBase.classList.add('hidden');
                    if (e.type === 'pointerup' && !movedOutOfDeadZone &&
                        (performance.now() - downAtMs) <= TAP_MAX_MS) {
                        forwardDeadZoneTap();
                    }
                }

                stickZone.addEventListener('pointerup', release);
                stickZone.addEventListener('pointercancel', release);

                resetVisualFns.push(function() {
                    pointerId = null;
                    currentKey = -1;
                    stickBase.classList.add('hidden');
                });
            })();

            // --- Buttons ------------------------------------------------------
            // Held keys keep a minimum 90ms down-time so the ~12Hz input
            // sampler always observes the press edge, even on fast taps.
            function bindHeldButton(el, setter) {
                var pointerId = null;
                var downAtMs = 0;
                var releaseTimer = null;

                function applyRelease() {
                    releaseTimer = null;
                    el.classList.remove('tc-pressed');
                    setter(0);
                }

                el.addEventListener('pointerdown', function(e) {
                    if (pointerId !== null) {
                        return;
                    }
                    pointerId = e.pointerId;
                    if (releaseTimer !== null) {
                        clearTimeout(releaseTimer);
                        releaseTimer = null;
                    }
                    downAtMs = performance.now();
                    el.classList.add('tc-pressed');
                    setter(1);
                    try {
                        el.setPointerCapture(e.pointerId);
                    } catch (err) {
                        // Synthetic pointers (tests) cannot be captured.
                    }
                    e.preventDefault();
                });

                function release(e) {
                    if (e.pointerId !== pointerId) {
                        return;
                    }
                    pointerId = null;
                    var heldMs = performance.now() - downAtMs;
                    if (heldMs >= TC_MIN_HOLD_MS) {
                        applyRelease();
                    } else {
                        releaseTimer = setTimeout(applyRelease,
                            TC_MIN_HOLD_MS - heldMs);
                    }
                }

                el.addEventListener('pointerup', release);
                el.addEventListener('pointercancel', release);

                resetVisualFns.push(function() {
                    pointerId = null;
                    if (releaseTimer !== null) {
                        clearTimeout(releaseTimer);
                        releaseTimer = null;
                    }
                    el.classList.remove('tc-pressed');
                });
            }

            function bindLatchButton(el, key) {
                var latched = false;
                el.addEventListener('pointerdown', function(e) {
                    latched = !latched;
                    el.classList.toggle('tc-latched', latched);
                    tcSetKey(key, latched ? 1 : 0);
                    e.preventDefault();
                });
                resetVisualFns.push(function() {
                    latched = false;
                    el.classList.remove('tc-latched');
                });
            }

            function keySetter(key) {
                return function(down) {
                    tcSetKey(key, down);
                };
            }

            bindHeldButton(document.getElementById('tc-fire'), keySetter(KEY.FIRE));
            bindHeldButton(document.getElementById('tc-special'), keySetter(KEY.SPECIAL));
            bindHeldButton(document.getElementById('tc-cycle'), keySetter(KEY.SPECIAL_SWITCH));
            bindHeldButton(document.getElementById('tc-yell'), keySetter(KEY.YELL));
            bindHeldButton(document.getElementById('tc-switch'), keySetter(KEY.SWITCH));
            bindHeldButton(document.getElementById('tc-look'), keySetter(KEY.LOOKUP));
            bindLatchButton(document.getElementById('tc-alt'), KEY.SHIFTER);
            bindHeldButton(backButton, function(down) {
                tcBack(down);
            });

            // --- Enable/disable + game-state gating --------------------------
            function setActive(on) {
                if (active === on) {
                    return;
                }
                active = on;
                overlay.classList.toggle('tc-active', on);
                if (!on) {
                    tcClear();
                    var fn = bridge('openglad_web_touch_enable');
                    if (fn) {
                        fn(0);
                    }
                    enableAcked = false;
                }
            }

            function overlayTick() {
                var state = window.__opengladGameState;
                setActive(shouldEnable());

                if (active && !enableAcked) {
                    var fn = bridge('openglad_web_touch_enable');
                    // Retries until the game session exists (returns 1).
                    if (fn && fn(1) === 1) {
                        enableAcked = true;
                    }
                }

                var runtimeReady = window.__opengladWebBootstrap &&
                    window.__opengladWebBootstrap.runtimeInitialized;
                var inGame = state === 2;
                gameCluster.classList.toggle('tc-show', active && inGame);
                // During the Asyncify-blocked picker the published state can
                // stay null; BACK is useful (and harmless) in every pre-quit
                // state, so gate it only on boot + not-quit.
                var showBack = active && runtimeReady && state !== 3;
                backButton.classList.toggle('hidden', !showBack);
                toggleButton.classList.toggle('hidden',
                    !(isTouchDevice() || sawTouchPointer || readPref() !== 'auto'));

                if (wasInGame && !inGame) {
                    // Leaving gameplay: drop held keys and the ALT latch.
                    tcClear();
                }
                wasInGame = inGame;
                updateRotateHint();
            }

            toggleButton.addEventListener('click', function() {
                writePref(shouldEnable() ? 'off' : 'on');
                overlayTick();
            });
            toggleButton.addEventListener('keydown', function(e) {
                e.stopPropagation();
            });
            toggleButton.addEventListener('keyup', function(e) {
                e.stopPropagation();
            });

            // Convertibles: a real touch on a device that failed the boot-time
            // media queries still activates the overlay.
            document.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'touch' && !sawTouchPointer) {
                    sawTouchPointer = true;
                    overlayTick();
                }
            }, { capture: true, passive: true });

            // Never leave keys held when the page loses the user.
            window.addEventListener('pagehide', tcClear);
            window.addEventListener('blur', tcClear);
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    tcClear();
                }
            });

            // --- Portrait rotate hint ----------------------------------------
            var rotateHint = document.getElementById('og-rotate-hint');
            var rotateDismissed = false;
            try {
                rotateDismissed =
                    sessionStorage.getItem('openglad.rotateHintDismissed') === '1';
            } catch (e) {
                rotateDismissed = false;
            }

            function updateRotateHint() {
                var portrait = typeof window.matchMedia === 'function' &&
                    window.matchMedia('(orientation: portrait)').matches;
                rotateHint.classList.toggle('hidden',
                    !(active && portrait && !rotateDismissed));
            }

            document.getElementById('og-rotate-dismiss')
                .addEventListener('click', function() {
                    rotateDismissed = true;
                    try {
                        sessionStorage.setItem('openglad.rotateHintDismissed', '1');
                    } catch (e) {
                        // Session-only dismissal still applies.
                    }
                    updateRotateHint();
                });

            // --- Text-entry overlay ------------------------------------------
            // start_text_input()/stop_text_input() dispatch
            // 'openglad-text-input' (native_input.cpp). Only touch sessions
            // show the DOM input; desktop browsers keep typing into the
            // canvas. iOS only summons its keyboard from a trusted tap on the
            // input itself (Asyncify breaks the gesture chain), hence the
            // TAP TO TYPE placeholder rather than programmatic focus.
            (function initTextEntry() {
                var wrap = document.getElementById('og-text-entry-wrap');
                var input = document.getElementById('og-text-entry');
                var clearButton = document.getElementById('og-text-entry-clear');
                var lastValue = '';

                function pushBackspaces(count) {
                    for (var i = 0; i < count; ++i) {
                        tcPushKey(SDLK_BACKSPACE, 1);
                        tcPushKey(SDLK_BACKSPACE, 0);
                    }
                }

                function pushText(str) {
                    if (!str) {
                        return;
                    }
                    if (typeof Module.ccall === 'function') {
                        Module.ccall('openglad_web_push_text', null,
                            ['string'], [str]);
                        return;
                    }
                    var fn = bridge('openglad_web_push_char');
                    if (!fn) {
                        return;
                    }
                    var points = Array.from(str);
                    for (var i = 0; i < points.length; ++i) {
                        fn(points[i].codePointAt(0));
                    }
                }

                function pushReturn() {
                    tcPushKey(SDLK_RETURN, 1);
                    tcPushKey(SDLK_RETURN, 0);
                }

                window.addEventListener('openglad-text-input', function(e) {
                    var on = Boolean(e.detail && e.detail.active);
                    if (on && active) {
                        input.value = '';
                        lastValue = '';
                        wrap.classList.remove('hidden');
                    } else {
                        wrap.classList.add('hidden');
                        input.blur();
                    }
                });

                input.addEventListener('input', function() {
                    // Forward the diff: common prefix, then deletions as
                    // Backspaces and insertions as text events.
                    var prev = Array.from(lastValue);
                    var cur = Array.from(input.value);
                    var common = 0;
                    while (common < prev.length && common < cur.length &&
                           prev[common] === cur[common]) {
                        ++common;
                    }
                    pushBackspaces(prev.length - common);
                    pushText(cur.slice(common).join(''));
                    lastValue = input.value;
                });

                ['keydown', 'keyup', 'keypress'].forEach(function(type) {
                    input.addEventListener(type, function(e) {
                        // SDL must never double-see keys meant for the field.
                        e.stopPropagation();
                        if (type === 'keydown' &&
                            (e.key === 'Enter' || e.keyCode === 13)) {
                            e.preventDefault();
                            pushReturn();
                            input.blur();
                        }
                    });
                });

                clearButton.addEventListener('click', function() {
                    // Escape is swallowed on web, so "cancel" commits an
                    // emptied field instead (same reality as a desktop web
                    // keyboard user today).
                    pushBackspaces(Array.from(lastValue).length);
                    lastValue = '';
                    input.value = '';
                    pushReturn();
                });
            })();

            var orientationQuery = typeof window.matchMedia === 'function'
                ? window.matchMedia('(orientation: portrait)') : null;
            if (orientationQuery && typeof orientationQuery.addEventListener === 'function') {
                orientationQuery.addEventListener('change', updateRotateHint);
            }

            setInterval(overlayTick, 250);
            overlayTick();
        })();

        window.onerror = function(message) {
            loadingText.textContent = 'Error: ' + message;
            loadingBar.style.background = '#f44';
            console.error(message);
        };
    </script>
