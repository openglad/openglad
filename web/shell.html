<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Openglad">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Openglad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #000;
        }

        body {
            /* iOS Safari hardening: pin the page so letterbox-area touches
               cannot rubber-band scroll or shift the layout viewport. */
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background-color: #000;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @supports (height: 100dvh) {
            #game-container {
                height: 100dvh;
            }
        }

        #canvas {
            display: block;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background-color: #000;
        }

        #fullscreen-button {
            position: fixed;
            top: max(8px, env(safe-area-inset-top, 0px));
            right: max(8px, env(safe-area-inset-right, 0px));
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 4px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            cursor: pointer;
        }

        #fullscreen-button:hover {
            background: rgba(40, 40, 40, 0.9);
        }

        #fullscreen-button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        #fullscreen-button svg {
            width: 22px;
            height: 22px;
            pointer-events: none;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 16px;
        }

        #loading-progress {
            width: 200px;
            height: 4px;
            background: #333;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }

        #loading-bar {
            width: 0%;
            height: 100%;
            background: #fff;
            transition: width 0.2s;
        }

        #firefox-ctrl-note {
            max-width: 320px;
            margin-top: 14px;
            font-size: 12px;
            line-height: 1.4;
            color: #d9c48a;
        }

        .hidden {
            display: none !important;
        }

        /* ------------------------------------------------------------------
           Touch controls overlay (runtime-gated: touch devices only).
           Container swallows nothing (pointer-events: none); each control
           re-enables pointer events, so overlay touches never reach SDL's
           canvas handlers. Safe-area insets keep controls off the notch.
           ------------------------------------------------------------------ */
        #touch-controls {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: none;
            pointer-events: none;
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #touch-controls.tc-active {
            display: block;
        }

        #tc-game {
            display: none;
        }

        #tc-game.tc-show {
            display: block;
        }

        .tc-control {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0.35;
            font-size: 11px;
            letter-spacing: 0.05em;
        }

        .tc-control.tc-pressed,
        .tc-control.tc-latched {
            opacity: 0.65;
            background: rgba(110, 110, 110, 0.6);
        }

        .tc-control.tc-latched {
            border-color: #ff0;
            color: #ff0;
        }

        #tc-stick-zone {
            position: absolute;
            left: max(8px, env(safe-area-inset-left, 0px));
            bottom: max(8px, env(safe-area-inset-bottom, 0px));
            width: 45%;
            height: 70%;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #tc-stick-base {
            position: fixed;
            width: 120px;
            height: 120px;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.25);
            opacity: 0.5;
            pointer-events: none;
        }

        #tc-stick-thumb {
            position: absolute;
            left: 32px;
            top: 32px;
            width: 56px;
            height: 56px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            background: rgba(160, 160, 160, 0.55);
        }

        #tc-fire {
            width: 72px;
            height: 72px;
            right: max(12px, env(safe-area-inset-right, 0px));
            bottom: max(12px, env(safe-area-inset-bottom, 0px));
        }

        #tc-special {
            width: 60px;
            height: 60px;
            right: calc(max(12px, env(safe-area-inset-right, 0px)) + 84px);
            bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 44px);
        }

        #tc-row {
            position: absolute;
            top: max(12px, env(safe-area-inset-top, 0px));
            right: calc(max(12px, env(safe-area-inset-right, 0px)) + 56px);
            display: flex;
            gap: 8px;
            pointer-events: none;
        }

        #tc-row .tc-control {
            position: static;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 10px;
        }

        #tc-back {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            top: max(12px, env(safe-area-inset-top, 0px));
            left: max(12px, env(safe-area-inset-left, 0px));
        }

        #tc-toggle {
            position: fixed;
            top: calc(max(8px, env(safe-area-inset-top, 0px)) + 52px);
            right: max(8px, env(safe-area-inset-right, 0px));
            width: 44px;
            height: 44px;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            font-size: 20px;
            opacity: 0.5;
            cursor: pointer;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Portrait gameplay gets the same full-viewport world canvas as
           landscape. Keep the virtual stick and action clusters in the
           lower corners so they do not cover the tall-layout HUD at the top. */
        @media (orientation: portrait) {
            #tc-stick-zone {
                width: 58%;
                height: 48%;
            }

            #tc-stick-base {
                width: 108px;
                height: 108px;
            }

            #tc-stick-thumb {
                left: 29px;
                top: 29px;
                width: 50px;
                height: 50px;
            }

            #tc-fire {
                width: 72px;
                height: 72px;
            }

            #tc-special {
                right: calc(max(12px, env(safe-area-inset-right, 0px)) + 82px);
                bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 30px);
            }

            #tc-row {
                top: auto;
                right: max(12px, env(safe-area-inset-right, 0px));
                bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 120px);
                display: grid;
                grid-template-columns: repeat(2, 42px);
                gap: 6px;
            }

            #tc-row .tc-control {
                width: 42px;
                height: 42px;
            }
        }

        /* Touch text-entry overlay: SDL3's emscripten backend has no screen
           keyboard, so prompts get a real DOM input on touch devices. */
        #og-text-entry-wrap {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #og-text-entry {
            width: min(280px, 60vw);
            height: 40px;
            padding: 0 10px;
            font-size: 16px; /* >=16px stops iOS auto-zoom on focus */
            /* Room codes: monospace + spacing keep 0/O and 1/I readable. */
            font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
            letter-spacing: 1px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 6px;
        }

        /* iOS only summons its keyboard from a gesture; until the input is
           focused, pulse it so "tap here to type" is unmissable. */
        #og-text-entry:not(:focus) {
            animation: og-entry-pulse 1.2s ease-in-out infinite;
        }

        @keyframes og-entry-pulse {
            0%, 100% {
                border-color: rgba(255, 255, 255, 0.8);
                box-shadow: none;
            }
            50% {
                border-color: #ffd24d;
                box-shadow: 0 0 10px rgba(255, 210, 77, 0.9);
            }
        }

        #og-text-entry-cancel {
            height: 40px;
            padding: 0 10px;
            color: #fff;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 6px;
            font-size: 14px;
            font-family: Arial, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
        }

    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="320" height="200" oncontextmenu="event.preventDefault()" tabindex="-1" aria-label="Openglad game canvas"></canvas>
    </div>

    <button id="fullscreen-button" class="hidden" type="button" aria-label="Enter fullscreen" aria-controls="game-container" title="Enter fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/>
        </svg>
    </button>
    <p id="fullscreen-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <div id="touch-controls">
        <div id="tc-game">
            <div id="tc-stick-zone">
                <div id="tc-stick-base" class="hidden">
                    <div id="tc-stick-thumb"></div>
                </div>
            </div>
            <div id="tc-special" class="tc-control">SPC</div>
            <div id="tc-fire" class="tc-control">FIRE</div>
            <div id="tc-row">
                <div id="tc-look" class="tc-control">LOOK</div>
                <div id="tc-switch" class="tc-control">CHAR</div>
                <div id="tc-yell" class="tc-control">YELL</div>
                <div id="tc-alt" class="tc-control">ALT</div>
                <div id="tc-cycle" class="tc-control">SP+</div>
            </div>
        </div>
        <div id="tc-back" class="tc-control hidden">BACK</div>
    </div>
    <button id="tc-toggle" class="hidden" type="button" aria-label="Toggle touch controls" title="Toggle touch controls">&#127918;</button>

    <div id="og-text-entry-wrap" class="hidden">
        <input id="og-text-entry" type="text" placeholder="TAP HERE TO TYPE"
               autocomplete="off" autocorrect="off" spellcheck="false"
               enterkeyhint="done"
               aria-label="Text entry">
        <button id="og-text-entry-cancel" type="button" aria-label="Cancel text entry">CANCEL</button>
    </div>

    <div id="loading">
        <div id="loading-spinner"></div>
        <div id="loading-text">Loading...</div>
        <div id="loading-progress">
            <div id="loading-bar"></div>
        </div>
        <!-- Installed-PWA and bookmarked players start here (manifest
             start_url is play.html) and never see the landing-page browser
             warning; give them the one-sentence version while loading. -->
        <div id="firefox-ctrl-note" hidden>
            Firefox reserves Ctrl+W (closes this tab), so the browser
            defaults use Z to attack and X for specials &mdash; avoid
            rebinding attack to Ctrl.
        </div>
    </div>

    <script>
        var canvas = document.getElementById('canvas');
        var loadingElement = document.getElementById('loading');
        var loadingText = document.getElementById('loading-text');
        var loadingBar = document.getElementById('loading-bar');
        var fullscreenButton = document.getElementById('fullscreen-button');
        var fullscreenStatus = document.getElementById('fullscreen-status');
        var fullscreenTarget = document.documentElement;
        var fullscreenControlReady = false;

        // Same predicate as the landing page's isCtrlReservedBrowser():
        // Firefox delivers the windowed Ctrl+W keydown to the page and closes
        // the tab anyway, so consuming it would take the fullscreen keyboard
        // lock this game deliberately does not use.
        if (/(?:Firefox|FxiOS)\//.test(navigator.userAgent)) {
            document.getElementById('firefox-ctrl-note').hidden = false;
        }

        function currentFullscreenElement() {
            return document.fullscreenElement ||
                document.webkitFullscreenElement || null;
        }

        function fullscreenAvailable() {
            var standard = document.fullscreenEnabled !== false &&
                typeof fullscreenTarget.requestFullscreen === 'function';
            var webkit = document.webkitFullscreenEnabled !== false &&
                typeof fullscreenTarget.webkitRequestFullscreen === 'function';
            return standard || webkit;
        }

        function requestAppFullscreen() {
            if (typeof fullscreenTarget.requestFullscreen === 'function') {
                return fullscreenTarget.requestFullscreen();
            }
            if (typeof fullscreenTarget.webkitRequestFullscreen === 'function') {
                return fullscreenTarget.webkitRequestFullscreen();
            }
            return null;
        }

        function updateFullscreenButton() {
            var showButton = fullscreenControlReady && fullscreenAvailable() &&
                currentFullscreenElement() === null;
            fullscreenButton.classList.toggle('hidden', !showButton);
        }

        // The game never uses Escape on web: Backspace is the universal
        // back/cancel key (remapped in the engine), so browser-reserved
        // Escape exits fullscreen without any in-game side effect. No
        // Keyboard Lock is needed.
        function handleFullscreenControlChange() {
            updateFullscreenButton();
            if (currentFullscreenElement() === fullscreenTarget) {
                fullscreenStatus.textContent =
                    'Fullscreen active. Backspace is the in-game back key; Escape leaves fullscreen.';
                canvas.focus({preventScroll: true});
            } else {
                fullscreenStatus.textContent = '';
            }
        }

        function reportFullscreenFailure(error) {
            console.warn('Unable to enter fullscreen:', error);
            fullscreenStatus.textContent =
                'Fullscreen could not be opened. Please try again or use your browser fullscreen control.';
            fullscreenButton.focus({preventScroll: true});
        }

        fullscreenButton.addEventListener('click', function() {
            fullscreenStatus.textContent = '';
            if (!fullscreenAvailable() || currentFullscreenElement() !== null) {
                canvas.focus({preventScroll: true});
                return;
            }

            // Keep this call directly in the trusted click handler: browsers
            // reject Fullscreen API requests after user activation expires.
            // Fullscreen the whole app, not just the canvas: touch controls,
            // text entry, and status UI are sibling elements and must remain
            // visible inside the fullscreen subtree.
            var request;
            try {
                request = requestAppFullscreen();
            } catch (error) {
                reportFullscreenFailure(error);
                return;
            }
            if (request && typeof request.then === 'function') {
                request.then(function() {
                    // Status text is owned by the fullscreenchange handler.
                    canvas.focus({preventScroll: true});
                }).catch(reportFullscreenFailure);
            } else {
                // Legacy webkitRequestFullscreen() returns undefined. Its
                // fullscreenchange event will confirm success; restore game
                // focus now so the DOM button cannot keep keyboard input.
                canvas.focus({preventScroll: true});
            }
        });
        // Keep keyboard activation of the DOM control out of SDL's game-key
        // listeners. Do not prevent the native Enter/Space click action.
        fullscreenButton.addEventListener('keydown', function(event) {
            event.stopPropagation();
        });
        fullscreenButton.addEventListener('keyup', function(event) {
            event.stopPropagation();
        });
        document.addEventListener('fullscreenchange', handleFullscreenControlChange);
        document.addEventListener('webkitfullscreenchange',
            handleFullscreenControlChange);

        // ------------------------------------------------------------------
        // WebGL context loss/restore (iPad task-switch survival).
        //
        // preventDefault() promises the browser this page handles restoration
        // itself — that is what allows 'webglcontextrestored' to fire at all.
        // The wasm side only sets a pending flag from the restored
        // notification (ASYNCIFY re-entrancy: no GL work may run inside a
        // browser event callback) and rebuilds its renderer and textures at
        // the next present; canvas content self-heals because every present
        // re-uploads the CPU-side canvases. If the browser never restores the
        // context (Safari can discard it for good), the watchdog reloads the
        // page: saves live in IDBFS via autosave, so a reload resumes from
        // the base camp without losing progress.
        // ------------------------------------------------------------------
        var contextRestoreWatchdog = null;
        var contextRestoreWatchdogMs =
            window.__opengladContextRestoreWatchdogMs || 10000;
        window.__opengladContextLossState = {
            lostEvents: 0,
            restoredEvents: 0,
            notifyCalls: 0,
            reloadFallbacks: 0
        };

        canvas.addEventListener('webglcontextlost', function(e) {
            e.preventDefault();
            window.__opengladContextLossState.lostEvents += 1;
            loadingText.textContent = 'RESTORING GRAPHICS…';
            loadingBar.style.width = '0%';
            loadingElement.classList.remove('hidden');
            if (contextRestoreWatchdog === null) {
                contextRestoreWatchdog = setTimeout(function() {
                    contextRestoreWatchdog = null;
                    window.__opengladContextLossState.reloadFallbacks += 1;
                    window.location.reload();
                }, contextRestoreWatchdogMs);
            }
        }, false);

        canvas.addEventListener('webglcontextrestored', function() {
            window.__opengladContextLossState.restoredEvents += 1;
            if (contextRestoreWatchdog !== null) {
                clearTimeout(contextRestoreWatchdog);
                contextRestoreWatchdog = null;
            }
            if (typeof Module !== 'undefined' &&
                typeof Module._openglad_web_notify_context_restored === 'function') {
                window.__opengladContextLossState.notifyCalls += 1;
                Module._openglad_web_notify_context_restored();
            }
            loadingElement.classList.add('hidden');
        }, false);

        // Ensure canvas gets focus on click (important for keyboard input)
        canvas.addEventListener('click', function() {
            canvas.focus();
        });

        // WebKit-only pinch gesture events zoom the page even with
        // touch-action: none on the canvas; suppress them globally.
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });

        // iOS Safari reports toolbar collapse/expand and keyboard geometry
        // through visualViewport, not window 'resize'; prefer it when present.
        function viewportSize() {
            var vv = window.visualViewport;
            if (vv && vv.width > 0 && vv.height > 0) {
                return { width: vv.width, height: vv.height };
            }
            return { width: window.innerWidth, height: window.innerHeight };
        }

        // Give SDL the full usable browser viewport. The engine presents its
        // fixed 320x200 intro/menus through a centered aspect-fit rectangle,
        // while gameplay expands its World and HUD canvases to this live
        // aspect (including tall portrait windows) without distortion.
        function resizeCanvas() {
            var viewport = viewportSize();
            var windowWidth = viewport.width;
            var windowHeight = viewport.height;
            canvas.style.width = Math.max(1, Math.floor(windowWidth)) + 'px';
            canvas.style.height = Math.max(1, Math.floor(windowHeight)) + 'px';
        }

        window.addEventListener('resize', resizeCanvas);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', resizeCanvas);
        }
        resizeCanvas(); // Initial sizing
        window.__opengladWebBootstrap = {
            runtimeInitialized: false,
            bootFunctionAvailable: false,
            bootCalls: 0
        };
        window.__opengladGameState = null;

        function installPostBootCanvasRecovery() {
            var canvasWasFullscreen =
                currentFullscreenElement() === fullscreenTarget;
            function recoverCanvasBacking() {
                resizeCanvas();
                if (typeof Module._openglad_web_restore_canvas_backing === 'function') {
                    var rect = canvas.getBoundingClientRect();
                    Module._openglad_web_restore_canvas_backing(
                        Math.max(1, Math.round(rect.width)),
                        Math.max(1, Math.round(rect.height)));
                }
            }

            // Registered after SDL has booted so this runs after SDL3's own
            // resize/fullscreen listeners and repairs its fullscreen-exit race.
            window.addEventListener('resize', recoverCanvasBacking);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', recoverCanvasBacking);
            }
            document.addEventListener('fullscreenchange', function() {
                var canvasIsFullscreen =
                    currentFullscreenElement() === fullscreenTarget;
                var exitedCanvasFullscreen = canvasWasFullscreen && !canvasIsFullscreen;
                canvasWasFullscreen = canvasIsFullscreen;
                recoverCanvasBacking();
                if (exitedCanvasFullscreen) {
                    requestAnimationFrame(function() {
                        canvas.focus({preventScroll: true});
                    });
                }
            });
            document.addEventListener('webkitfullscreenchange', function() {
                var canvasIsFullscreen =
                    currentFullscreenElement() === fullscreenTarget;
                var exitedCanvasFullscreen = canvasWasFullscreen && !canvasIsFullscreen;
                canvasWasFullscreen = canvasIsFullscreen;
                recoverCanvasBacking();
                if (exitedCanvasFullscreen) {
                    requestAnimationFrame(function() {
                        canvas.focus({preventScroll: true});
                    });
                }
            });
        }

        var Module = {
            canvas: canvas,

            setStatus: function(text) {
                if (!text) {
                    // Loading complete
                    loadingElement.classList.add('hidden');
                    canvas.focus();
                    return;
                }

                // Parse progress if available
                var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (match) {
                    var progress = (parseInt(match[2]) / parseInt(match[4])) * 100;
                    loadingBar.style.width = progress + '%';
                    loadingText.textContent = match[1].trim() || 'Loading...';
                } else {
                    loadingText.textContent = text;
                }
            },

            totalDependencies: 0,

            monitorRunDependencies: function(remaining) {
                this.totalDependencies = Math.max(this.totalDependencies, remaining);
                if (remaining) {
                    Module.setStatus('Loading... (' + (this.totalDependencies - remaining) + '/' + this.totalDependencies + ')');
                } else {
                    Module.setStatus('');
                }
            },

            onRuntimeInitialized: function() {
                resizeCanvas();
                window.__opengladWebBootstrap.runtimeInitialized = true;
                window.__opengladWebBootstrap.bootFunctionAvailable =
                    typeof Module._openglad_web_boot === 'function';
                if (typeof Module._openglad_web_boot === 'function') {
                    window.__opengladWebBootstrap.bootCalls += 1;
                    Module._openglad_web_boot();
                    installPostBootCanvasRecovery();
                    fullscreenControlReady = true;
                    updateFullscreenButton();
                } else {
                    console.error('OpenGlad web bootstrap export is unavailable');
                }
            }
        };

        Module.setStatus('Loading...');

        // iOS in-gesture audio unlock: SDL3's emscripten backend resumes a
        // suspended AudioContext from a silence-timer poll, i.e. OUTSIDE any
        // user-gesture handler, which iOS Safari rejects. Resume it here from

                return function(down) {
                    tcSetKey(key, down);
                };
            }

            bindHeldButton(document.getElementById('tc-fire'), keySetter(KEY.FIRE));
            bindHeldButton(document.getElementById('tc-special'), keySetter(KEY.SPECIAL));
            bindHeldButton(document.getElementById('tc-cycle'), keySetter(KEY.SPECIAL_SWITCH));
            bindHeldButton(document.getElementById('tc-yell'), keySetter(KEY.YELL));
            bindHeldButton(document.getElementById('tc-switch'), keySetter(KEY.SWITCH));
            bindHeldButton(document.getElementById('tc-look'), keySetter(KEY.LOOKUP));
            bindLatchButton(document.getElementById('tc-alt'), KEY.SHIFTER);
            bindHeldButton(backButton, function(down) {
                tcBack(down);
            });

            // --- Enable/disable + game-state gating --------------------------
            function setActive(on) {
                if (active === on) {
                    return;
                }
                active = on;
                overlay.classList.toggle('tc-active', on);
                if (!on) {
                    tcClear();
                    var fn = bridge('openglad_web_touch_enable');
                    if (fn) {
                        fn(0);
                    }
                    enableAcked = false;
                }
            }

            function overlayTick() {
                var state = window.__opengladGameState;
                setActive(shouldEnable());

                if (active && !enableAcked) {
                    var fn = bridge('openglad_web_touch_enable');
                    // Retries until the game session exists (returns 1).
                    if (fn && fn(1) === 1) {
                        enableAcked = true;
                    }
                }

                // The seat cap is read from menus that can open before the
                // module is ready, so keep retrying until the export exists
                // and resend whenever the classification changes. A build
                // without the export stays on the desktop cap.
                var seatFn = bridge('openglad_web_set_single_seat_device');
                if (seatFn) {
                    var singleSeat = phoneClassDevice() ? 1 : 0;
                    if (singleSeat !== singleSeatSent) {
                        seatFn(singleSeat);
                        singleSeatSent = singleSeat;
                    }
                }

                var runtimeReady = window.__opengladWebBootstrap &&
                    window.__opengladWebBootstrap.runtimeInitialized;
                var inGame = state === 2;
                gameCluster.classList.toggle('tc-show', active && inGame);
                // During the Asyncify-blocked picker the published state can
                // stay null; BACK is useful (and harmless) in every pre-quit
                // state, so gate it only on boot + not-quit.
                var showBack = active && runtimeReady && state !== 3;
                backButton.classList.toggle('hidden', !showBack);
                toggleButton.classList.toggle('hidden',
                    !(isTouchDevice() || sawTouchPointer || readPref() !== 'auto'));

                if (wasInGame && !inGame) {
                    // Leaving gameplay: drop held keys and the ALT latch.
                    tcClear();
                }
                wasInGame = inGame;
                if (textEntryRefresh) {
                    textEntryRefresh();
                }
            }

            toggleButton.addEventListener('click', function() {
                writePref(shouldEnable() ? 'off' : 'on');
                overlayTick();
            });
            toggleButton.addEventListener('keydown', function(e) {
                e.stopPropagation();
            });
            toggleButton.addEventListener('keyup', function(e) {
                e.stopPropagation();
            });

            // Convertibles: a real touch on a device that failed the boot-time
            // media queries still activates the overlay.
            document.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'touch' && !sawTouchPointer) {
                    sawTouchPointer = true;
                    overlayTick();
                }
            }, { capture: true, passive: true });

            // Never leave keys held when the page loses the user.
            window.addEventListener('pagehide', tcClear);
            window.addEventListener('blur', tcClear);
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                    tcClear();
                }
            });

            // --- Text-entry overlay ------------------------------------------
            // start_text_input()/stop_text_input() dispatch
            // 'openglad-text-input' (native_input.cpp). Only touch sessions
            // show the DOM input; desktop browsers keep typing into the
            // canvas. The prompt-opening C++ code runs outside the trusted
            // gesture, so real iOS needs one of two explicit affordances:
            // the pulsing TAP HERE TO TYPE input itself, and canvas taps
            // outside the shared ACCEPT/CANCEL footer
            // (textEntryFocusRedirect above).
            (function initTextEntry() {
                var wrap = document.getElementById('og-text-entry-wrap');
                var input = document.getElementById('og-text-entry');
                var cancelButton =
                    document.getElementById('og-text-entry-cancel');
                // Fallback bound for the first-mutation buffer clear when a
                // prompt announces no maxBytes. Every engine prompt does
                // announce one, and that number is the tight bound, which
                // matters: pushed keys are drained one per prompt-loop
                // iteration (each a full redraw), so every excess event in
                // the burst delays the moment the player's typing shows up.
                var CLEAR_BUFFER_BACKSPACES = 100;
                var lastValue = '';
                var firstMutation = true;
                var composing = false;
                var promptActive = false;
                var promptDetail = {};
                var roomCodeMode = false;

                function utf8Length(value) {
                    return new TextEncoder().encode(value).length;
                }

                function truncateUtf8(value, maxBytes) {
                    if (maxBytes <= 0 || utf8Length(value) <= maxBytes) {
                        return value;
                    }
                    var result = '';
                    var points = Array.from(value);
                    for (var i = 0; i < points.length; ++i) {
                        if (utf8Length(result + points[i]) > maxBytes) {
                            break;
                        }
                        result += points[i];
                    }
                    return result;
                }

                function normalizeInput(value) {
                    var normalized = value;
                    if (roomCodeMode) {
                        normalized = normalized.toUpperCase()
                            .replace(/[^A-Z0-9-]/g, '');
                    }
                    return truncateUtf8(
                        normalized,
                        Math.max(0, Number(promptDetail.maxBytes) || 0));
                }

                function pushBackspaces(count) {
                    for (var i = 0; i < count; ++i) {
                        tcPushKey(SDLK_BACKSPACE, 1);
                        tcPushKey(SDLK_BACKSPACE, 0);
                    }
                }

                function pushText(str) {
                    if (!str) {
                        return;
                    }
                    if (typeof Module.ccall === 'function') {
                        Module.ccall('openglad_web_push_text', null,
                            ['string'], [str]);
                        return;
                    }
                    var fn = bridge('openglad_web_push_char');
                    if (!fn) {
                        return;
                    }
                    var points = Array.from(str);
                    for (var i = 0; i < points.length; ++i) {
                        fn(points[i].codePointAt(0));
                    }
                }

                function pushReturn() {
                    tcPushKey(SDLK_RETURN, 1);
                    tcPushKey(SDLK_RETURN, 0);
                }

                function focusInput() {
                    try {
                        // iOS quirk: re-focusing an already-focused input from
                        // a gesture does not (re)open the keyboard; a blur
                        // first makes the focus a fresh keyboard summon.
                        if (document.activeElement === input) {
                            input.blur();
                        }
                        input.focus({ preventScroll: true });
                    } catch (e) {
                        // Focus is best-effort; the input stays tappable.
                    }
                }

                // Canvas taps while the prompt is up focus the input from the
                // user's gesture (see ownCanvasTouch).
                textEntryFocusRedirect = function(canvasPoint) {
                    if (wrap.classList.contains('hidden')) {
                        return false;
                    }
                    // The shared C++ prompt owns its footer on the canvas.
                    // Let taps in that footer reach SDL; all other canvas
                    // taps retain the iOS keyboard-focus redirect. The UI is
                    // aspect-fitted inside the full-viewport canvas, so map
                    // the pointer back to the 320x200 reference grid first.
                    var rect = canvas.getBoundingClientRect();
                    var uiWidth = rect.width;
                    var uiHeight = rect.height;
                    var uiX = 0;
                    var uiY = 0;
                    if (uiWidth * 200 > uiHeight * 320) {
                        uiWidth = uiHeight * 320 / 200;
                        uiX = (rect.width - uiWidth) / 2;
                    } else {
                        uiHeight = uiWidth * 200 / 320;
                        uiY = (rect.height - uiHeight) / 2;
                    }
                    var gameX = (canvasPoint.x - uiX) * 320 / uiWidth;
                    var gameY = (canvasPoint.y - uiY) * 200 / uiHeight;
                    var footerTap = gameY >= 74 && gameY < 88 &&
                        ((gameX >= 58 && gameX < 139) ||
                         (gameX >= 151 && gameX < 232));
                    if (footerTap) {
                        return false;
                    }
                    focusInput();
                    return true;
                };

                function shouldShowPrompt() {
                    return promptActive && !Boolean(promptDetail.multiline) &&
                        (isTouchDevice() || sawTouchPointer);
                }

                textEntryRefresh = function() {
                    var show = shouldShowPrompt();
                    wrap.classList.toggle('hidden', !show);
                    if (!show) {
                        input.blur();
                    }
                };

                window.addEventListener('openglad-text-input', function(e) {
                    var on = Boolean(e.detail && e.detail.active);
                    promptActive = on;
                    promptDetail = on ? (e.detail || {}) : {};
                    // Lightweight diagnostics/test seam: unlike DOM
                    // visibility this also describes desktop prompts, where
                    // keyboard input stays canvas-native.
                    window.__opengladTextInputActive = on;
                    window.__opengladTextInputDetail = promptDetail;
                    if (on) {
                        roomCodeMode = /ROOM CODE/i.test(
                            String(promptDetail.prompt || ''));
                        input.setAttribute('autocapitalize',
                            roomCodeMode ? 'characters' : 'sentences');
                        input.placeholder = roomCodeMode
                            ? 'TAP TO ENTER ROOM CODE'
                            : 'TAP HERE TO TYPE';
                        input.maxLength = Math.max(
                            1, Number(promptDetail.maxBytes) || 99);
                        input.value = normalizeInput(
                            String(promptDetail.initialValue || ''));
                        lastValue = input.value;
                        firstMutation = true;
                        composing = false;
                        cancelButton.disabled = false;
                    } else {
                        roomCodeMode = false;
                    }
                    textEntryRefresh();
                });

                function reconcileInput() {
                    // A closed prompt accepts nothing: with text input off,
                    // the web back-key filter translates a pushed Backspace
                    // into Escape, so a stray late reconcile — the close-time
                    // blur can still fire a compositionend — would push a
                    // menu Escape instead of an edit.
                    if (!promptActive) {
                        return;
                    }
                    if (composing) {
                        return;
                    }
                    var normalized = normalizeInput(input.value);
                    if (normalized !== input.value) {
                        input.value = normalized;
                    }
                    // Forward the diff: common prefix, then deletions as
                    // Backspaces and insertions as text events. C++ selects
                    // a prefilled value until the first edit, so the first
                    // DOM mutation deliberately replaces the whole field.
                    // A hardware keyboard can have edited the C++ buffer
                    // while the field was unfocused, with no way to tell the
                    // field about it, so that replacement must clear the
                    // WHOLE buffer rather than one codepoint. C++ ignores a
                    // Backspace on an empty buffer, so the clear can be
                    // blind — but only up to maxBytes, which is exactly what
                    // the prompt can hold (see CLEAR_BUFFER_BACKSPACES).
                    // The blind clear costs up to maxBytes redraw iterations
                    // on that one edit, and is still preferred over counting
                    // the unfocused keystrokes: that count is fragile under
                    // IME, where one buffer edit is not one keystroke.
                    var prev = Array.from(lastValue);
                    var cur = Array.from(normalized);
                    if (firstMutation) {
                        var maxBytes = Number(promptDetail.maxBytes) || 0;
                        pushBackspaces(Math.max(
                            prev.length,
                            maxBytes > 0 ? maxBytes : CLEAR_BUFFER_BACKSPACES));
                        pushText(cur.join(''));
                        firstMutation = false;
                        lastValue = normalized;
                        return;
                    }
                    var common = 0;
                    while (common < prev.length && common < cur.length &&
                           prev[common] === cur[common]) {
                        ++common;
                    }
                    pushBackspaces(prev.length - common);
                    pushText(cur.slice(common).join(''));
                    lastValue = normalized;
                }

                input.addEventListener('input', reconcileInput);
                input.addEventListener('compositionstart', function() {
                    composing = true;
                });
                input.addEventListener('compositionend', function() {
                    composing = false;
                    reconcileInput();
                });
                input.addEventListener('blur', function() {
                    // Physical keys typed while the field is unfocused edit
                    // the C++ buffer with no way to tell the field about it,
                    // exactly as before the field's first edit — so every
                    // refocus-then-edit must whole-replace again rather than
                    // diff against a lastValue the buffer no longer matches.
                    if (promptActive) {
                        firstMutation = true;
                    }
                });
                input.addEventListener('pointerdown', function(e) {
                    if (e.pointerType === 'touch' && promptActive &&
                        document.activeElement !== input) {
                        // Keep the focus call in the trusted gesture, but let
                        // the browser's default handler place the caret.
                        focusInput();
                    }
                });

                ['keydown', 'keyup', 'keypress'].forEach(function(type) {
                    input.addEventListener(type, function(e) {
                        // SDL must never double-see keys meant for the field.
                        e.stopPropagation();
                        if (type === 'keydown' &&
                            (e.key === 'Enter' || e.keyCode === 13)) {
                            e.preventDefault();
                            pushReturn();
                            input.blur();
                        }
                    });
                });

                cancelButton.addEventListener('click', function() {
                    // Real cancel semantics: openglad_web_text_cancel delivers
                    // the Escape that input_string's cancel path expects
                    // (restore the original value, return null). Backspace
                    // cannot serve here — during text input it stays
                    // delete-character.
                    if (cancelButton.disabled) {
                        return;
                    }
                    cancelButton.disabled = true;
                    var typedLength = firstMutation && lastValue
                        ? 1 : Array.from(lastValue).length;
                    input.value = '';
                    lastValue = '';
                    var fn = bridge('openglad_web_text_cancel');
                    if (fn) {
                        fn();
                        return;
                    }
                    // Stale-build fallback: commit an emptied field.
                    pushBackspaces(typedLength);
                    pushReturn();
                });
                // Keep keyboard activation out of SDL. Enter/Space must first
                // synthesize this button's click, whose dedicated cancel seam
                // restores the original value instead of accepting edits.
                cancelButton.addEventListener('keydown', function(e) {
                    e.stopPropagation();
                });
                cancelButton.addEventListener('keyup', function(e) {
                    e.stopPropagation();
                });
                cancelButton.addEventListener('keypress', function(e) {
                    e.stopPropagation();
                });
            })();

            setInterval(overlayTick, 250);
            overlayTick();
        })();

        window.onerror = function(message) {
            loadingText.textContent = 'Error: ' + message;
            loadingBar.style.background = '#f44';
            console.error(message);
        };
    </script>
    {{{ SCRIPT }}}
