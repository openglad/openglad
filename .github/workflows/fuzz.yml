name: Fuzz Testing

on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Large Nix closures otherwise fan out enough cache downloads for hosted-runner
# TLS resets to poison a ranged NAR resume. Keep every job on a bounded,
# retried binary-cache policy.
env:
  NIX_CONFIG: |
    http-connections = 5
    download-attempts = 10
    max-substitution-jobs = 2

defaults:
  run:
    shell: nix develop .#ci-fuzz --command bash -e {0}

jobs:
  build:
    name: Build production fuzz targets once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Key immutable compiled output by exact derivation
        id: nar-key
        run: |
          drv="$(nix eval --raw .#packages.x86_64-linux.ci-fuzz.drvPath)"
          drv_basename="${drv##*/}"
          drv_hash="${drv_basename%%-*}"
          echo "key=native-nar-v1-${{ runner.os }}-fuzz-${drv_hash}" >> "$GITHUB_OUTPUT"
      - name: Restore exact compiled NAR closure
        id: nar-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ steps.nar-key.outputs.key }}
      - name: Import exact cached output before realizing current source
        if: steps.nar-cache.outputs.cache-hit == 'true'
        run: python3 scripts/ci/nix_bundle.py import --cache build/nix-cache
      - name: Build and export instrumented game and both harnesses
        run: |
          which cmake c++
          realization_started="$(date +%s)"
          nix build .#ci-fuzz --out-link build/bundle-fuzz --cores 3
          realization_seconds="$(( $(date +%s) - realization_started ))"
          echo "Nix fuzz realization: ${realization_seconds} seconds; exact output cache hit: ${{ steps.nar-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/nix_bundle.py export --bundle build/bundle-fuzz --cache build/nix-cache
          python3 scripts/ci/sanitizer_diagnostics.py --lane fuzz --binary build/bundle-fuzz/build/og_sanitizer_diagnostics --out build/sanitizer-diagnostics
          python3 -m unittest discover -s scripts/fuzz -p 'test_*.py' -v
          python3 scripts/ci/nix_bundle_test.py
      - uses: actions/upload-artifact@v7
        with:
          name: fuzz-bundle
          path: build/nix-cache/
          compression-level: 0
          if-no-files-found: error
      - name: Cache successful producer output for exact-derivation reruns
        if: success() && steps.nar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ steps.nar-key.outputs.key }}
  fuzz:
    name: Fuzz ${{ matrix.target }} (${{ github.event_name == 'schedule' && 'nightly' || 'short' }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 50 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        target: [scenario, savefile]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: actions/download-artifact@v8
        with:
          name: fuzz-bundle
          path: build/nix-cache
      - name: Restore compiled artifacts without a store copy
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-v2-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-v2-${{ matrix.target }}-
      - name: Replay every seed, then explore production parser branches
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '120' }}
          FUZZ_SEED: ${{ github.event_name == 'schedule' && github.run_number || '1' }}
          FUZZ_NIGHTLY: ${{ github.event_name == 'schedule' && 'yes' || 'no' }}
        run: |
          extra=()
          if [[ "$FUZZ_NIGHTLY" == yes ]]; then extra+=(--minimize); fi
          python3 scripts/fuzz/run.py --target '${{ matrix.target }}' \
            --output 'build/fuzz-results/${{ matrix.target }}' \
            --corpus 'build/fuzz-corpus/${{ matrix.target }}' \
            --seconds "$FUZZ_SECONDS" --seed "$FUZZ_SEED" "${extra[@]}"
      - name: Persist only successful nightly minimized corpora
        if: success() && github.event_name == 'schedule'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-v2-${{ matrix.target }}-${{ github.run_id }}
      - name: Retain logs, generated seeds, statistics, and crash reproducers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-evidence-${{ matrix.target }}
          path: build/fuzz-results/${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
