name: Fuzz Testing

on:
  pull_request:
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'

env:
  # Disable leak detection: SDL has known benign leaks that would
  # cause false positives in fuzz runs.
  ASAN_OPTIONS: detect_leaks=0

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }} (${{ github.event_name == 'schedule' && 'nightly' || 'pr' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 90 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fuzz_scenario
            corpus: fuzz/corpus/scenario
          - target: fuzz_savefile
            corpus: fuzz/corpus/savefile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpng-dev libphysfs-dev libzip-dev libyaml-dev zlib1g-dev cmake ninja-build clang

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-fuzz-${{ matrix.target }}

      - name: Configure (ci-fuzz preset)
        run: cmake --preset ci-fuzz -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build ${{ matrix.target }}
        run: cmake --build --preset ci-fuzz --target ${{ matrix.target }} -j"$(nproc)"

      - name: Create crash artifact directory
        run: mkdir -p fuzz/crashes

      - name: Run ${{ matrix.target }}
        timeout-minutes: 5
        run: |
          # Keep each fuzz target bounded so PR verification remains fast and
          # deterministic. The outer `timeout` is a hard cap; max_total_time
          # controls libFuzzer's own execution budget.
          DURATION=240
          timeout 295s ./build/ci-fuzz/${{ matrix.target }} \
            ${{ matrix.corpus }} \
            -max_total_time=$DURATION \
            -timeout=15 \
            -artifact_prefix=fuzz/crashes/${{ matrix.target }}_ \
            -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}-${{ github.event_name }}
          path: fuzz/crashes/
          if-no-files-found: ignore
