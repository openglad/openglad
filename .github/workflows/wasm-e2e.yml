name: WASM E2E Tests

on:
  workflow_call:

permissions:
  contents: read
  deployments: write
  pull-requests: write

# Large Nix closures otherwise fan out enough cache downloads for hosted-runner
# TLS resets to poison a ranged NAR resume. Keep every job on a bounded,
# retried binary-cache policy.
env:
  NIX_CONFIG: |
    http-connections = 5
    download-attempts = 10

concurrency:
  group: wasm-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nix develop .#ci-native --command bash -e {0}

jobs:
  build:
    name: Build WASM once
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      hash: ${{ steps.stamp.outputs.hash }}
      alias: ${{ steps.stamp.outputs.alias }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Versions index unit test
        run: python3 -m unittest discover -s scripts/web -p 'test_*.py' -v

      - name: Build locked-flake WASM configuration once
        shell: nix develop --command bash -e {0}
        run: |
          which cmake c++ emcc
          scripts/build_web.sh
      - name: Read the build stamp
        id: stamp
        run: |
          h=build/web-emscripten/og_git_hash.h
          minor="$(sed -n 's/^#define OPENGLAD_VERSION_MINOR \([0-9]*\)$/\1/p' "$h")"
          hash="$(sed -n 's/^#define OPENGLAD_GIT_HASH "\([^"]*\)"$/\1/p' "$h")"
          if [ -z "$minor" ] || [ -z "$hash" ]; then
            echo "::error::${h} has no version stamp"
            exit 1
          fi
          if [ "$minor" != "$(git rev-list --count HEAD)" ]; then
            echo "::error::stamp 2.${minor} != git rev-list --count HEAD (shallow checkout?)"
            exit 1
          fi
          if [ "$hash" != "$(git rev-parse --short=8 HEAD)" ]; then
            echo '::error::WASM build stamp does not match checkout'
            exit 1
          fi
          {
            echo "version=2.${minor}"
            echo "minor=${minor}"
            echo "hash=${hash}"
            echo "alias=v2-${minor}"
          } >> "$GITHUB_OUTPUT"

      - name: Copy web assets to dist
        run: cp web/index.html web/help.html web/_worker.js dist/

      # /versions is generated on EVERY run so the page always exists and a PR
      # preview says honestly which build it is. Only the production gate reads
      # the Cloudflare deployment list, so the credentials are handed to the
      # step only on that gate — off master this is Python over PR-authored
      # code and it gets empty strings instead of the deploy token. Everywhere
      # else --offline emits a current-only page. The generator warns and exits
      # 0 on API trouble by design: a missing index must never block a deploy.
      - name: Generate /versions index
        env:
          CLOUDFLARE_API_TOKEN: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && github.repository == 'openglad/openglad') && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && github.repository == 'openglad/openglad') && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          OG_VERSIONS_LIVE: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master' && github.repository == 'openglad/openglad') && '1' || '0' }}
        run: |
          mode=--offline
          if [ "$OG_VERSIONS_LIVE" = "1" ]; then
            mode=--live
          fi
          python3 scripts/web/versions_index.py "$mode" --project openglad \
            --repo-root . --current-version "${{ steps.stamp.outputs.version }}" \
            --current-commit "$(git rev-parse HEAD)" \
            --current-alias "${{ steps.stamp.outputs.alias }}" \
            --out dist/versions

      - name: Verify deploy assets
        run: |
          required_assets=(
            index.html
            help.html
            _worker.js
            manifest.webmanifest
            icon.svg
            icon-192.png
            icon-512.png
            apple-touch-icon.png
            play.html
            play.js
            play.wasm
            play.data
            versions/index.html
            versions/index.json
          )
          for asset in "${required_assets[@]}"; do
            if [[ ! -s "dist/${asset}" ]]; then
              echo "::error file=dist/${asset}::Missing or empty deploy asset"
              exit 1
            fi
          done
          # #240: the concept campaign is dev-only (tests, tooling, screenshot
          # fodder) and must not reach players. gladiator.glad is the positive
          # control — without it, the negative grep would pass on an empty
          # manifest and prove nothing.
          if ! grep -q 'builtin/gladiator.glad' dist/play.js; then
            echo "::error::gladiator.glad missing from the preload manifest"
            exit 1
          fi
          if grep -q 'builtin/concept.glad' dist/play.js; then
            echo "::error::concept.glad leaked into the web preload (#240)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-dist
          path: |
            dist/
            build/web-emscripten/og_git_hash.h
          if-no-files-found: error
          compression-level: 0

  browser:
    name: Browser (${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: actions/download-artifact@v8
        with:
          name: wasm-dist
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the flake's runnable Chromium
        shell: nix develop --command bash -e {0}
        run: test -x "$OG_CHROMIUM_PATH"
      - name: Run listed shard once and retain first failure
        shell: nix develop --command bash -e {0}
        run: python3 scripts/ci/browser_matrix.py run --shard ${{ matrix.shard }}/4 --out build/browser/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-result-${{ matrix.shard }}
          path: build/browser/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-failure-media-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  browser-completeness:
    name: Browser completeness
    if: always()
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: actions/download-artifact@v8
        with:
          pattern: browser-result-*
          merge-multiple: true
          path: build/browser
      - name: Require disjoint complete browser inventory and all results
        run: python3 scripts/ci/browser_matrix.py verify --results build/browser --shards 4
      - name: Require successful producer and every worker job
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs['build'].result }}
          WORKER_RESULT: ${{ needs['browser'].result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$WORKER_RESULT" = success

  webkit-touch:
    name: WebKit iPhone touch (advisory)
    needs: build
    runs-on: ubuntu-latest
    # `playwright install --with-deps webkit` downloads a large Ubuntu host
    # library closure before the browser itself. A slow Azure mirror can take
    # more than 15 minutes while still making steady progress, and the true
    # WebKit suite must retain its own execution budget after that setup.
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: actions/download-artifact@v8
        with:
          name: wasm-dist
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install WebKit and its host libraries
        run: env PATH="/usr/bin:/bin:$PATH" npx playwright install --with-deps webkit
      - name: Run true WebKit touch projects once
        env:
          OG_WEBKIT: '1'
        # Playwright installs WebKit's Ubuntu libraries above. Resolve the
        # host ldd first so its launch-time validation sees those libraries;
        # Nix's ldd intentionally searches only the Nix store.
        run: env PATH="/usr/bin:/bin:$PATH" npx playwright test --workers=1 --retries=0 --project=webkit-iphone --project=webkit-iphone-portrait
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webkit-touch-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy tested WASM artifact
    needs: [build, browser, browser-completeness, webkit-touch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: actions/download-artifact@v8
        with:
          name: wasm-dist
          path: .
      - name: Read the build stamp
        id: stamp
        run: |
          h=build/web-emscripten/og_git_hash.h
          minor="$(sed -n 's/^#define OPENGLAD_VERSION_MINOR \([0-9]*\)$/\1/p' "$h")"
          hash="$(sed -n 's/^#define OPENGLAD_GIT_HASH "\([^"]*\)"$/\1/p' "$h")"
          if [ -z "$minor" ] || [ -z "$hash" ]; then
            echo "::error::${h} has no version stamp"
            exit 1
          fi
          if [ "$minor" != "$(git rev-list --count HEAD)" ]; then
            echo "::error::stamp 2.${minor} != git rev-list --count HEAD (shallow checkout?)"
            exit 1
          fi
          if [ "$hash" != "$(git rev-parse --short=8 HEAD)" ]; then
            echo '::error::WASM build stamp does not match checkout'
            exit 1
          fi
          {
            echo "version=2.${minor}"
            echo "minor=${minor}"
            echo "hash=${hash}"
            echo "alias=v2-${minor}"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy PR preview to Cloudflare Pages
        id: preview
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=openglad
            --branch=pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add preview link to workflow summary
        if: steps.preview.outcome == 'success'
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.openglad.pages.dev
          IMMUTABLE_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          {
            echo "### Play this PR"
            echo
            echo "[${PREVIEW_URL}](${PREVIEW_URL})"
            echo
            echo "This stable address tracks the latest successful WASM build for PR #${{ github.event.pull_request.number }}."
            echo
            echo "Immutable deployment: ${IMMUTABLE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      # One sticky comment per PR, updated in place on every push, so the link
      # is where a reviewer looks instead of buried in a job summary (#275).
      # The version and hash come from the built artifact's stamp, so the
      # comment cannot claim a build the main menu disagrees with.
      - name: Comment the preview link on the pull request
        if: steps.preview.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.openglad.pages.dev
          IMMUTABLE_URL: ${{ steps.preview.outputs.deployment-url }}
          STAMP_VERSION: ${{ steps.stamp.outputs.version }}
          STAMP_HASH: ${{ steps.stamp.outputs.hash }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- wasm-preview-link -->';
            if (!context.payload.pull_request) {
              core.info('Not a pull request event; skipping the preview comment.');
              return;
            }
            const body = [
              marker,
              '### Play this PR in your browser',
              '',
              `**${process.env.PREVIEW_URL}** — tracks the newest passing WASM build of this PR.`,
              '',
              `Currently serving \`${process.env.STAMP_HASH}\` (version \`${process.env.STAMP_VERSION}\`) — the main menu stamps both bottom-centre; quote them in bug reports. Immutable link for this exact build: ${process.env.IMMUTABLE_URL}`,
              '',
              `Run: ${process.env.RUN_URL}`,
            ].join('\n');
            try {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(
                (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id, body,
                });
                core.info(`Updated preview comment ${existing.id}`);
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info('Created preview comment');
              }
            } catch (error) {
              core.warning(`Unable to create/update the preview comment: ${error.message}`);
            }

      # Production deploy: master pushes (and manual master recovery) ship the
      # exact dist/ the Playwright suite above just validated, and this
      # workflow is the only thing that deploys production. The relay worker
      # (rooms + cloud-save vault) deploys first so a Durable Object migration
      # is always live before any client that needs it. The same dist/ then
      # goes to the permanent v2-<count> alias BEFORE production: a failed
      # archive leaves production untouched, and /versions can never advertise
      # a version whose alias does not exist. The relay requires Node >= 22
      # (relay/package.json engines), hence the second setup-node.
      - name: Set up Node.js for relay deploy
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master' &&
          github.repository == 'openglad/openglad'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install relay npm dependencies
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master' &&
          github.repository == 'openglad/openglad'
        working-directory: relay
        run: npm ci

      - name: Deploy relay worker
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master' &&
          github.repository == 'openglad/openglad'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy

      - name: Archive this version at a stable alias
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master' &&
          github.repository == 'openglad/openglad'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=openglad
            --branch=${{ steps.stamp.outputs.alias }}

      # --branch=master is passed explicitly, exactly as the alias and preview
      # steps pass theirs. The checkout above is a bare SHA, so the runner sits
      # on a detached HEAD; left to infer the branch, wrangler would read
      # `git rev-parse --abbrev-ref HEAD` = "HEAD" and Cloudflare would file
      # this as a PREVIEW deployment on a branch called "head" — production
      # would silently stop updating while the run stayed green.
      - name: Deploy production to Cloudflare Pages
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/master' &&
          github.repository == 'openglad/openglad'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=openglad --branch=master
