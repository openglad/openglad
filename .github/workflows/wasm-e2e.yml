name: WASM E2E Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  wasm-e2e:
    name: Playwright WASM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure WASM build
        run: cmake --preset web-emscripten

      - name: Build WASM target
        run: |
          for attempt in 1 2 3; do
            echo "WASM build attempt ${attempt}/3"
            if cmake --build --preset web-emscripten --target play -j"$(nproc)"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed. Clearing Emscripten ports cache and retrying..."
              rm -rf "${HOME}/.emscripten_ports"
              sleep 10
            fi
          done
          echo "WASM build failed after 3 attempts."
          exit 1

      - name: Copy web assets to dist
        run: cp web/index.html web/hero.png web/help.html dist/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --workers=1

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
