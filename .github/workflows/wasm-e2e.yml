name: WASM E2E Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  wasm-e2e:
    name: Playwright WASM Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.3

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure WASM build
        run: cmake --preset web-emscripten

      - name: Build WASM target
        run: |
          for attempt in 1 2 3; do
            echo "WASM build attempt ${attempt}/3"
            if cmake --build --preset web-emscripten --target play -j"$(nproc)"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed. Clearing Emscripten ports cache and retrying..."
              emcc --clear-ports
              sleep 10
            fi
          done
          echo "WASM build failed after 3 attempts."
          exit 1

      - name: Copy web assets to dist
        run: cp web/index.html web/help.html web/_worker.js dist/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright tests
        run: npx playwright test --workers=1

      # True-WebKit iPhone emulation for the touch suite. The ubuntu CI image
      # satisfies WebKit's library deps (dev boxes often cannot); advisory
      # (continue-on-error) until headless WebKit+WebGL proves stable here.
      - name: Run WebKit iPhone touch tests (advisory)
        env:
          OG_WEBKIT: '1'
        continue-on-error: true
        # Bound engine-start/test hangs inside the advisory step so they cannot
        # consume the enclosing required job's full 30-minute timeout.
        timeout-minutes: 10
        run: >-
          npx playwright test --workers=1
          --project=webkit-iphone
          --project=webkit-iphone-portrait

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
