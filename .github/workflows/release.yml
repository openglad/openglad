name: Release

# One GitHub release per master commit, named for the version the build stamps
# on its own main menu: 2.<commit count> (see cmake/OpenGladVersion.cmake).
#
# Trigger chain: a push to master runs "WASM E2E Tests" (wasm-e2e.yml), which
# validates the web build, archives it at https://v2-<count>.openglad.pages.dev
# and deploys production. Only when that run concludes successfully does this
# file wake up (workflow_run) and cut the release, so a release tag never names
# a commit whose web build failed. Because workflow_run always runs the copy of
# this file that is on master, edits here take effect after they merge — a pull
# request can only validate the three-platform build matrix (the `pull_request`
# trigger below), never cut a release.
#
# History: this file was .github/workflows/nightly.yml, a 2am cron that
# rewrote a rolling prerelease tag and ran its own relay/web deploys as a
# backstop. Per-commit releases replaced the cadence (#253) and wasm-e2e.yml
# is now the single deployer (one deployer, one /versions generator).

on:
  workflow_run:
    workflows: ["WASM E2E Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:        # Manual re-release of the current master tip (master only)
  pull_request:             # Validate multi-platform builds on PRs

permissions:
  contents: read

# Releases are cut in commit order, never cancelled: `queue: max` lets up to
# 100 runs sit pending in the group, so a burst of master pushes queues
# instead of dropping the middle commits' releases (the default, `queue:
# single`, keeps only ONE pending run and cancels the older pending one).
# Pull requests get their own per-PR group so a validation build can never
# evict a pending master release, nor another PR's build.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'master' }}
  cancel-in-progress: false
  queue: max

jobs:
  # ── Resolve the commit being released and its version ─────────────────
  meta:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      alias: ${{ steps.v.outputs.alias }}
      already_released: ${{ steps.v.outputs.already_released }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit whose web build just passed — not the master tip, which
          # may already have moved on while this run was queued.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(git rev-parse HEAD)"
          count="$(git rev-list --count HEAD)"
          # A shallow checkout would compute a small, wrong commit count and
          # tag a release that no build could ever match. Refuse instead.
          [ "$(git rev-parse --is-shallow-repository)" = "false" ] || { echo "::error::shallow checkout"; exit 1; }
          {
            echo "sha=$sha"
            echo "version=2.$count"
            echo "tag=v2.$count"
            echo "alias=v2-$count"
          } >> "$GITHUB_OUTPUT"
          # Idempotent: a re-run (or a manual dispatch on an already released
          # commit) must not try to recreate an existing tag.
          if gh release view "v2.$count" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.$count is already released."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Multi-platform native builds ──────────────────────────────────────
  build:
    needs: [meta]
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       (needs.meta.result == 'success' &&
        needs.meta.outputs.already_released == 'false'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: openglad-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: openglad-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            platform: macos
            artifact_name: openglad-macos-arm64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha || github.sha }}
          # Full history: the build stamps 2.$(git rev-list --count HEAD) into
          # the binaries, and the Linux package step asserts that stamp.
          fetch-depth: 0
          persist-credentials: false
      # ── Install dependencies ──

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libphysfs-dev libzip-dev libyaml-dev zlib1g-dev cmake ninja-build
          # SDL3 is fetched and built statically (no libsdl3-dev on ubuntu-latest).
          # Install backend dev headers so the bundled static SDL3 compiles in
          # real audio/video drivers; these are build-time-only dependencies
          # (SDL dlopens the runtime libraries), keeping the binary self-contained.
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev liburing-dev

      - uses: hendrikmuhs/ccache-action@v1.2.23
        if: matrix.platform == 'linux'
        with:
          key: release-linux

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install sdl3 ninja pkg-config physfs libzip libyaml zlib

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-physfs
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-libyaml
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkg-config
            p7zip

      # ── Configure & Build ──

      - name: Configure & Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=OFF \
            -DBUILD_EDITOR=ON \

          cmake --build build --target openglad openscen -j"$(nproc)"

      - name: Configure & Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DBUILD_EDITOR=ON \

          cmake --build build --target openglad openscen -j"$(sysctl -n hw.logicalcpu)"

      - name: Configure & Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DBUILD_EDITOR=ON \

          cmake --build build --target openglad openscen -j"$(nproc)"

      # ── Package ──

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p staging/openglad
          cp build/openglad build/openscen staging/openglad/
          cp -r pix cfg sound staging/openglad/
          # builtin/*.glad are BUILD outputs composed from campaigns/
          # What lands in build/builtin is exactly what ships, so assert both
          # sides of that here rather than trusting the compose step: the
          # dev-only concept campaign must be absent (#240) and a real campaign
          # must be present (so an empty builtin/ cannot pass the first test).
          test ! -e build/builtin/concept.glad
          test -e build/builtin/gladiator.glad
          # And the binaries must carry this checkout's version, not the "2.0"
          # of a history-less build — the release is tagged with that number.
          grep -q "OPENGLAD_VERSION_STRING \"2.$(git rev-list --count HEAD)\"" build/og_git_hash.h
          cp -r build/builtin staging/openglad/
          tar czf "${{ matrix.artifact_name }}.tar.gz" -C staging openglad

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p staging/openglad
          cp build/openglad build/openscen staging/openglad/
          cp -r pix cfg sound staging/openglad/
          # builtin/*.glad are BUILD outputs composed from campaigns/
          cp -r build/builtin staging/openglad/
          cd staging && zip -r "../${{ matrix.artifact_name }}.zip" openglad

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p staging/openglad
          cp build/openglad.exe build/openscen.exe staging/openglad/
          # Bundle MinGW runtime DLLs
          MINGW_BIN="/mingw64/bin"
          for dll in SDL3.dll libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            [ -f "$MINGW_BIN/$dll" ] && cp "$MINGW_BIN/$dll" staging/openglad/
          done
          cp -r pix cfg sound staging/openglad/
          # builtin/*.glad are BUILD outputs composed from campaigns/
          cp -r build/builtin staging/openglad/
          cd staging && 7z a "../${{ matrix.artifact_name }}.zip" openglad

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  # ── Create the GitHub Release for this master commit ──────────────────
  release:
    needs: [meta, build]
    if: >-
      github.event_name != 'pull_request' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          VERSION="${{ needs.meta.outputs.version }}"
          SHA="${{ needs.meta.outputs.sha }}"
          ALIAS="${{ needs.meta.outputs.alias }}"
          # The previous full release, so --generate-notes lists only the
          # commits since it. Empty on the very first run (or if the lookup
          # fails), which makes --generate-notes fall back to its own default.
          PREV="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' || true)"
          cat > notes.md <<EOF
          Openglad **${VERSION}** — automated release of \`master\` at \`${SHA}\`.

          | Platform | File |
          |---|---|
          | Linux x86_64 | \`openglad-linux-x86_64.tar.gz\` |
          | Windows x86_64 | \`openglad-windows-x86_64.zip\` |
          | macOS ARM64 | \`openglad-macos-arm64.zip\` |

          **Play this version in your browser:** https://${ALIAS}.openglad.pages.dev
          **Latest:** https://openglad.pages.dev · **all versions:** https://openglad.pages.dev/versions/

          The main menu stamps \`v${VERSION}\` and the commit, so a running build can always be matched to this release.
          EOF
          gh release create "$TAG" \
            artifacts/**/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --latest \
            --title "Openglad ${VERSION}" \
            --notes-file notes.md \
            --generate-notes ${PREV:+--notes-start-tag "$PREV"}
