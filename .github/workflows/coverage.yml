name: Coverage CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout push ref
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout PR head ref
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libpng-dev libgtest-dev libncurses-dev libphysfs-dev libzip-dev libyaml-dev zlib1g-dev cmake ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev

      - name: Install relay npm dependencies
        working-directory: relay
        run: npm ci

      - name: Install coverage tools
        run: python3 -m pip install gcovr

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-coverage
          max-size: 2G

      - name: Configure (ci-coverage preset)
        run: cmake --preset ci-coverage -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all test binaries
        run: cmake --build --preset ci-coverage -j"$(nproc)"

      - name: Reset pre-test coverage counters
        run: |
          find build/ci-coverage -type f -name '*.gcda' -delete
          remaining_counters=$(find build/ci-coverage -type f -name '*.gcda' | wc -l)
          if (( remaining_counters != 0 )); then
            echo "Failed to reset pre-test coverage counters" >&2
            exit 1
          fi

      - name: Run tests with coverage
        # CTest continues to enforce the RUN_SERIAL, RESOURCE_LOCK, and
        # PROCESSORS properties registered in CMakeLists.txt. Those processor
        # reservations are calibrated for four-slot GitHub runners, so keep the
        # parallel level at min(nproc, 4) on larger or smaller hosts.
        #
        # OPENGLAD_LUA_COVERAGE arms the in-process pack-Lua line/function
        # recorder for this one pass, so the SAME run produces both halves of
        # the gate: gcov .gcda for src/ and *.luacov dumps for packs/. The
        # recorder is a runtime switch, never a compile flag — the binary the
        # deterministic-sim tests exercise here has to be the binary that
        # ships (og_test_parity passes 188/188 armed and disarmed).
        run: |
          parallel_jobs="$(nproc)"
          if (( parallel_jobs > 4 )); then
            parallel_jobs=4
          fi
          rm -rf build/ci-coverage/coverage/lua-raw
          mkdir -p build/ci-coverage/coverage/lua-raw
          OPENGLAD_LUA_COVERAGE="$PWD/build/ci-coverage/coverage/lua-raw" \
            ctest --test-dir build/ci-coverage --parallel "${parallel_jobs}" --output-on-failure --timeout 420 --no-tests=error

          # The inverse of the pre-test reset above: prove the run really
          # produced counters for BOTH halves. A gcov build that wrote no
          # .gcda "measured" an empty C++ half, and an unarmed recorder an
          # empty Lua half — the report hard-errors on both, but the step
          # that owns collection should say so first and plainly. (The
          # report additionally checks WHICH recorder processes contributed,
          # against scripts/coverage/recorder_processes.txt.)
          gcda_count=$(find build/ci-coverage -type f -name '*.gcda' | wc -l)
          lua_dump_count=$(find build/ci-coverage/coverage/lua-raw -type f -name '*.luacov' | wc -l)
          echo "collected ${gcda_count} .gcda file(s) and ${lua_dump_count} .luacov dump(s)"
          if (( gcda_count == 0 )); then
            echo "ctest ran but produced no .gcda coverage counters" >&2
            exit 1
          fi
          if (( lua_dump_count == 0 )); then
            echo "ctest ran but produced no pack-Lua coverage dumps" >&2
            exit 1
          fi

      - name: Typecheck relay worker
        working-directory: relay
        run: npm run typecheck

      - name: Run relay worker tests
        working-directory: relay
        run: npm test

      - name: Generate coverage reports and enforce thresholds
        id: coverage_metrics
        # THE SAME bar for BOTH languages — each half alone AND the union.
        # Family behaviour is Lua now (packs/**/scripts/*.lua is thousands of
        # lines of live game logic against a few hundred of C++ plumbing in
        # src/gameplay/families), so a gate that measured src/ alone would
        # report green while the half of the codebase that decides what a
        # soldier does went untested. And a single union-only bar was
        # gameable from either side: with C++ at ~96%, a Lua half at 94.50%
        # still cleared a combined 95. scripts/coverage/coverage_report.py
        # takes the Lua denominator from scripts/lua_inventory.py — a purely
        # static enumeration of the repository's Lua, identical no matter
        # which tests ran — attributes the recorder's dumps to it by content
        # hash, per recording process, merges gcovr's src/ tracefile, and
        # gates on C++ alone, Lua alone, and the union.
        #
        # The report also fails on conditions that are not a percentage: a
        # recorded pack script whose bytes are not repository content, a pack
        # chunk whose own dump never declared its source, a declared sidecar
        # that does not hash to its declared digest, an absent or empty set
        # of dumps, a REQUESTED C++ half that measured nothing, a recorder
        # process population that differs from the committed manifest
        # (scripts/coverage/recorder_processes.txt), and a numerator that
        # lands off the static grid. Each of those is a way for a half to
        # look measured while measuring nothing, so none of them is a
        # warning.
        run: |
          LINE_THRESHOLD=95
          FUNCTION_THRESHOLD=100

          mkdir -p build/ci-coverage/coverage
          # HTML detail for the C++ half stays in the uploaded artifact; the
          # gate itself is the combined report below.
          python3 -m gcovr \
            --root . \
            --filter src/ \
            --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --html-details build/ci-coverage/coverage/coverage.html \
            --txt build/ci-coverage/coverage/coverage-summary.txt \
            build/ci-coverage || true

          set +e
          python3 scripts/coverage/coverage_report.py \
            --repo-root . \
            --lua-raw-dir build/ci-coverage/coverage/lua-raw \
            --lines-tool build/ci-coverage/og_lua_lines \
            --cpp-build-dir build/ci-coverage \
            --output-dir build/ci-coverage/coverage \
            --line-threshold "${LINE_THRESHOLD}" \
            --function-threshold "${FUNCTION_THRESHOLD}"
          gate_status=$?
          set -e

          read -r line_covered line_total function_covered function_total \
            line_pct function_pct line_status function_status \
            < <(python3 - <<'PY'
          import json
          with open("build/ci-coverage/coverage/summary.json", "r", encoding="utf-8") as f:
              s = json.load(f)
          c = s["combined"]
          line_covered = c["lines_hit"]
          line_total = c["lines_found"]
          function_covered = c["functions_hit"]
          function_total = c["functions_found"]
          line_pct = 100.0 * line_covered / line_total if line_total else 0.0
          function_pct = 100.0 * function_covered / function_total if function_total else 0.0
          print(line_covered, line_total, function_covered, function_total,
                f"{line_pct:.3f}", f"{function_pct:.3f}",
                s["line_status"], s["function_status"])
          PY
          )

          # The gate itself lives in coverage_report.py (exact integer
          # comparison, so 94.96% cannot round into 95). These are the
          # numbers it reported, re-read for the PR comment.
          {
            echo "line_pct=$line_pct"
            echo "function_pct=$function_pct"
            echo "line_counts=${line_covered}/${line_total}"
            echo "function_counts=${function_covered}/${function_total}"
            echo "line_status=$line_status"
            echo "function_status=$function_status"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Coverage Summary (C++ and pack Lua)"
            echo
            echo "| Metric | Coverage | Threshold | Status |"
            echo "|---|---:|---:|---|"
            echo "| Line | ${line_pct}% (${line_covered}/${line_total}) | ${LINE_THRESHOLD}% | ${line_status} |"
            echo "| Function | ${function_pct}% (${function_covered}/${function_total}) | ${FUNCTION_THRESHOLD}% | ${function_status} |"
            echo
            echo '```'
            python3 - <<'PY'
          import json
          with open("build/ci-coverage/coverage/summary.json", "r", encoding="utf-8") as f:
              s = json.load(f)
          gate = s.get("gate", {})
          for label, key in (("C++ (src/)", "cpp"), ("Lua (packs/)", "lua"),
                             ("COMBINED", "combined")):
              t = s[key]
              lp = 100.0 * t["lines_hit"] / t["lines_found"] if t["lines_found"] else 0.0
              fp = 100.0 * t["functions_hit"] / t["functions_found"] if t["functions_found"] else 0.0
              v = gate.get(key, {})
              verdict = f'  line {v.get("line", "?"):<4} function {v.get("function", "?")}'
              print(f'{label:<14}{t["lines_hit"]:>7}/{t["lines_found"]:<7}{lp:>7.2f}%'
                    f'{t["functions_hit"]:>7}/{t["functions_found"]:<7}{fp:>7.2f}%{verdict}')
          print("(the bar applies to each half alone AND to the union)")
          PY
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $gate_status

      - name: Comment coverage on pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          LINE_THRESHOLD: 95
          FUNCTION_THRESHOLD: 100
          LINE_PCT: ${{ steps.coverage_metrics.outputs.line_pct }}
          FUNCTION_PCT: ${{ steps.coverage_metrics.outputs.function_pct }}
          LINE_COUNTS: ${{ steps.coverage_metrics.outputs.line_counts }}
          FUNCTION_COUNTS: ${{ steps.coverage_metrics.outputs.function_counts }}
          LINE_STATUS: ${{ steps.coverage_metrics.outputs.line_status }}
          FUNCTION_STATUS: ${{ steps.coverage_metrics.outputs.function_status }}
        with:
          script: |
            const marker = '<!-- coverage-ci-summary -->';
            const lineThreshold = process.env.LINE_THRESHOLD || 'n/a';
            const functionThreshold = process.env.FUNCTION_THRESHOLD || 'n/a';
            const linePct = process.env.LINE_PCT || 'n/a';
            const functionPct = process.env.FUNCTION_PCT || 'n/a';
            const lineCounts = process.env.LINE_COUNTS || 'n/a';
            const functionCounts = process.env.FUNCTION_COUNTS || 'n/a';
            const lineStatus = process.env.LINE_STATUS || 'UNKNOWN';
            const functionStatus = process.env.FUNCTION_STATUS || 'UNKNOWN';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (!context.payload.pull_request) {
              core.info('Not a pull request event; skipping comment.');
              return;
            }

            const body = [
              marker,
              '## Coverage Summary (C++ `src/` + pack Lua `packs/`)',
              '',
              '| Metric | Coverage | Threshold | Status |',
              '|---|---:|---:|---|',
              `| Line | ${linePct}% (${lineCounts}) | ${lineThreshold}% | ${lineStatus} |`,
              `| Function | ${functionPct}% (${functionCounts}) | ${functionThreshold}% | ${functionStatus} |`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            try {
              const issue_number = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });

              const existing = comments.find(
                (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated coverage comment ${existing.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body,
                });
                core.info('Created new coverage comment');
              }
            } catch (error) {
              core.warning(`Unable to create/update coverage comment: ${error.message}`);
            }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/ci-coverage/coverage/
