name: Coverage CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Large Nix closures otherwise fan out enough cache downloads for hosted-runner
# TLS resets to poison a ranged NAR resume. Keep every job on a bounded,
# retried binary-cache policy.
env:
  NIX_CONFIG: |
    http-connections = 5
    download-attempts = 10
    max-substitution-jobs = 2

# The coverage jobs run in a shell that carries only what they use: the
# general native shell is three times the download (1.7 GiB against 0.5 GiB)
# and every stage of this workflow pays for its shell in series.
defaults:
  run:
    shell: nix develop .#ci-coverage --command bash -e {0}

# A newer push to a pull request supersedes the run in progress: its verdict
# is about a commit nobody will merge, and while it ran the new run waited
# behind it (6m43s on 2026-11-12). A run on master is never cancelled: each
# one reports a merged commit and seeds the compiler cache pull requests
# start from.
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile-coverage:
    name: Warm coverage compile cache (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      # actions/cache derives a cache's version from its path as well as its
      # key, so the seed is restored into and saved from this one directory:
      # saved from any other, it is never found again.
      - name: Restore the newest compatible cross-commit compiler cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: native-sccache-v2-${{ runner.os }}-coverage-${{ hashFiles('flake.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            native-sccache-v2-${{ runner.os }}-coverage-${{ hashFiles('flake.lock') }}-
      - name: Compile one complete-plan object shard
        run: |
          mkdir -p build/sccache-seed/cache
          python3 scripts/ci/nix_bundle.py build --lane coverage --repo "$PWD" \
            --sccache-seed build/sccache-seed --compile-shards 8 \
            --compile-shard ${{ matrix.shard }} --cache-only --cores 4 \
            --out-link build/sccache-shard
          mkdir -p build/sccache-upload
          cp -a --reflink=auto build/sccache-shard/. build/sccache-upload/
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-compile-cache-${{ matrix.shard }}
          path: build/sccache-upload/
          compression-level: 0
          if-no-files-found: error

  build-coverage:
    name: Build coverage once
    needs: compile-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Download every compile-cache shard
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-compile-cache-*
          path: build/sccache-shards
      - name: Restore the cross-commit compiler-cache seed
        id: sccache-seed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: native-sccache-v2-${{ runner.os }}-coverage-${{ hashFiles('flake.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            native-sccache-v2-${{ runner.os }}-coverage-${{ hashFiles('flake.lock') }}-
      - name: Verify and merge the complete compile cache
        run: |
          mkdir -p build/sccache-seed/cache
          shard_args=()
          for shard in build/sccache-shards/coverage-compile-cache-*; do
            shard_args+=(--input "$shard")
          done
          python3 scripts/ci/compile_cache.py merge \
            --seed build/sccache-seed "${shard_args[@]}" \
            --output build/sccache-merged --lane coverage \
            --revision "$(git rev-parse HEAD)" --shards 8
      - name: Build and export immutable configuration
        run: |
          which cmake c++
          realization_started="$(date +%s)"
          python3 scripts/ci/nix_bundle.py build --lane coverage --repo "$PWD" \
            --sccache-seed build/sccache-merged --cores 4 \
            --out-link build/bundle-coverage
          python3 scripts/ci/nix_bundle.py build --lane coverage --repo "$PWD" \
            --sccache-seed build/sccache-merged --cores 4 --cache-only \
            --out-link build/sccache-output
          realization_seconds="$(( $(date +%s) - realization_started ))"
          echo "Nix coverage realization: ${realization_seconds} seconds" >> "$GITHUB_STEP_SUMMARY"
          # The eight workers enter the same shell this job runs in, so the
          # toolchain half of the closure (538 MiB of 1.9 GiB) is already in
          # their stores; ship the product and the paths this build made.
          python3 scripts/ci/nix_bundle.py export --prune-substitutable --bundle build/bundle-coverage --cache build/nix-cache
          python3 scripts/ci/nix_bundle.py plan-tree --bundle build/bundle-coverage --repo "$PWD"
      - name: Validate real checkout and plan complete inventory
        run: |
          bash scripts/check_parity_companion_refs.sh
          python3 scripts/check_luals.py --luals-exe "$(command -v lua-language-server)" --log-dir build/luals-check
          python3 scripts/check_lua_statement_lines.py
          python3 scripts/modding/check_api_stubs.py --repo-root .
          python3 scripts/coverage/test_coverage_report.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/nix_bundle_test.py
          python3 scripts/ci/test_matrix.py plan --build build/ci-coverage --lane coverage --shards 8 --out build/plan
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-bundle
          path: build/nix-cache/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-plan
          path: build/plan/
          if-no-files-found: error
      - name: Stage the updated compiler cache under the restored path
        if: success() && steps.sccache-seed.outputs.cache-hit != 'true'
        run: |
          # The restored seed is spent: the merged cache was built from it.
          # Replace it in place, because the path is part of the cache
          # version (see the restore step in compile-coverage).
          if [ -d build/sccache-seed ]; then chmod -R u+w build/sccache-seed; fi
          rm -rf build/sccache-seed
          mkdir -p build/sccache-seed
          cp -a --reflink=auto build/sccache-output/. build/sccache-seed/
      - name: Save the updated cross-commit compiler cache
        if: success() && steps.sccache-seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: native-sccache-v2-${{ runner.os }}-coverage-${{ hashFiles('flake.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}

  test-coverage:
    name: coverage (${{ matrix.shard }}/8)
    needs: build-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      # The shell closure and the compiled bundle are both network-bound and
      # independent. Substituting the shell behind the artifact downloads
      # instead of after them takes it off this job's serial path; the first
      # shell step below waits on the store locks for whatever is left.
      - name: Fetch the lane shell while the compiled bundle downloads
        shell: bash
        run: nohup nix develop .#ci-coverage --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      - uses: actions/download-artifact@v8
        with:
          name: coverage-bundle
          path: build/nix-cache
      - uses: actions/download-artifact@v8
        with:
          name: coverage-plan
          path: build/plan
      - name: Restore compiled artifacts without a store copy (no compilation)
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - name: Run every assigned test once
        run: python3 scripts/ci/test_matrix.py run --build build/ci-coverage --plan build/plan/plan.json --shard ${{ matrix.shard }} --out build/results/shard-${{ matrix.shard }}
      - name: Collect complete zero-hit C++ inventory and shard Lua evidence
        if: always()
        run: python3 scripts/ci/test_matrix.py collect-coverage --build build/ci-coverage --out build/results/shard-${{ matrix.shard }}
      - name: Upload all results, including the first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-result-${{ matrix.shard }}
          path: build/results/
          if-no-files-found: error
          # The gcovr JSON traces dominate this artifact and compress about
          # 10:1; unlike the binary/cache bundles above, storing them raw
          # makes the aggregate job download hundreds of unnecessary MiB.
          compression-level: 6

  coverage:
    name: Coverage
    if: always()
    needs: [build-coverage, test-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The gate reads the tracked file inventory, never history.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Fetch the lane shell while the worker results download
        shell: bash
        run: nohup nix develop .#ci-coverage --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      # The plan carries the one built tool the gate runs (the Lua
      # executable-line oracle), pinned by digest. The compiled bundle is
      # 2 GiB of test binaries this job never executes; downloading and
      # restoring it took 4m24s of this job's 8m33s on 2026-11-12.
      - uses: actions/download-artifact@v8
        with:
          name: coverage-plan
          path: build/plan
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-result-*
          merge-multiple: true
          path: build/results
      - name: Require every shard and test result and enforce both language floors
        run: python3 scripts/ci/test_matrix.py merge-coverage --lines-tool build/plan/og_lua_lines --out build/coverage --plan build/plan/plan.json --results build/results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/coverage/
          if-no-files-found: error
      - name: Read combined coverage metrics
        if: always()
        id: coverage_metrics
        run: |
          python3 - <<'PYMETRICS'
          import json, os
          from pathlib import Path
          path = Path('build/coverage/summary.json')
          if not path.is_file():
              raise SystemExit('coverage summary missing: collection/gate failed')
          summary = json.loads(path.read_text())
          counts = summary['combined']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for prefix, key in [('line', 'lines'), ('function', 'functions')]:
                  hit, found = counts[key+'_hit'], counts[key+'_found']
                  out.write(f'{prefix}_pct={100*hit/found if found else 0:.3f}\n')
                  out.write(f'{prefix}_counts={hit}/{found}\n')
                  out.write(f'{prefix}_status={summary[prefix+"_status"]}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Coverage gates apply independently to C++, Lua, and their union: line >98%, function 100%.\n')
              for key in ['cpp', 'lua', 'combined']:
                  out.write(f'{key}: {summary[key]} {summary.get("gate", {}).get(key, {})}\n')
          PYMETRICS
      - name: Comment coverage on pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v9
        env:
          LINE_THRESHOLD: 98
          FUNCTION_THRESHOLD: 100
          LINE_PCT: ${{ steps.coverage_metrics.outputs.line_pct }}
          FUNCTION_PCT: ${{ steps.coverage_metrics.outputs.function_pct }}
          LINE_COUNTS: ${{ steps.coverage_metrics.outputs.line_counts }}
          FUNCTION_COUNTS: ${{ steps.coverage_metrics.outputs.function_counts }}
          LINE_STATUS: ${{ steps.coverage_metrics.outputs.line_status }}
          FUNCTION_STATUS: ${{ steps.coverage_metrics.outputs.function_status }}
        with:
          script: |
            const marker = '<!-- coverage-ci-summary -->';
            const lineThreshold = process.env.LINE_THRESHOLD || 'n/a';
            const functionThreshold = process.env.FUNCTION_THRESHOLD || 'n/a';
            const linePct = process.env.LINE_PCT || 'n/a';
            const functionPct = process.env.FUNCTION_PCT || 'n/a';
            const lineCounts = process.env.LINE_COUNTS || 'n/a';
            const functionCounts = process.env.FUNCTION_COUNTS || 'n/a';
            const lineStatus = process.env.LINE_STATUS || 'UNKNOWN';
            const functionStatus = process.env.FUNCTION_STATUS || 'UNKNOWN';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (!context.payload.pull_request) {
              core.info('Not a pull request event; skipping comment.');
              return;
            }

            const body = [
              marker,
              '## Coverage Summary (C++ `src/` + `include/openglad/`, pack Lua `packs/`)',
              '',
              '| Metric | Coverage | Threshold | Status |',
              '|---|---:|---:|---|',
              `| Line | ${linePct}% (${lineCounts}) | >${lineThreshold}% | ${lineStatus} |`,
              `| Function | ${functionPct}% (${functionCounts}) | ${functionThreshold}% | ${functionStatus} |`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            try {
              const issue_number = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });

              const existing = comments.find(
                (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated coverage comment ${existing.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body,
                });
                core.info('Created new coverage comment');
              }
            } catch (error) {
              core.warning(`Unable to create/update coverage comment: ${error.message}`);
            }
      - name: Require successful producer and every worker job
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs['build-coverage'].result }}
          WORKER_RESULT: ${{ needs['test-coverage'].result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$WORKER_RESULT" = success
