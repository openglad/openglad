name: Coverage CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout push ref
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/checkout@v4

      - name: Checkout PR head ref
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev cmake ninja-build

      - name: Install coverage tools
        run: python3 -m pip install gcovr

      - name: Configure (ci-coverage preset)
        run: cmake --preset ci-coverage

      - name: Build coverage test binaries
        run: cmake --build --preset ci-coverage --target og_unit_tests og_data_tests og_runtime_tests -j"$(nproc)"

      - name: Run coverage test binaries
        run: |
          rm -f "$HOME/.openglad/campaigns/org.openglad.test."*.glad 2>/dev/null || true
          rm -f scen/scen93*.fss scen/scen94*.fss 2>/dev/null || true
          timeout 300 ./build/ci-coverage/og_unit_tests
          timeout 600 ./build/ci-coverage/og_data_tests
          timeout 600 ./build/ci-coverage/og_runtime_tests

      - name: Generate HTML coverage report
        run: |
          mkdir -p build/ci-coverage/coverage
          python3 -m gcovr \
            --root . \
            --filter src/ \
            --exclude 'src/fuzz/' \
            --exclude 'src/sdl_client/' \
            --exclude 'src/interface/' \
            --exclude 'src/platform/sdl/' \
            --exclude 'src/ui/' \
            --exclude 'src/test_trace.cpp' \
            --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
            --html-details \
            --output build/ci-coverage/coverage/coverage.html \
            build/ci-coverage

      - name: Generate coverage summary report and enforce thresholds
        id: coverage_metrics
        run: |
          LINE_THRESHOLD=85
          FUNCTION_THRESHOLD=90

          set +e
          python3 -m gcovr \
            --root . \
            --filter src/ \
            --exclude 'src/fuzz/' \
            --exclude 'src/sdl_client/' \
            --exclude 'src/interface/' \
            --exclude 'src/platform/sdl/' \
            --exclude 'src/ui/' \
            --exclude 'src/test_trace.cpp' \
            --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
            --txt \
            --output build/ci-coverage/coverage/coverage-summary.txt \
            --json-summary build/ci-coverage/coverage/coverage-summary.json \
            --fail-under-line "${LINE_THRESHOLD}" \
            --fail-under-function "${FUNCTION_THRESHOLD}" \
            build/ci-coverage
          gcovr_status=$?
          set -e

          cat build/ci-coverage/coverage/coverage-summary.txt

          line_pct=$(python3 - <<'PY'
          import json
          with open("build/ci-coverage/coverage/coverage-summary.json", "r", encoding="utf-8") as f:
              s = json.load(f)
          print(f"{s['line_percent']:.1f}")
          PY
          )
          function_pct=$(python3 - <<'PY'
          import json
          with open("build/ci-coverage/coverage/coverage-summary.json", "r", encoding="utf-8") as f:
              s = json.load(f)
          print(f"{s['function_percent']:.1f}")
          PY
          )

          line_status="FAIL"
          function_status="FAIL"
          if awk "BEGIN {exit !($line_pct >= $LINE_THRESHOLD)}"; then line_status="PASS"; fi
          if awk "BEGIN {exit !($function_pct >= $FUNCTION_THRESHOLD)}"; then function_status="PASS"; fi

          echo "line_pct=$line_pct" >> "$GITHUB_OUTPUT"
          echo "function_pct=$function_pct" >> "$GITHUB_OUTPUT"
          echo "line_status=$line_status" >> "$GITHUB_OUTPUT"
          echo "function_status=$function_status" >> "$GITHUB_OUTPUT"

          {
            echo "## Coverage Summary"
            echo
            echo "| Metric | Coverage | Threshold | Status |"
            echo "|---|---:|---:|---|"
            echo "| Line | ${line_pct}% | ${LINE_THRESHOLD}% | ${line_status} |"
            echo "| Function | ${function_pct}% | ${FUNCTION_THRESHOLD}% | ${function_status} |"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$gcovr_status"

      - name: Comment coverage on pull request
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          LINE_THRESHOLD: 85
          FUNCTION_THRESHOLD: 90
          LINE_PCT: ${{ steps.coverage_metrics.outputs.line_pct }}
          FUNCTION_PCT: ${{ steps.coverage_metrics.outputs.function_pct }}
          LINE_STATUS: ${{ steps.coverage_metrics.outputs.line_status }}
          FUNCTION_STATUS: ${{ steps.coverage_metrics.outputs.function_status }}
        with:
          script: |
            const marker = '<!-- coverage-ci-summary -->';
            const lineThreshold = process.env.LINE_THRESHOLD || 'n/a';
            const functionThreshold = process.env.FUNCTION_THRESHOLD || 'n/a';
            const linePct = process.env.LINE_PCT || 'n/a';
            const functionPct = process.env.FUNCTION_PCT || 'n/a';
            const lineStatus = process.env.LINE_STATUS || 'UNKNOWN';
            const functionStatus = process.env.FUNCTION_STATUS || 'UNKNOWN';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (!context.payload.pull_request) {
              core.info('Not a pull request event; skipping comment.');
              return;
            }

            const body = [
              marker,
              '## Coverage Summary',
              '',
              '| Metric | Coverage | Threshold | Status |',
              '|---|---:|---:|---|',
              `| Line | ${linePct}% | ${lineThreshold}% | ${lineStatus} |`,
              `| Function | ${functionPct}% | ${functionThreshold}% | ${functionStatus} |`,
              '',
              `Run: ${runUrl}`,
            ].join('\n');

            try {
              const issue_number = context.payload.pull_request.number;
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });

              const existing = comments.find(
                (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
                core.info(`Updated coverage comment ${existing.id}`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body,
                });
                core.info('Created new coverage comment');
              }
            } catch (error) {
              core.warning(`Unable to create/update coverage comment: ${error.message}`);
            }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/ci-coverage/coverage/
