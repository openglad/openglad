name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev libgtest-dev cmake ninja-build

      - name: Configure (ci-test preset)
        run: cmake --preset ci-test

      - name: Build all test binaries
        run: cmake --build --preset ci-test -j"$(nproc)"

      - name: Run tests (parallel)
        run: ctest --test-dir build/ci-test --parallel $(nproc) --output-on-failure --timeout 180

  build:
    name: Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev libgtest-dev cmake ninja-build

      - name: Configure (dev-release preset)
        run: cmake --preset dev-release

      - name: Build native binaries
        run: cmake --build --preset dev-release --target openglad openscen -j"$(nproc)"

  asan:
    name: ASan+UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev libgtest-dev cmake ninja-build

      - name: Configure (ci-asan preset)
        run: cmake --preset ci-asan

      - name: Build all test binaries
        run: cmake --build --preset ci-asan -j"$(nproc)"

      - name: Run tests (parallel)
        run: ctest --test-dir build/ci-asan --parallel $(nproc) --output-on-failure --timeout 180
