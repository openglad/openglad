name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev cmake

      - name: Build test binary
        run: ./scripts/build_test.sh

      - name: Run tests
        run: ./openglad_test

  build:
    name: Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev cmake

      - name: Build native binaries
        run: ./scripts/build_native.sh
