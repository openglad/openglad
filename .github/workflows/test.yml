name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev libgtest-dev cmake ninja-build

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-test

      - name: Configure (ci-test preset)
        run: cmake --preset ci-test -DVALIDATE_SERIALIZATION=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all test binaries
        run: cmake --build --preset ci-test -j"$(nproc)"

      - name: Run tests (parallel, excluding menu UI)
        run: ctest --test-dir build/ci-test --parallel $(nproc) --output-on-failure --timeout 180 -E og_test_menu_ui

      - name: Run menu UI test with extended timeout
        run: ctest --test-dir build/ci-test --output-on-failure --timeout 300 -R og_test_menu_ui

  build:
    name: Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev libgtest-dev cmake ninja-build

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: native-build

      - name: Configure (dev-release preset)
        run: cmake --preset dev-release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build native binaries
        run: cmake --build --preset dev-release --target openglad openscen -j"$(nproc)"

  asan:
    name: ASan+UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev libgtest-dev cmake ninja-build

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-asan

      - name: Configure (ci-asan preset)
        run: cmake --preset ci-asan -DVALIDATE_SERIALIZATION=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build all test binaries
        run: cmake --build --preset ci-asan -j"$(nproc)"

      - name: Run tests (parallel, excluding menu UI)
        run: ctest --test-dir build/ci-asan --parallel $(nproc) --output-on-failure --timeout 180 -E og_test_menu_ui

      - name: Run menu UI test with sanitizer timeout
        run: ctest --test-dir build/ci-asan --output-on-failure --timeout 420 -R og_test_menu_ui

  tsan:
    name: TSan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libsdl2-dev libsdl2-mixer-dev libpng-dev libgtest-dev cmake ninja-build

      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ci-tsan

      - name: Configure (ci-tsan preset)
        run: cmake --preset ci-tsan -DVALIDATE_SERIALIZATION=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build TSan unit binary
        run: cmake --build --preset ci-tsan --target og_unit_sim -j"$(nproc)"

      - name: Run TSan unit tests
        run: ctest --preset ci-tsan
