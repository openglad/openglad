name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  # The test workers look up this run's bundle artifact to fetch it by ranges.
  actions: read

# Large Nix closures otherwise fan out enough cache downloads for hosted-runner
# TLS resets to poison a ranged NAR resume. Keep every job on a bounded,
# retried binary-cache policy.
env:
  NIX_CONFIG: |
    http-connections = 5
    download-attempts = 10
    max-substitution-jobs = 2

# The sanitizer jobs build their lane with Clang and run its tests in a shell
# that carries the lane's tools and libraries plus LLVM and nothing else. The
# general native shell is twice the download (1.7 GiB against 0.85 GiB) and
# builds two packages no bundle consumer links, in every job.
defaults:
  run:
    shell: nix develop .#ci-sanitizer --command bash -e {0}

# A newer push to a pull request supersedes the run in progress; a run on
# master is never cancelled (see coverage.yml).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan-asan:
    name: Decide the ASan compile fan-out
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      warm: ${{ steps.decide.outputs.warm }}
    steps:
      # Commits and trees only: the decision compares two trees by name.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Find the newest compatible compiler cache without downloading it
        id: seed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-
          lookup-only: true
      # Eight warmers that find every object already cached cost 2m47s before
      # the producer starts (2026-11-13). They run only when this push can
      # have changed more objects than the producer compiles in that time.
      - name: Compare this commit with the one the cache was saved for
        id: decide
        shell: bash
        env:
          PREFIX: native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-
          MATCHED_KEY: ${{ steps.seed.outputs.cache-matched-key }}
        run: python3 scripts/ci/compile_fanout.py --prefix "$PREFIX" --matched-key "$MATCHED_KEY"

  compile-asan:
    name: Warm ASan compile cache (${{ matrix.shard }}/8)
    needs: plan-asan
    if: needs['plan-asan'].outputs.warm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Fetch the lane shell while the compiler cache restores
        shell: bash
        run: nohup nix develop .#ci-sanitizer --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      # actions/cache derives a cache's version from its path as well as its
      # key, so the seed is restored into and saved from this one directory.
      - name: Restore the newest compatible cross-commit compiler cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-
      - name: Compile one complete-plan object shard
        run: |
          mkdir -p build/sccache-seed/cache
          python3 scripts/ci/nix_bundle.py build --lane asan --repo "$PWD" \
            --sccache-seed build/sccache-seed --compile-shards 8 \
            --compile-shard ${{ matrix.shard }} --cache-only --cores 4 \
            --out-link build/sccache-shard
          mkdir -p build/sccache-upload
          cp -a --reflink=auto build/sccache-shard/. build/sccache-upload/
      - uses: actions/upload-artifact@v7
        with:
          name: asan-compile-cache-${{ matrix.shard }}
          path: build/sccache-upload/
          compression-level: 0
          if-no-files-found: error

  build-asan:
    name: Build asan once
    needs: [plan-asan, compile-asan]
    if: ${{ !cancelled() && needs['plan-asan'].result == 'success' && (needs['plan-asan'].outputs.warm != 'true' || needs['compile-asan'].result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Fetch the lane shell while the compile cache downloads
        shell: bash
        run: nohup nix develop .#ci-sanitizer --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      - name: Download every compile-cache shard
        if: needs['plan-asan'].outputs.warm == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: asan-compile-cache-*
          path: build/sccache-shards
      - name: Restore the cross-commit compiler-cache seed
        id: sccache-seed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-
      - name: Verify and merge the complete compile cache
        if: needs['plan-asan'].outputs.warm == 'true'
        run: |
          mkdir -p build/sccache-seed/cache
          shard_args=()
          for shard in build/sccache-shards/asan-compile-cache-*; do
            shard_args+=(--input "$shard")
          done
          python3 scripts/ci/compile_cache.py merge \
            --seed build/sccache-seed "${shard_args[@]}" \
            --output build/sccache-merged --lane asan \
            --revision "$(git rev-parse HEAD)" --shards 8
      - name: Build and export immutable configuration
        env:
          WARMED: ${{ needs['plan-asan'].outputs.warm }}
        run: |
          which cmake c++
          realization_started="$(date +%s)"
          if [ "$WARMED" = true ]; then
            producer=(--sccache-seed build/sccache-merged)
          else
            # No fan-out ran: the producer compiles what the seed lacks.
            mkdir -p build/sccache-seed/cache
            producer=(--sccache-seed build/sccache-seed --unwarmed)
          fi
          python3 scripts/ci/nix_bundle.py build --lane asan --repo "$PWD" \
            "${producer[@]}" --cores 4 --out-link build/bundle-asan
          python3 scripts/ci/nix_bundle.py build --lane asan --repo "$PWD" \
            "${producer[@]}" --cores 4 --cache-only --out-link build/sccache-output
          realization_seconds="$(( $(date +%s) - realization_started ))"
          echo "Nix asan realization: ${realization_seconds} seconds; compile fan-out: $WARMED" >> "$GITHUB_STEP_SUMMARY"
          # The eight workers enter the same shell this job runs in, so the
          # toolchain half of the closure is already in their stores; ship
          # the product and the paths this build made.
          python3 scripts/ci/nix_bundle.py export --prune-substitutable --bundle build/bundle-asan --cache build/nix-cache
          python3 scripts/ci/nix_bundle.py plan-tree --bundle build/bundle-asan --repo "$PWD"
          python3 scripts/ci/sanitizer_diagnostics.py --lane asan --binary build/ci-asan/og_sanitizer_diagnostics --out build/sanitizer-diagnostics
      - name: Validate real checkout and plan complete inventory
        run: |
          bash scripts/check_parity_companion_refs.sh
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/nix_bundle_test.py
          python3 scripts/ci/test_matrix.py plan --build build/ci-asan --lane asan --shards 8 --out build/plan
      - uses: actions/upload-artifact@v7
        with:
          name: asan-bundle
          path: build/nix-cache/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: asan-plan
          path: build/plan/
          if-no-files-found: error
      - name: Stage the updated compiler cache under the restored path
        if: success() && steps.sccache-seed.outputs.cache-hit != 'true'
        run: |
          # The restored seed is spent: this build's cache was made from it.
          # Replace it in place, because the path is part of the cache
          # version (see the restore step in compile-asan).
          if [ -d build/sccache-seed ]; then chmod -R u+w build/sccache-seed; fi
          rm -rf build/sccache-seed
          mkdir -p build/sccache-seed
          cp -a --reflink=auto build/sccache-output/. build/sccache-seed/
      - name: Save the updated cross-commit compiler cache
        if: success() && steps.sccache-seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
  test-asan:
    name: asan (${{ matrix.shard }}/8)
    needs: build-asan
    # Spelled out because the default is success() over EVERY ancestor: with
    # the fan-out skipped, the skipped warmers would skip these workers too.
    if: ${{ !cancelled() && needs['build-asan'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      # The shell closure and the compiled bundle are both network-bound and
      # independent: substitute the shell behind the artifact download.
      - name: Fetch the lane shell while the compiled bundle downloads
        shell: bash
        run: nohup nix develop .#ci-sanitizer --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      - uses: ./.github/actions/fetch-bundle
        with:
          name: asan-bundle
          path: build/nix-cache
          token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: asan-plan
          path: build/plan
      - name: Restore compiled artifacts without a store copy (no compilation)
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - name: Run every assigned test once
        run: python3 scripts/ci/test_matrix.py run --build build/ci-asan --plan build/plan/plan.json --shard ${{ matrix.shard }} --out build/results/shard-${{ matrix.shard }}
      - name: Upload all results, including the first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asan-result-${{ matrix.shard }}
          path: build/results/
          if-no-files-found: error
          compression-level: 0
  verify-asan:
    name: asan completeness
    if: always()
    needs: [build-asan, test-asan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Plans and results in, a verdict out: nothing here compiles or runs a
    # test, so the shell is an interpreter and the checkout is one commit.
    defaults:
      run:
        shell: nix develop .#ci-verify --command bash -e {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Fetch the verification shell while the results download
        shell: bash
        run: nohup nix develop .#ci-verify --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      - uses: actions/download-artifact@v8
        with:
          name: asan-plan
          path: build/plan
      - uses: actions/download-artifact@v8
        with:
          pattern: asan-result-*
          merge-multiple: true
          path: build/results
      - name: Require every shard and test result
        run: python3 scripts/ci/test_matrix.py verify --plan build/plan/plan.json --results build/results
      - name: Require successful producer and every worker job
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs['build-asan'].result }}
          WORKER_RESULT: ${{ needs['test-asan'].result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$WORKER_RESULT" = success
  build-tsan:
    name: Build tsan once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Build and export immutable configuration
        run: |
          which cmake c++
          realization_started="$(date +%s)"
          nix build .#ci-tsan --out-link build/bundle-tsan --cores 4
          realization_seconds="$(( $(date +%s) - realization_started ))"
          echo "Nix tsan realization: ${realization_seconds} seconds" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/nix_bundle.py export --prune-substitutable --bundle build/bundle-tsan --cache build/nix-cache
          python3 scripts/ci/nix_bundle.py plan-tree --bundle build/bundle-tsan --repo "$PWD"
          python3 scripts/ci/sanitizer_diagnostics.py --lane tsan --binary build/ci-tsan/og_sanitizer_diagnostics --out build/sanitizer-diagnostics
      - name: Validate real checkout and plan complete inventory
        run: |
          bash scripts/check_parity_companion_refs.sh
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/nix_bundle_test.py
          python3 scripts/ci/test_matrix.py plan --build build/ci-tsan --lane tsan --shards 1 --out build/plan
      - uses: actions/upload-artifact@v7
        with:
          name: tsan-bundle
          path: build/nix-cache/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tsan-plan
          path: build/plan/
          if-no-files-found: error
  test-tsan:
    name: tsan (${{ matrix.shard }}/1)
    needs: build-tsan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Fetch the lane shell while the compiled bundle downloads
        shell: bash
        run: nohup nix develop .#ci-sanitizer --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      - uses: ./.github/actions/fetch-bundle
        with:
          name: tsan-bundle
          path: build/nix-cache
          token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: tsan-plan
          path: build/plan
      - name: Restore compiled artifacts without a store copy (no compilation)
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - name: Run every assigned test once
        run: python3 scripts/ci/test_matrix.py run --build build/ci-tsan --plan build/plan/plan.json --shard ${{ matrix.shard }} --out build/results/shard-${{ matrix.shard }}
      - name: Upload all results, including the first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-result-${{ matrix.shard }}
          path: build/results/
          if-no-files-found: error
          compression-level: 0
  verify-tsan:
    name: tsan completeness
    if: always()
    needs: [build-tsan, test-tsan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Plans and results in, a verdict out: nothing here compiles or runs a
    # test, so the shell is an interpreter and the checkout is one commit.
    defaults:
      run:
        shell: nix develop .#ci-verify --command bash -e {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Fetch the verification shell while the results download
        shell: bash
        run: nohup nix develop .#ci-verify --command true > "$RUNNER_TEMP/shell-prefetch.log" 2>&1 &
      - uses: actions/download-artifact@v8
        with:
          name: tsan-plan
          path: build/plan
      - uses: actions/download-artifact@v8
        with:
          pattern: tsan-result-*
          merge-multiple: true
          path: build/results
      - name: Require every shard and test result
        run: python3 scripts/ci/test_matrix.py verify --plan build/plan/plan.json --results build/results
      - name: Require successful producer and every worker job
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs['build-tsan'].result }}
          WORKER_RESULT: ${{ needs['test-tsan'].result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$WORKER_RESULT" = success
  relay:
    name: Relay typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Node and npm come from setup-node; nothing here uses the flake.
    defaults:
      run:
        shell: bash
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  headless-server:
    name: Headless Server SDL-Off Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Build the SDL-disabled configuration with native build dependencies
        shell: nix develop --command bash -e {0}
        run: |
          which cmake c++ emcc
          cmake --preset ci-headless
          cmake --build --preset ci-headless --target openglad_server -j3
          bash scripts/test_headless_server_native_link.sh build/ci-headless
