name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev xvfb

      - name: Build test binary
        run: ./scripts/build_test.sh

      - name: Run tests
        run: |
          # The test binary may hang during SDL cleanup after all tests complete.
          # Capture the exit code from timeout so we can distinguish a clean
          # timeout (exit 124) from a real failure (e.g. segfault = 128+signal).
          set +e
          timeout --kill-after=10 600 xvfb-run -a ./openglad_test >test_output.log 2>&1
          exit_code=$?
          set -e
          cat test_output.log
          # Exit code 124 = timeout sent SIGTERM (expected: SDL cleanup hang)
          # Exit code 137 = timeout sent SIGKILL after --kill-after (also acceptable)
          # Exit code 0   = process exited cleanly
          if [ "$exit_code" -ne 0 ] && [ "$exit_code" -ne 124 ] && [ "$exit_code" -ne 137 ]; then
            echo "Test binary exited with unexpected code $exit_code"
            exit 1
          fi
          grep -q " 0 failed," test_output.log

  build:
    name: Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev

      - name: Build native binaries
        run: ./scripts/build_native.sh
