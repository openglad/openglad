name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev cmake ninja-build

      - name: Configure (ci-test preset)
        run: cmake --preset ci-test

      - name: Build module test binaries
        run: cmake --build --preset ci-test --target og_unit_tests og_data_tests og_runtime_tests -j"$(nproc)"

      - name: Run module test binaries
        run: |
          ./build/ci-test/og_unit_tests
          ./build/ci-test/og_data_tests
          ./build/ci-test/og_runtime_tests

  build:
    name: Native Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev cmake ninja-build

      - name: Configure (dev-release preset)
        run: cmake --preset dev-release

      - name: Build native binaries
        run: cmake --build --preset dev-release --target openglad openscen -j"$(nproc)"

  asan:
    name: ASan+UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev cmake ninja-build

      - name: Configure (ci-asan preset)
        run: cmake --preset ci-asan

      - name: Build sanitizer test binaries
        run: cmake --build --preset ci-asan --target og_unit_tests og_data_tests og_runtime_tests -j"$(nproc)"

      - name: Run sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          ./build/ci-asan/og_unit_tests
          ./build/ci-asan/og_data_tests
          ./build/ci-asan/og_runtime_tests

  wasm:
    name: WASM Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.51

      - name: Build web target (web-emscripten preset)
        run: |
          cmake --preset web-emscripten
          cmake --build --preset web-emscripten --target play -j"$(nproc)"

      - name: Verify expected output files exist
        run: |
          echo "Checking dist/ contents..."
          ls -lh dist/
          test -f dist/play.js   || { echo "FAIL: dist/play.js not found"; exit 1; }
          test -f dist/play.wasm || { echo "FAIL: dist/play.wasm not found"; exit 1; }
          echo "All expected output files present."

      - name: Validate WASM output
        run: ./scripts/validate_wasm_output.sh

  baseline-metrics:
    name: Baseline Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply third-party build fixes
        run: git apply third_party/build-fixes.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libpng-dev cmake ninja-build

      - name: Collect baseline metrics
        run: ./scripts/collect_baseline_metrics.sh

      - name: Upload baseline metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-metrics
          path: build/baseline-metrics/metrics/baseline_metrics.txt
