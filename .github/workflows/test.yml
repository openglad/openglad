name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Large Nix closures otherwise fan out enough cache downloads for hosted-runner
# TLS resets to poison a ranged NAR resume. Keep every job on a bounded,
# retried binary-cache policy.
env:
  NIX_CONFIG: |
    http-connections = 5
    download-attempts = 10
    max-substitution-jobs = 2

defaults:
  run:
    shell: nix develop .#ci-native --command bash -e {0}

jobs:
  probe-asan-cache:
    name: Probe exact ASan build cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      exact-hit: ${{ steps.nar-cache.outputs.cache-hit }}
      nar-key: ${{ steps.keys.outputs.nar-key }}
      sccache-key: ${{ steps.keys.outputs.sccache-key }}
      sccache-prefix: ${{ steps.keys.outputs.sccache-prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Derive exact-output and cross-commit compiler-cache keys
        id: keys
        run: |
          drv="$(nix eval --raw .#packages.x86_64-linux.ci-asan.drvPath)"
          drv_basename="${drv##*/}"
          drv_hash="${drv_basename%%-*}"
          sccache_prefix="native-sccache-v2-${{ runner.os }}-asan-${{ hashFiles('flake.lock') }}-"
          echo "nar-key=native-nar-v1-${{ runner.os }}-asan-${drv_hash}" >> "$GITHUB_OUTPUT"
          echo "sccache-prefix=${sccache_prefix}" >> "$GITHUB_OUTPUT"
          echo "sccache-key=${sccache_prefix}${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Look up the exact compiled NAR without downloading it
        id: nar-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ steps.keys.outputs.nar-key }}
          lookup-only: true

  compile-asan:
    name: Warm ASan compile cache (${{ matrix.shard }}/8)
    needs: probe-asan-cache
    if: needs['probe-asan-cache'].outputs.exact-hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Restore the newest compatible cross-commit compiler cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: ${{ needs['probe-asan-cache'].outputs.sccache-key }}
          restore-keys: |
            ${{ needs['probe-asan-cache'].outputs.sccache-prefix }}
      - name: Compile one complete-plan object shard
        run: |
          mkdir -p build/sccache-seed/cache
          python3 scripts/ci/nix_bundle.py build --lane asan --repo "$PWD" \
            --sccache-seed build/sccache-seed --compile-shards 8 \
            --compile-shard ${{ matrix.shard }} --cache-only --cores 4 \
            --out-link build/sccache-shard
          mkdir -p build/sccache-upload
          cp -a --reflink=auto build/sccache-shard/. build/sccache-upload/
      - uses: actions/upload-artifact@v7
        with:
          name: asan-compile-cache-${{ matrix.shard }}
          path: build/sccache-upload/
          compression-level: 0
          if-no-files-found: error

  build-asan:
    name: Build asan once
    needs: [probe-asan-cache, compile-asan]
    if: ${{ always() && needs['probe-asan-cache'].result == 'success' && (needs['probe-asan-cache'].outputs.exact-hit == 'true' || needs['compile-asan'].result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop .#ci-native --command bash -e {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Restore exact compiled NAR closure
        id: nar-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ needs['probe-asan-cache'].outputs.nar-key }}
      - name: Import and link exact cached output
        if: steps.nar-cache.outputs.cache-hit == 'true'
        run: python3 scripts/ci/nix_bundle.py import --cache build/nix-cache --out-link build/bundle-asan
      - name: Download every compile-cache shard
        if: steps.nar-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: asan-compile-cache-*
          path: build/sccache-shards
      - name: Restore the cross-commit compiler-cache seed
        if: steps.nar-cache.outputs.cache-hit != 'true'
        id: sccache-seed
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-seed
          key: ${{ needs['probe-asan-cache'].outputs.sccache-key }}
          restore-keys: |
            ${{ needs['probe-asan-cache'].outputs.sccache-prefix }}
      - name: Verify and merge the complete compile cache
        if: steps.nar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/sccache-seed/cache
          shard_args=()
          for shard in build/sccache-shards/asan-compile-cache-*; do
            shard_args+=(--input "$shard")
          done
          python3 scripts/ci/compile_cache.py merge \
            --seed build/sccache-seed "${shard_args[@]}" \
            --output build/sccache-merged --lane asan \
            --revision "$(git rev-parse HEAD)" --shards 8
      - name: Build and export immutable configuration
        run: |
          which cmake c++
          realization_started="$(date +%s)"
          if [ "${{ steps.nar-cache.outputs.cache-hit }}" != true ]; then
            python3 scripts/ci/nix_bundle.py build --lane asan --repo "$PWD" \
              --sccache-seed build/sccache-merged --cores 4 \
              --out-link build/bundle-asan
            python3 scripts/ci/nix_bundle.py build --lane asan --repo "$PWD" \
              --sccache-seed build/sccache-merged --cores 4 --cache-only \
              --out-link build/sccache-output
          fi
          realization_seconds="$(( $(date +%s) - realization_started ))"
          echo "Nix asan realization: ${realization_seconds} seconds; exact output cache hit: ${{ steps.nar-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/nix_bundle.py export --bundle build/bundle-asan --cache build/nix-cache
          python3 scripts/ci/nix_bundle.py plan-tree --bundle build/bundle-asan --repo "$PWD"
          python3 scripts/ci/sanitizer_diagnostics.py --lane asan --binary build/ci-asan/og_sanitizer_diagnostics --out build/sanitizer-diagnostics
      - name: Validate real checkout and plan complete inventory
        run: |
          bash scripts/check_parity_companion_refs.sh
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/nix_bundle_test.py
          python3 scripts/ci/test_matrix.py plan --build build/ci-asan --lane asan --shards 8 --out build/plan
      - uses: actions/upload-artifact@v7
        with:
          name: asan-bundle
          path: build/nix-cache/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: asan-plan
          path: build/plan/
          if-no-files-found: error
      - name: Cache successful producer output for exact-derivation reruns
        if: success() && steps.nar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ needs['probe-asan-cache'].outputs.nar-key }}
      - name: Prepare the updated cross-commit compiler cache
        if: success() && steps.nar-cache.outputs.cache-hit != 'true' && steps.sccache-seed.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/sccache-save
          cp -a --reflink=auto build/sccache-output/. build/sccache-save/
      - name: Save the updated cross-commit compiler cache
        if: success() && steps.nar-cache.outputs.cache-hit != 'true' && steps.sccache-seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/sccache-save
          key: ${{ needs['probe-asan-cache'].outputs.sccache-key }}
  test-asan:
    name: asan (${{ matrix.shard }}/8)
    needs: build-asan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#ci-native --command bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: asan-bundle
          path: build/nix-cache
      - uses: actions/download-artifact@v8
        with:
          name: asan-plan
          path: build/plan
      - name: Restore compiled artifacts without a store copy (no compilation)
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - name: Run every assigned test once
        run: python3 scripts/ci/test_matrix.py run --build build/ci-asan --plan build/plan/plan.json --shard ${{ matrix.shard }} --out build/results/shard-${{ matrix.shard }}
      - name: Upload all results, including the first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asan-result-${{ matrix.shard }}
          path: build/results/
          if-no-files-found: error
          compression-level: 0
  verify-asan:
    name: asan completeness
    if: always()
    needs: [build-asan, test-asan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: asan-plan
          path: build/plan
      - uses: actions/download-artifact@v8
        with:
          pattern: asan-result-*
          merge-multiple: true
          path: build/results
      - name: Require every shard and test result
        run: python3 scripts/ci/test_matrix.py verify --plan build/plan/plan.json --results build/results
      - name: Require successful producer and every worker job
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs['build-asan'].result }}
          WORKER_RESULT: ${{ needs['test-asan'].result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$WORKER_RESULT" = success
  build-tsan:
    name: Build tsan once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop .#ci-tsan --command bash -e {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Key immutable compiled output by exact derivation
        id: nar-key
        run: |
          drv="$(nix eval --raw .#packages.x86_64-linux.ci-tsan.drvPath)"
          drv_basename="${drv##*/}"
          drv_hash="${drv_basename%%-*}"
          echo "key=native-nar-v1-${{ runner.os }}-tsan-${drv_hash}" >> "$GITHUB_OUTPUT"
      - name: Restore exact compiled NAR closure
        id: nar-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ steps.nar-key.outputs.key }}
      - name: Import exact cached output before realizing current source
        if: steps.nar-cache.outputs.cache-hit == 'true'
        run: python3 scripts/ci/nix_bundle.py import --cache build/nix-cache
      - name: Build and export immutable configuration
        run: |
          which cmake c++
          realization_started="$(date +%s)"
          nix build .#ci-tsan --out-link build/bundle-tsan --cores 4
          realization_seconds="$(( $(date +%s) - realization_started ))"
          echo "Nix tsan realization: ${realization_seconds} seconds; exact output cache hit: ${{ steps.nar-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/nix_bundle.py export --bundle build/bundle-tsan --cache build/nix-cache
          python3 scripts/ci/nix_bundle.py plan-tree --bundle build/bundle-tsan --repo "$PWD"
          python3 scripts/ci/sanitizer_diagnostics.py --lane tsan --binary build/ci-tsan/og_sanitizer_diagnostics --out build/sanitizer-diagnostics
      - name: Validate real checkout and plan complete inventory
        run: |
          bash scripts/check_parity_companion_refs.sh
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 scripts/ci/nix_bundle_test.py
          python3 scripts/ci/test_matrix.py plan --build build/ci-tsan --lane tsan --shards 1 --out build/plan
      - uses: actions/upload-artifact@v7
        with:
          name: tsan-bundle
          path: build/nix-cache/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: tsan-plan
          path: build/plan/
          if-no-files-found: error
      - name: Cache successful producer output for exact-derivation reruns
        if: success() && steps.nar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ steps.nar-key.outputs.key }}
  test-tsan:
    name: tsan (${{ matrix.shard }}/1)
    needs: build-tsan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: nix develop .#ci-tsan --command bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: tsan-bundle
          path: build/nix-cache
      - uses: actions/download-artifact@v8
        with:
          name: tsan-plan
          path: build/plan
      - name: Restore compiled artifacts without a store copy (no compilation)
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - name: Run every assigned test once
        run: python3 scripts/ci/test_matrix.py run --build build/ci-tsan --plan build/plan/plan.json --shard ${{ matrix.shard }} --out build/results/shard-${{ matrix.shard }}
      - name: Upload all results, including the first failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-result-${{ matrix.shard }}
          path: build/results/
          if-no-files-found: error
          compression-level: 0
  verify-tsan:
    name: tsan completeness
    if: always()
    needs: [build-tsan, test-tsan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: tsan-plan
          path: build/plan
      - uses: actions/download-artifact@v8
        with:
          pattern: tsan-result-*
          merge-multiple: true
          path: build/results
      - name: Require every shard and test result
        run: python3 scripts/ci/test_matrix.py verify --plan build/plan/plan.json --results build/results
      - name: Require successful producer and every worker job
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs['build-tsan'].result }}
          WORKER_RESULT: ${{ needs['test-tsan'].result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$WORKER_RESULT" = success
  relay:
    name: Relay typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - working-directory: relay
        run: npm ci
      - working-directory: relay
        run: npm run typecheck
      - working-directory: relay
        run: npm test

  headless-server:
    name: Headless Server SDL-Off Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Build the SDL-disabled configuration with native build dependencies
        shell: nix develop --command bash -e {0}
        run: |
          which cmake c++ emcc
          cmake --preset ci-headless
          cmake --build --preset ci-headless --target openglad_server -j3
          bash scripts/test_headless_server_native_link.sh build/ci-headless
