name: Nightly Release

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 2am UTC
  workflow_dispatch:        # Allow manual trigger
  pull_request:             # Validate multi-platform builds on PRs

permissions:
  contents: read

jobs:
  # ── Check whether there are new commits since last successful nightly ──
  check-new-commits:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      has_new_commits: ${{ steps.check.outputs.has_new_commits }}
      sha_short: ${{ steps.check.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get current HEAD SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore last successful nightly SHA
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .nightly-last-sha
          key: nightly-last-sha-${{ steps.sha.outputs.sha }}
          restore-keys: nightly-last-sha-

      - name: Compare commits
        id: check
        run: |
          sha_short="$(git rev-parse --short HEAD)"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          if [ -f .nightly-last-sha ] && [ "$(cat .nightly-last-sha)" = "${{ steps.sha.outputs.sha }}" ]; then
            echo "No new commits since last nightly – skipping."
            echo "has_new_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected – proceeding with nightly build."
            echo "has_new_commits=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Multi-platform native builds ──────────────────────────────────────
  build:
    needs: check-new-commits
    if: >-
      always() &&
      (github.event_name == 'pull_request' ||
       needs.check-new-commits.outputs.has_new_commits == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: openglad-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: openglad-windows-x86_64
            archive_ext: zip
          - os: macos-latest
            platform: macos
            artifact_name: openglad-macos-arm64
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ── Install dependencies ──

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libphysfs-dev libzip-dev libyaml-dev zlib1g-dev cmake ninja-build
          # SDL3 is fetched and built statically (no libsdl3-dev on ubuntu-latest).
          # Install backend dev headers so the bundled static SDL3 compiles in
          # real audio/video drivers; these are build-time-only dependencies
          # (SDL dlopens the runtime libraries), keeping the binary self-contained.
          sudo apt-get install -y \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev liburing-dev

      - uses: hendrikmuhs/ccache-action@v1.2.23
        if: matrix.platform == 'linux'
        with:
          key: nightly-linux

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew install sdl3 ninja pkg-config physfs libzip libyaml zlib

      - name: Setup MSYS2 (Windows)
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-physfs
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-libyaml
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pkg-config
            p7zip

      # ── Configure & Build ──

      - name: Configure & Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=OFF \
            -DBUILD_EDITOR=ON \

          cmake --build build --target openglad openscen -j"$(nproc)"

      - name: Configure & Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DBUILD_EDITOR=ON \

          cmake --build build --target openglad openscen -j"$(sysctl -n hw.logicalcpu)"

      - name: Configure & Build (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_TESTING=OFF \
            -DBUILD_EDITOR=ON \

          cmake --build build --target openglad openscen -j"$(nproc)"

      # ── Package ──

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p staging/openglad
          cp build/openglad build/openscen staging/openglad/
          cp -r pix cfg sound staging/openglad/
          # builtin/*.glad are BUILD outputs composed from campaigns/
          cp -r build/builtin staging/openglad/
          tar czf "${{ matrix.artifact_name }}.tar.gz" -C staging openglad

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          mkdir -p staging/openglad
          cp build/openglad build/openscen staging/openglad/
          cp -r pix cfg sound staging/openglad/
          # builtin/*.glad are BUILD outputs composed from campaigns/
          cp -r build/builtin staging/openglad/
          cd staging && zip -r "../${{ matrix.artifact_name }}.zip" openglad

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          mkdir -p staging/openglad
          cp build/openglad.exe build/openscen.exe staging/openglad/
          # Bundle MinGW runtime DLLs
          MINGW_BIN="/mingw64/bin"
          for dll in SDL3.dll libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            [ -f "$MINGW_BIN/$dll" ] && cp "$MINGW_BIN/$dll" staging/openglad/
          done
          cp -r pix cfg sound staging/openglad/
          # builtin/*.glad are BUILD outputs composed from campaigns/
          cp -r build/builtin staging/openglad/
          cd staging && 7z a "../${{ matrix.artifact_name }}.zip" openglad

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  # ── Relay worker deploy ───────────────────────────────────────────────
  # Deploys relay/ (rooms + cloud-save vault) BEFORE the Pages deploy so a
  # Durable Object migration is always live before any client that needs
  # it. Idempotent when nothing changed. Requires CLOUDFLARE_API_TOKEN to
  # carry the "Workers Scripts: Edit" permission (not just Pages).
  relay-deploy:
    needs: check-new-commits
    if: >-
      github.event_name != 'pull_request' &&
      needs.check-new-commits.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: Install relay npm dependencies
        working-directory: relay
        run: npm ci
      - name: Deploy relay worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay
          command: deploy

  # ── Web build + Cloudflare Pages deploy ───────────────────────────────
  web-deploy:
    needs: [check-new-commits, relay-deploy]
    if: >-
      github.event_name != 'pull_request' &&
      needs.check-new-commits.outputs.has_new_commits == 'true' &&
      needs.relay-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.3

      - name: Build web target
        run: |
          cmake --preset web-emscripten
          for attempt in 1 2 3; do
            echo "WASM build attempt ${attempt}/3"
            if cmake --build --preset web-emscripten --target play -j"$(nproc)"; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Build failed. Clearing Emscripten ports cache and retrying..."
              emcc --clear-ports
              sleep 10
            fi
          done
          echo "WASM build failed after 3 attempts."
          exit 1

      - name: Prepare deploy directory
        run: |
          cp web/index.html web/help.html web/_worker.js dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=openglad

  # ── Create / update the nightly GitHub Release ────────────────────────
  release:
    needs: [build, web-deploy, check-new-commits]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.build.result == 'success' &&
      needs.web-deploy.result == 'success' &&
      needs.check-new-commits.outputs.has_new_commits == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Delete previous nightly release
        run: gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        run: |
          DATE="$(date -u '+%Y-%m-%d')"
          SHA_SHORT="${{ needs.check-new-commits.outputs.sha_short }}"
          gh release create nightly \
            artifacts/**/* \
            --prerelease \
            --title "Nightly Build (${DATE} @ ${SHA_SHORT})" \
            --notes "$(cat <<EOF
          Automated nightly build from \`master\` at \`${{ github.sha }}\`.

          **Download for your platform:**
          | Platform | File |
          |----------|------|
          | Linux x86_64 | \`openglad-linux-x86_64.tar.gz\` |
          | Windows x86_64 | \`openglad-windows-x86_64.zip\` |
          | macOS ARM64 | \`openglad-macos-arm64.zip\` |

          **Play in your browser:** https://openglad.pages.dev
          EOF
          )"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Record successful SHA so we can skip no-change runs ───────────────
  save-sha:
    needs: release
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Save successful nightly SHA
        run: echo "${{ github.sha }}" > .nightly-last-sha

      - uses: actions/cache/save@v6
        with:
          path: .nightly-last-sha
          key: nightly-last-sha-${{ github.sha }}
