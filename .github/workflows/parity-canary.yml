name: Parity Mutation Canary

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Large Nix closures otherwise fan out enough cache downloads for hosted-runner
# TLS resets to poison a ranged NAR resume. Keep every job on a bounded,
# retried binary-cache policy.
env:
  NIX_CONFIG: |
    http-connections = 5
    download-attempts = 10
    max-substitution-jobs = 2

defaults:
  run:
    shell: nix develop .#ci-native --command bash -e {0}

jobs:
  build-canary:
    name: Build canary once and select full mutation plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - name: Key immutable compiled output by exact derivation
        id: nar-key
        run: |
          drv="$(nix eval --raw .#packages.x86_64-linux.ci-canary.drvPath)"
          drv_basename="${drv##*/}"
          drv_hash="${drv_basename%%-*}"
          echo "key=native-nar-v1-${{ runner.os }}-canary-${drv_hash}" >> "$GITHUB_OUTPUT"
      - name: Restore exact compiled NAR closure
        id: nar-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ steps.nar-key.outputs.key }}
      - name: Import exact cached output before realizing current source
        if: steps.nar-cache.outputs.cache-hit == 'true'
        run: python3 scripts/ci/nix_bundle.py import --cache build/nix-cache
      - name: Build and export incremental mutation configuration
        run: |
          which cmake c++
          realization_started="$(date +%s)"
          nix build .#ci-canary --out-link build/bundle-canary --cores 4
          realization_seconds="$(( $(date +%s) - realization_started ))"
          echo "Nix canary realization: ${realization_seconds} seconds; exact output cache hit: ${{ steps.nar-cache.outputs.cache-hit || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/nix_bundle.py export --bundle build/bundle-canary --cache build/nix-cache
          python3 scripts/ci/nix_bundle.py plan-tree --bundle build/bundle-canary --repo "$PWD"
          bash scripts/check_parity_companion_refs.sh
          python3 scripts/ci/nix_bundle_test.py
          python3 tests/fixtures/scenario99.py setup "$PWD"
      - name: Select before partitioning; preserve touched and full escalation
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p build/plan
          selection=(--all)
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --quiet origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
            test -n "$base"
            printf '%s\n' "$base" > build/plan/base.txt
            selection=(--touched "$base")
          fi
          scripts/parity/run_mutation_canary.sh "${selection[@]}" --plan --manifest build/plan/plan.json
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7
        with:
          name: canary-bundle
          path: build/nix-cache/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: canary-plan
          path: build/plan/
          if-no-files-found: error
      - name: Cache successful producer output for exact-derivation reruns
        if: success() && steps.nar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/nix-cache
          key: ${{ steps.nar-key.outputs.key }}
  canary:
    name: Mutation canary (${{ matrix.shard }}/3)
    needs: build-canary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: canary-bundle
          path: build/nix-cache
      - uses: actions/download-artifact@v8
        with:
          name: canary-plan
          path: build/plan
      - name: Restore private writable sources and incremental build
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
          python3 tests/fixtures/scenario99.py setup "$PWD"
      - name: Mutate every assigned group and require its predicates to flip
        run: |
          set -o pipefail
          mkdir -p build/results/shard-${{ matrix.shard }}
          selection=(--all)
          if [ -f build/plan/base.txt ]; then
            selection=(--touched "$(cat build/plan/base.txt)")
          fi
          scripts/parity/run_mutation_canary.sh "${selection[@]}" --shard ${{ matrix.shard }}/3             --report build/results/shard-${{ matrix.shard }}/report.json             2>&1 | tee build/results/shard-${{ matrix.shard }}/canary.log
      - name: Require restored sources and staged pack mirror
        if: always()
        run: |
          python3 tests/fixtures/scenario99.py cleanup "$PWD"
          test -z "$(git status --porcelain)"
          diff -rq packs build/ci-test/packs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canary-result-${{ matrix.shard }}
          path: build/results/
          if-no-files-found: error
          compression-level: 0

  canary-completeness:
    name: Canary completeness
    if: always()
    needs: [build-canary, canary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: canary-plan
          path: build/plan
      - uses: actions/download-artifact@v8
        with:
          pattern: canary-result-*
          merge-multiple: true
          path: build/results
      - name: Require all selected rows, disjoint groups, and predicate teeth
        run: python3 scripts/ci/canary_matrix.py --plan build/plan/plan.json --results build/results
      - name: Require successful producer and every worker job
        if: always()
        env:
          PRODUCER_RESULT: ${{ needs['build-canary'].result }}
          WORKER_RESULT: ${{ needs['canary'].result }}
        run: |
          test "$PRODUCER_RESULT" = success
          test "$WORKER_RESULT" = success

  x11-display:
    name: X11 Display Lane
    needs: build-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: canary-bundle
          path: build/nix-cache
      - name: Restore compiled normal configuration without rebuilding
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - name: Exercise one and two real X screens
        run: bash scripts/ci/run_x11_display_lane.sh build/ci-test

  campaign-drift:
    name: Campaign Regeneration Drift Check
    needs: build-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-nix # v31
      - uses: actions/download-artifact@v8
        with:
          name: canary-bundle
          path: build/nix-cache
      - name: Restore compiled normal configuration without rebuilding
        run: |
          python3 scripts/ci/nix_bundle.py restore --cache build/nix-cache --repo "$PWD"
      - name: Run all compiled campaign generators
        run: |
          build/ci-test/concept_mapgen campaigns/concept
          build/ci-test/imaginations_mapgen campaigns/imaginations
          build/ci-test/longseason_mapgen campaigns/longseason
          build/ci-test/modes_mapgen campaigns/modes
          build/ci-test/tower_mapgen campaigns/tower
          build/ci-test/westlands_mapgen campaigns/westlands
      - name: Require committed generator output
        run: |
          if [ -n "$(git status --porcelain -- campaigns/)" ]; then
            git status --porcelain -- campaigns/
            git --no-pager diff --stat -- campaigns/
            echo '::error::Committed campaign trees drifted from their generators.'
            exit 1
          fi
