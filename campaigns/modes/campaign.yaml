description:     |
    One arena, seven games, one
    book. The Gamesmaster calls
    team deathmatch, capture the
    flag, onslaught, mutant,
    soccer, basketball, and free
    for all across thirty-nine
    fields old and new. The bots
    know the rules. Respawns honor
    your difficulty. First to the
    posted score takes the purse.
