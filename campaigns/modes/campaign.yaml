description:     |
    Seven games, forty arenas:
    team deathmatch, capture
    the flag, onslaught,
    mutant, soccer, basketball
    and free for all. Pick a
    game and an arena, set the
    teams and the rules, then
    GO. Bots fill the empty
    sides. Find SETUP on the
    Base Camp.
