description:     |
    One arena, five games, one book.
    The Gamesmaster calls team
    deathmatch, capture the flag,
    onslaught, mutant, and soccer
    across twenty-eight fields old
    and new. The bots know the rules.
    Respawns honor your difficulty.
    First to the posted score takes
    the purse.
