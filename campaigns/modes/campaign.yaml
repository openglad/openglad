description:     |
    One arena, six games, one book.
    The Gamesmaster calls team
    deathmatch, capture the flag,
    onslaught, mutant, soccer, and
    basketball across thirty-three
    fields old and new. The bots
    know the rules. Respawns honor
    your difficulty. First to the
    posted score takes the purse.
