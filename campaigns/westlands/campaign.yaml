description:     |
    The Westlands burn. A small
    burden must cross a great war:
    the flight through the forest,
    the dark road under the mountain,
    sieges of wall and gate and city,
    marsh and spider-pass and ash —
    until two roads meet again at
    the Mountain of Fire, and all
    is weighed in the crack of the
    world.
